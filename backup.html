<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة النسخ الاحتياطي الشامل</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-slate-50 to-slate-100 min-h-screen p-4 md:p-8 flex items-center justify-center">

<div class="max-w-md w-full bg-white shadow-2xl rounded-2xl p-6 border border-slate-100">
    
    <div class="text-center mb-6">
        <div class="inline-flex p-3 bg-green-50 text-green-600 rounded-full mb-3 shadow-inner">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
            </svg>
        </div>
        <h1 class="text-xl font-bold text-slate-800">مركز النسخ الاحتياطي المتقدم</h1>
        <p class="text-xs text-slate-400 mt-1">تصدير كافة البيانات الحية إلى ملف Excel مقروء وقابل للمراجعة</p>
    </div>

    <div class="space-y-4">
        <button id="backupBtn" onclick="runComprehensiveBackup()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-green-600/20 transition flex items-center justify-center gap-2 outline-none">
            📥 إنشاء وتنزيل نسخة Excel للمراجعة
        </button>

        <button onclick="history.back()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-2.5 px-4 rounded-xl transition text-sm">
            رجوع للخلف
        </button>
    </div>

    <div class="mt-6 border-t pt-4">
        <div id="status" class="text-sm font-medium text-center text-slate-500 mb-2">اضغط على الزر أعلاه للبدء</div>
        
        <div id="progressContainer" class="w-full bg-slate-100 rounded-full h-3 overflow-hidden hidden">
            <div id="progressBar" class="bg-green-500 h-full w-0 transition-all duration-300 rounded-full"></div>
        </div>
    </div>

    <div class="mt-4 bg-blue-50/60 border border-blue-100 p-3 rounded-xl text-xs text-blue-800 leading-relaxed">
        <strong>💡 ملاحظة أمان ومراجعة:</strong> الملف الناتج يحتوي على كافة بيانات جداولك الرئيسية (المنتجات، المنصرفات، والمبيعات). يمكنك فتحه فوراً ببرنامج Microsoft Excel ومطابقة الأرقام والربحية يدوياً.
    </div>

</div>

<script>
// ================== Supabase Client ==================
const supabaseUrl = "https://vmxbedovoahuggfpcmyk.supabase.co";
const supabaseKey = "sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

async function runComprehensiveBackup() {
    const statusText = document.getElementById('status');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const backupBtn = document.getElementById('backupBtn');

    // تجهيز الواجهة للبدء
    backupBtn.disabled = true;
    backupBtn.classList.add('opacity-50', 'cursor-not-allowed');
    progressContainer.classList.remove('hidden');
    progressBar.style.width = '10%';
    
    try {
        // الخطوة 1: جلب بيانات جدول المنتجات
        statusText.textContent = "⏳ جلب سجلات المنتجات والأسعار...";
        const { data: products, error: err1 } = await supabaseClient.from("products").select("*");
        if(err1) throw err1;
        progressBar.style.width = '40%';

        // الخطوة 2: جلب بيانات جدول المنصرفات والتكاليف
        statusText.textContent = "⏳ جلب بيانات المنصرفات والتوزيع...";
        const { data: coasts, error: err2 } = await supabaseClient.from("coasts").select("*");
        if(err2) throw err2;
        progressBar.style.width = '70%';

        // الخطوة 3: جلب سجلات المبيعات وتفاصيل الفواتير
        statusText.textContent = "⏳ جلب حركات المبيعات التفصيلية...";
        const { data: sales, error: err3 } = await supabaseClient.from("orders_details").select("*");
        if(err3) throw err3;
        progressBar.style.width = '90%';

        // الخطوة 4: بناء كتاب العمل لملف Excel (Workbook)
        statusText.textContent = "⚙️ معالجة البيانات وبناء ملف المراجعة...";
        
        const workbook = XLSX.utils.book_new();

        // تحويل المصفوفات البرمجية إلى جداول Excel
        const productsSheet = XLSX.utils.json_to_sheet(products || []);
        const coastsSheet = XLSX.utils.json_to_sheet(coasts || []);
        const salesSheet = XLSX.utils.json_to_sheet(sales || []);

        // تسمية وتخصيص الصفحات داخل ملف الـ Excel لسهولة المراجعة
        XLSX.utils.book_append_sheet(workbook, productsSheet, "مخزون المنتجات");
        XLSX.utils.book_append_sheet(workbook, coastsSheet, "المنصرفات والتكاليف");
        XLSX.utils.book_append_sheet(workbook, salesSheet, "حركات المبيعات");

        // الخطوة 5: توليد الملف وتحميله تلقائياً للمستخدم
        const timestamp = new Date().toISOString().slice(0, 10);
        const fileName = `نظام_المخازن_نسخة_احتياطية_${timestamp}.xlsx`;
        
        XLSX.writeFile(workbook, fileName);

        // إنهاء العملية بنجاح
        progressBar.style.width = '100%';
        statusText.innerHTML = "🎉 <span class='text-green-600 font-bold'>تم حفظ النسخة بنجاح ومراجعتها جاهزة!</span>";

    } catch (error) {
        console.error(error);
        statusText.innerHTML = "❌ <span class='text-red-600'>حدث خطأ: " + error.message + "</span>";
        progressBar.style.width = '0%';
    } finally {
        backupBtn.disabled = false;
        backupBtn.classList.remove('opacity-50', 'cursor-not-allowed');
    }
}
</script>

</body>
</html>
