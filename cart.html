<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات - إتمام الطلب</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl md:text-3xl font-extrabold text-slate-800 flex items-center gap-2">🛒 سلة المشتريات</h1>
            <a href="store.html" class="text-blue-600 hover:underline font-bold text-sm">⬅️ العودة للمتجر</a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                <h2 class="font-bold text-slate-700 mb-4 border-b pb-2">القطع المختارة</h2>
                <div id="cartItems" class="divide-y divide-slate-100"></div>
            </div>

            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 h-fit space-y-4">
                <h2 class="font-bold text-slate-700 border-b pb-2">بيانات مستلم الشحنة</h2>
                
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">الاسم الكامل</label>
                    <input type="text" id="clientName" placeholder="محمد الشريف..." class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">رقم الهاتف للاتصال</label>
                    <input type="tel" id="clientPhone" placeholder="01xxxxxxxxx" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-400 text-left" dir="ltr">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">عنوان الشحن بالتفصيل</label>
                    <input type="text" id="clientAddress" placeholder="المنطقة، الشارع، رقم الشقة..." class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-400">
                </div>

                <div class="border-t pt-3 flex justify-between items-center font-bold text-lg">
                    <span class="text-slate-600">إجمالي الحساب:</span>
                    <span id="cartTotal" class="text-emerald-600">0.00 ج.م</span>
                </div>

                <button onclick="submitOrder()" id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-600/20 transition">
                    🛍️ إرسال الطلب للنظام سوبابيز
                </button>
            </div>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(
            "https://vmxbedovoahuggfpcmyk.supabase.co",
            "sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"
        );

        let cart = JSON.parse(localStorage.getItem('customerCart')) || [];
        let globalTotal = 0;

        function renderCart() {
            let html = "";
            globalTotal = 0;

            if(cart.length === 0) {
                document.getElementById("cartItems").innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">سلتك فارغة تماماً.</div>`;
                document.getElementById("cartTotal").innerText = "0.00 ج.م";
                return;
            }

            cart.forEach((item, index) => {
                let price = Number(item.seal_price) || Number(item.sell_price) || Number(item.coasts_value) || 0;
                let quantity = Number(item.quantity) || 1;
                let subtotal = price * quantity;
                globalTotal += subtotal;

                html += `
                <div class="flex items-center gap-3 py-3">
                    <div class="flex-1">
                        <h4 class="font-bold text-slate-800 text-sm">${item.product_name || "منتج غير مسمى"}</h4>
                        <p class="text-xs text-slate-400">${price.toFixed(2)} ج.م × ${quantity}</p>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="changeQty(${index}, -1)" class="w-7 h-7 bg-slate-100 rounded-lg font-bold text-sm hover:bg-slate-200">-</button>
                        <span class="font-bold text-sm w-5 text-center">${quantity}</span>
                        <button onclick="changeQty(${index}, 1)" class="w-7 h-7 bg-slate-100 rounded-lg font-bold text-sm hover:bg-slate-200">+</button>
                    </div>
                    <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-600 font-bold text-xs p-1">❌</button>
                </div>`;
            });

            document.getElementById("cartItems").innerHTML = html;
            document.getElementById("cartTotal").innerText = globalTotal.toFixed(2) + " ج.م";
        }

        function changeQty(index, change) {
            cart[index].quantity = (Number(cart[index].quantity) || 1) + change;
            if (cart[index].quantity <= 0) cart.splice(index, 1);
            localStorage.setItem('customerCart', JSON.stringify(cart));
            renderCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('customerCart', JSON.stringify(cart));
            renderCart();
        }

        // دالة إرسال الفاتورة المتوافقة تماماً والمترابطة مع الـ POS لعدم تدمير الفواتير القديمة
        async function submitOrder() {
            const name = document.getElementById("clientName").value.trim();
            const phone = document.getElementById("clientPhone").value.trim();
            const address = document.getElementById("clientAddress").value.trim();

            if(!name || !phone || !address) return alert("الرجاء تعبئة بيانات الشحن كاملة!");
            if(cart.length === 0) return alert("السلة فارغة!");

            const btn = document.getElementById("btnSubmit");
            btn.disabled = true;
            btn.innerText = "جاري حجز الفاتورة وتأمين الطلب...";

            try {
                const currentDateTime = new Date().toISOString();
                
                // --- الخطوة الأولى: إنشاء رأس الفاتورة في orders_o لاستخراج رقم الفاتورة ---
                // نمرر حقل customer_id كقيمة فارغة (null) لأن الزبون من المتجر الخارجي، أو يمكنك ربطه بعميل افتراضي
                const { data: orderData, error: orderError } = await supabaseClient
                    .from("orders_o")
                    .insert([{
                        customer_id: null, 
                        date_order: currentDateTime,
                        pay_method: "عند الاستلام",
                        seal_man: "المتجر الإلكتروني"
                    }]).select();

                if (orderError) throw orderError;
                if (!orderData || orderData.length === 0) throw new Error("لم يتم إرجاع معرف الفاتورة بنجاح.");

                const generatedOrderId = orderData[0].id_order; // رقم الفاتورة الحقيقي المولد من سوبابيز

                // --- الخطوة الثانية: تجهيز تفاصيل الفاتورة وإدراجها مع رقم الفاتورة الصحيح ---
                const detailsToInsert = cart.map(item => {
                    let itemPrice = Number(item.seal_price) || Number(item.sell_price) || Number(item.coasts_value) || 0;
                    let itemQte = Number(item.quantity) || 1;
                    
                    return {
                        id_product: Number(item.id_product),   // كود ربط حقيقي بجدول المنتجات
                        id_order: generatedOrderId,            // ربط حقيقي برأس الفاتورة المستخرج لمنع أخطاء الـ POS
                        qte: itemQte,
                        price: itemPrice,
                        descount: 0,
                        amount: itemPrice * itemQte,
                        total_amount: itemPrice * itemQte,
                        id_customer: null,                     // زبون أونلاين خارجي
                        date_order: currentDateTime,
                        pay_method: "عند الاستلام",
                        description_order: `العنوان: ${address} | الهاتف: ${phone}`,
                        seal_man: "المتجر الإلكتروني",
                        first_name: name                       // اسم صاحب الطلب الخارجي
                    };
                });

                // ترحيل تفاصيل العمليات بالكامل دفعة واحدة لجدول الأسطر
                const { error: detailsError } = await supabaseClient
                    .from("orders_details")
                    .insert(detailsToInsert);

                if (detailsError) throw detailsError;

                alert(`🎉 ممتاز! تم استلام طلبك بنجاح.\nرقم الفاتورة الموحد في نظامك هو: ${generatedOrderId}`);
                
                localStorage.removeItem('customerCart');
                window.location.href = "store.html";

            } catch (error) {
                console.error("تفاصيل الخطأ المحاسبي:", error);
                alert("حدث خطأ أثناء معالجة وحفظ الفاتورة:\n" + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "🛍️ إرسال الطلب للنظام سوبابيز";
            }
        }

        renderCart();
    </script>
</body>
</html>
