<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات - إتمام الطلب</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8 pb-24 md:pb-8">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl md:text-3xl font-extrabold text-slate-800 flex items-center gap-2">🛒 سلة المشتريات</h1>
            <a href="store.html" class="text-blue-600 hover:underline font-bold text-sm">⬅️ العودة للمتجر</a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- قسم القطع المختارة -->
            <div class="lg:col-span-2 bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                <h2 class="font-bold text-slate-700 mb-4 border-b pb-2">القطع المختارة</h2>
                <div id="cartItems" class="divide-y divide-slate-100"></div>
            </div>

            <!-- قسم الفاتورة وبيانات الشحن -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 h-fit space-y-4">
                <h2 class="font-bold text-slate-700 border-b pb-2">بيانات مستلم الشحنة</h2>
                
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">الاسم الكامل</label>
                    <input type="text" id="clientName" placeholder="محمد صافي الدين ..." class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">رقم الهاتف للاتصال</label>
                    <input type="tel" id="clientPhone" placeholder="0912345678 أو +249122324890" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-400 text-left" dir="ltr">
                </div>
                
                <!-- اختيار المنطقة ديناميكياً من قاعدة البيانات -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">المحافظة / منطقة الشحن</label>
                    <select id="clientRegion" onchange="updateShippingCost()" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-400 bg-white">
                        <option value="" data-cost="0">جاري تحميل المناطق...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">العنوان بالتفصيل (الشارع / رقم المبنى)</label>
                    <input type="text" id="clientAddress" placeholder="اسم الشارع، رقم العقار والشقة..." class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-400">
                </div>

                <!-- تفاصيل الحساب الديناميكية المتوافقة مع السعر المختار -->
                <div class="border-t pt-3 space-y-2 text-sm font-semibold text-slate-600">
                    <div class="flex justify-between items-center">
                        <span>إجمالي المنتجات:</span>
                        <span id="productsTotal">0.00 ج.س</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span>تكلفة التوصيل للمنطقة:</span>
                        <span id="shippingTotal" class="text-amber-600 font-bold">0.00 ج.س</span>
                    </div>
                    <div class="flex justify-between items-center font-bold text-lg border-t pt-2 mt-1">
                        <span class="text-slate-800">إجمالي الحساب النهائي:</span>
                        <span id="cartTotal" class="text-emerald-600">0.00 ج.س</span>
                    </div>
                </div>

                <button onclick="submitOrder()" id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-600/20 transition cursor-pointer">
                    🛍️ إرسال الطلب لنظام المبيعات
                </button>

                <!-- قسم التواصل المباشر الجانبي (لشاشات الكمبيوتر والتابلت) -->
                <div class="border-t pt-4 mt-2 hidden md:block">
                    <p class="text-xs font-bold text-slate-400 mb-2 text-center">هل تحتاج للاستفسار عن منتج قبل الطلب؟</p>
                    <div class="grid grid-cols-2 gap-2">
                        <a href="https://wa.me/+249918237606" target="_blank" class="flex items-center justify-center gap-1 bg-green-500 hover:bg-green-600 text-white text-xs font-bold py-2 px-3 rounded-xl transition text-center">
                            💬 واتساب الإدارة
                        </a>
                        <a href="tel:+249122324890" class="flex items-center justify-center gap-1 bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold py-2 px-3 rounded-xl transition text-center">
                            📞 اتصال هاتفي
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- شريط تواصل عائم وثابت أسفل الشاشة (ممتاز لمستخدمي الهواتف الذكية) -->
    <div class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 p-3 shadow-xl z-50 md:hidden flex items-center justify-between gap-3">
        <div class="text-right">
            <p class="text-[10px] font-bold text-slate-400">للاستفسار وتفاصيل المنتجات:</p>
            <p class="text-xs font-extrabold text-slate-700">مؤسسة ABM</p>
        </div>
        <div class="flex gap-2">
            <a href="https://wa.me/+249918237606" target="_blank" class="flex items-center gap-1 bg-green-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md">
                💬 واتساب
            </a>
            <a href="tel:+249122324890" class="flex items-center gap-1 bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md">
                📞 إتصل بنا
            </a>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(
            "https://vmxbedovoahuggfpcmyk.supabase.co",
            "sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"
        );

        let cart = JSON.parse(localStorage.getItem('customerCart')) || [];
        let productsSubtotal = 0;
        let currentShippingCost = 0;
        let globalTotal = 0; 

        // دالة لمعالجة وتنسيق رقم الهاتف السوداني
        function formatSudanPhone(phoneInput) {
            let cleanNumber = phoneInput.replace(/\D/g, ''); // إزالة الأشكال والمسافات
            if (cleanNumber.startsWith('0')) {
                cleanNumber = cleanNumber.substring(1);
            }
            if (!cleanNumber.startsWith('249')) {
                cleanNumber = '249' + cleanNumber;
            }
            return '+' + cleanNumber;
        }

        // 1. جلب قائمة المحافظات/المناطق ديناميكياً
        async function fetchRegions() {
            try {
                const { data, error } = await supabaseClient
                    .from("shipping_settings")
                    .select("*")
                    .order("region_name", { ascending: true });

                if (error) throw error;

                const regionSelect = document.getElementById("clientRegion");
                let optionsHTML = '<option value="" data-cost="0">-- اختر الحي/المنطقة --</option>';
                
                if (data && data.length > 0) {
                    data.forEach(region => {
                        optionsHTML += `<option value="${region.region_name}" data-cost="${region.shipping_cost}">${region.region_name} (${Number(region.shipping_cost).toFixed(2)} ج.س)</option>`;
                    });
                } else {
                    optionsHTML = '<option value="شحن عام" data-cost="4000">شحن موحد (4000.00 ج.س)</option>';
                }
                
                regionSelect.innerHTML = optionsHTML;
            } catch (err) {
                console.error("خطأ في جلب مناطق الشحن:", err);
                document.getElementById("clientRegion").innerHTML = '<option value="شحن عام" data-cost="4000">شحن موحد (4000.00 ج.س)</option>';
            }
        }

        // 2. تحديث قيمة الشحن والإجمالي الكلي
        function updateShippingCost() {
            const selectEl = document.getElementById("clientRegion");
            const selectedOption = selectEl.options[selectEl.selectedIndex];
            
            currentShippingCost = Number(selectedOption.getAttribute("data-cost")) || 0;
            calculateFinalTotals();
        }

        // 3. دالة استعراض وحساب سلة المشتريات
        function renderCart() {
            let html = "";
            productsSubtotal = 0;

            if(cart.length === 0) {
                document.getElementById("cartItems").innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">سلتك فارغة تماماً.</div>`;
                document.getElementById("productsTotal").innerText = "0.00 ج.س";
                document.getElementById("shippingTotal").innerText = "0.00 ج.س";
                document.getElementById("cartTotal").innerText = "0.00 ج.س";
                globalTotal = 0;
                return;
            }

            cart.forEach((item, index) => {
                let price = Number(item.seal_price) || Number(item.sell_price) || Number(item.coasts_value) || 0;
                let quantity = Number(item.quantity) || 1;
                let itemTotal = price * quantity;
                productsSubtotal += itemTotal;

                html += `
                <div class="flex items-center gap-3 py-3">
                    <div class="flex-1">
                        <h4 class="font-bold text-slate-800 text-sm">${item.product_name || "منتج غير مسمى"}</h4>
                        <p class="text-xs text-slate-400">${price.toFixed(2)} ج.س × ${quantity}</p>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="changeQty(${index}, -1)" class="w-7 h-7 bg-slate-100 rounded-lg font-bold text-sm hover:bg-slate-200 cursor-pointer">-</button>
                        <span class="font-bold text-sm w-5 text-center">${quantity}</span>
                        <button onclick="changeQty(${index}, 1)" class="w-7 h-7 bg-slate-100 rounded-lg font-bold text-sm hover:bg-slate-200 cursor-pointer">+</button>
                    </div>
                    <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-600 font-bold text-xs p-1 cursor-pointer">❌</button>
                </div>`;
            });

            document.getElementById("cartItems").innerHTML = html;
            calculateFinalTotals();
        }

        // 4. تجميعة الحسابات وتحديث أرقام الفاتورة
        function calculateFinalTotals() {
            globalTotal = productsSubtotal + currentShippingCost;
            
            document.getElementById("productsTotal").innerText = productsSubtotal.toFixed(2) + " ج.س";
            document.getElementById("shippingTotal").innerText = currentShippingCost.toFixed(2) + " ج.س";
            document.getElementById("cartTotal").innerText = globalTotal.toFixed(2) + " ج.س";
        }

        function changeQty(index, change) {
            cart[index].quantity = (Number(cart[index].quantity) || 1) + change;
            if (cart[index].quantity <= 0) cart.splice(index, 1);
            localStorage.setItem('customerCart', JSON.stringify(cart));
            renderCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('customerCart', JSON.stringify(cart));
            renderCart();
        }

        // 5. رفع الطلب المعتمد وتنسيق رقم الهاتف وتجهيز رسالة الواتساب
        async function submitOrder() {
            const name = document.getElementById("clientName").value.trim();
            const rawPhone = document.getElementById("clientPhone").value.trim();
            const region = document.getElementById("clientRegion").value;
            const addressDetails = document.getElementById("clientAddress").value.trim();

            if(!name || !rawPhone || !region || !addressDetails) {
                return alert("الرجاء تحديد منطقة الشحن وتعبئة كامل بيانات العميل!");
            }
            if(cart.length === 0) return alert("السلة فارغة!");

            // تنسيق رقم الهاتف ليحتوي دائماً على المفتاح الدولي (+249)
            const phone = formatSudanPhone(rawPhone);

            const btn = document.getElementById("btnSubmit");
            btn.disabled = true;
            btn.innerText = "جاري إرسال طلبك...";

            const fullAddress = `${region} - ${addressDetails}`;

            try {
                // 1. رفع رأس الطلب الكلي
                const { data: webOrder, error: orderError } = await supabaseClient
                    .from("web_orders")
                    .insert([{
                        client_name: name,
                        client_phone: phone,
                        client_address: fullAddress,
                        total_amount: globalTotal,
                        order_status: "قيد المراجعة"
                    }]).select();

                if (orderError) throw orderError;
                const newWebOrderId = webOrder[0].id_web_order;

                // 2. تجهيز سجلات تفاصيل الأصناف المشتراة
                const detailsToInsert = cart.map(item => {
                    let itemPrice = Number(item.seal_price) || Number(item.sell_price) || Number(item.coasts_value) || 0;
                    let itemQte = Number(item.quantity) || 1;
                    return {
                        id_web_order: newWebOrderId,
                        id_product: Number(item.id_product),
                        product_name: item.product_name,
                        qte: itemQte,
                        price: itemPrice,
                        amount: itemPrice * itemQte
                    };
                });

                // 3. رفع السجلات التابعة
                const { error: detailsError } = await supabaseClient
                    .from("web_order_details")
                    .insert(detailsToInsert);

                if (detailsError) throw detailsError;

                // 4. إخلاء السلة والتوجيه لواتساب الإدارة
                localStorage.removeItem('customerCart');
                
                const storeWhatsapp = "249918237606"; // رقم واتساب المتجر بدون +
                const whatsappMsg = encodeURIComponent(`مرحباً، تم إرسال طلب جديد من الموقع:\n\n📦 رقم الطلب: #${newWebOrderId}\n👤 الاسم: ${name}\n📞 الهاتف: ${phone}\n📍 العنوان: ${fullAddress}\n💵 الإجمالي: ${globalTotal.toFixed(2)} ج.س`);

                alert(`🎉 تم استلام طلبك بنجاح وسيتصل بك مندوبنا للتأكيد.\nرقم الطلب: #${newWebOrderId}`);

                // فتح واتساب لإرسال ملخص الطلب
                window.location.href = `https://wa.me/${storeWhatsapp}?text=${whatsappMsg}`;

            } catch (error) {
                console.error(error);
                alert("خطأ أثناء إرسال الطلب: " + error.message);
                btn.disabled = false;
                btn.innerText = "🛍️ إرسال الطلب لنظام المبيعات";
            }
        }

        window.onload = async function() {
            await fetchRegions(); 
            renderCart();         
        };
    </script>
</body>
</html>
