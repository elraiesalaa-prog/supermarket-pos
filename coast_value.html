<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توزيع التكاليف على الطلبيات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-blue-50 to-blue-100 min-h-screen p-3 md:p-6">

<div class="max-w-7xl mx-auto bg-white shadow-xl rounded-xl p-4 md:p-6">

    <h1 class="text-xl md:text-3xl font-bold text-center text-blue-700 mb-6">
        تقرير توزيع التكاليف على الطلبيات
    </h1>

    <div class="flex flex-wrap gap-2 justify-between mb-4">
        <button onclick="history.back()" class="bg-gray-600 text-white px-3 py-2 rounded w-full md:w-auto">رجوع</button>
        <button onclick="logout()" class="bg-gray-600 text-white px-3 py-2 rounded w-full md:w-auto">خروج</button>
    </div>

    <div class="mb-4">
        <input id="searchInput" type="text" onkeyup="renderTable()" placeholder="🔍 بحث سريع برقم الطلبية، البيان، أو النوع..." class="w-full border px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">
        <div>
            <label class="font-bold text-gray-700">رقم الطلبية (مؤشر الربط الرئيسي) <span class="text-red-500">*</span></label>
            <input id="req_id" type="text" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-400 outline-none">
        </div>

        <div>
            <label class="font-bold text-gray-500">رقم المنتج (اختياري - إن وجد)</label>
            <input id="product_num" type="number" placeholder="اتركه فارغاً للتوزيع على الطلبية كاملة" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-400 outline-none">
        </div>

        <div>
            <label class="font-bold text-gray-700">القيمة المالية <span class="text-red-500">*</span></label>
            <input id="coast_value" type="number" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-400 outline-none">
        </div>

        <div>
            <label class="font-bold text-gray-700">نوع المنصرف</label>
            <select id="c_type" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-400 outline-none">
                <option value="تكلفة منتجات">تكلفة منتجات</option>
                <option value="منصرفات محلية">منصرفات محلية</option>
                <option value="تكاليف اخرى">تكاليف اخرى</option>
            </select>
        </div>

        <div>
            <label class="font-bold text-gray-700">التاريخ</label>
            <input id="co_date" type="date" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-400 outline-none">
        </div>

        <div class="md:col-span-2">
            <label class="font-bold text-gray-700">البيان والشرح</label>
            <input id="coast_discription" type="text" class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-400 outline-none">
        </div>
    </div>

    <div class="flex flex-wrap gap-2 mb-6">
        <button id="addBtn" onclick="addCoast()" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded font-bold w-full md:w-auto">إضافة منصرف</button>
        <button id="updateBtn" onclick="updateCoast()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-5 py-2 rounded font-bold w-full md:w-auto">تعديل</button>
        <button onclick="clearForm()" class="bg-gray-500 hover:bg-gray-600 text-white px-5 py-2 rounded w-full md:w-auto">جديد / مسح</button>
        <a href="index.html" class="bg-blue-600 text-white px-5 py-2 rounded text-center w-full md:w-auto font-bold">الرئيسية</a>
    </div>

    <div class="overflow-x-auto border rounded-xl shadow-sm">
        <table class="w-full border text-center min-w-[900px] text-sm">
            <thead class="bg-blue-600 text-white">
                <tr>
                    <th class="p-3">رقم</th>
                    <th class="p-3">رقم الطلبية</th>
                    <th class="p-3">المنتج المستهدف</th>
                    <th class="p-3">إجمالي منصرفات الطلبية</th>
                    <th class="p-3">عدد أصنافها</th>
                    <th class="p-3 bg-blue-700">نصيب الصنف الواحد</th>
                    <th class="p-3">النوع</th>
                    <th class="p-3 text-right">البيان</th>
                    <th class="p-3">التاريخ</th>
                    <th class="p-3">تعديل</th>
                    <th class="p-3">حذف</th>
                </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-gray-100 bg-white"></tbody>
        </table>
    </div>

    <div class="mt-6 text-center">
        <button onclick="distributeCosts()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-6 py-3 rounded-lg shadow-md transition w-full md:w-auto text-base">
            ⚙️ تفعيل توزيع التكاليف على مخزون الطلبيات الحية
        </button>
    </div>

</div>

<script>
const supabaseUrl = "https://vmxbedovoahuggfpcmyk.supabase.co";
const supabaseKey = "sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

let editID = null;
let coastsData = [];
const updateBtn = document.getElementById("updateBtn");

// تحميل التكاليف
async function loadCoasts(){
    const { data } = await supabaseClient.from("coasts").select("*").order("coast_id",{ascending:false});
    coastsData = data || [];
    await renderTable();
}

// جلب عدد الأصناف الفريدة المرتبطة برقم الطلبية
async function getProductCount(req_id){
    if(!req_id) return 0;
    const { count } = await supabaseClient
        .from("products")
        .select("*", { count: "exact", head: true })
        .eq("req_id", req_id);
    return count || 0;
}

// عرض البيانات بالجدول ديناميكياً
async function renderTable(){
    const searchTerm = document.getElementById("searchInput").value.toLowerCase();
    let table = "";

    // استخراج أرقام الطلبيات الفريدة المتوفرة بسجل التكاليف
    const reqIDs = [...new Set(coastsData.map(c => c.req_id).filter(Boolean))];

    for(const req_id of reqIDs){
        const productCount = await getProductCount(req_id);
        const group = coastsData.filter(c => c.req_id === req_id);
        
        // حساب إجمالي التكاليف المربوطة بهذه الطلبية
        const totalCost = group.reduce((sum,c)=> sum + Number(c.coast_value || 0), 0);
        const perProductCost = productCount > 0 ? (totalCost / productCount).toFixed(2) : 0;

        group.forEach(row => {
            if(
                (row.req_id || "").toLowerCase().includes(searchTerm) ||
                (row.coast_discription || "").toLowerCase().includes(searchTerm) ||
                (row.c_type || "").toLowerCase().includes(searchTerm)
            ){
                table += `
                <tr class="hover:bg-gray-50 transition">
                    <td class="p-3 text-gray-400 font-mono">${row.coast_id}</td>
                    <td class="p-3 font-bold text-blue-700">${row.req_id}</td>
                    <td class="p-3 text-xs text-gray-500">${row.product_num ? '📦 منتج: ' + row.product_num : '📂 الطلبية كاملة'}</td>
                    <td class="p-3 font-semibold text-gray-700">${totalCost.toLocaleString()}</td>
                    <td class="p-3">${productCount} أصناف</td>
                    <td class="p-3 bg-blue-50 font-bold text-blue-900">${perProductCost}</td>
                    <td class="p-3"><span class="px-2 py-0.5 rounded bg-slate-100 text-xs">${row.c_type}</span></td>
                    <td class="p-3 text-right max-w-xs truncate">${row.coast_discription || ""}</td>
                    <td class="p-3 text-xs text-gray-500">${row.co_date || ""}</td>
                    <td class="p-3"><button onclick="editRow(${row.coast_id})" class="bg-yellow-400 hover:bg-yellow-500 text-xs px-2 py-1 rounded">تعديل</button></td>
                    <td class="p-3"><button onclick="deleteRow(${row.coast_id})" class="bg-red-600 hover:bg-red-700 text-white text-xs px-2 py-1 rounded">حذف</button></td>
                </tr>`;
            }
        });
    }
    document.getElementById("tableBody").innerHTML = table;
}

// إضافة منصرف جديد
async function addCoast(){
    const req = document.getElementById("req_id").value.trim();
    const value = document.getElementById("coast_value").value;

    if(!req || !value) {
        alert("يرجى ملء الحقول الإلزامية: رقم الطلبية والقيمة");
        return;
    }

    const type = document.getElementById("c_type").value;
    const desc = document.getElementById("coast_discription").value;
    const date = document.getElementById("co_date").value;
    const product_num = document.getElementById("product_num").value.trim() || null;

    await supabaseClient.from("coasts").insert([{ 
        coast_value: Number(value), 
        c_type: type, 
        coast_discription: desc, 
        co_date: date, 
        req_id: req, 
        product_num: product_num ? Number(product_num) : null 
    }]);

    clearForm();
    loadCoasts();
}

// تجهيز الحقول للتعديل
async function editRow(id){
    editID = id;
    const { data } = await supabaseClient.from("coasts").select("*").eq("coast_id", id).single();

    document.getElementById("coast_value").value = data.coast_value;
    document.getElementById("c_type").value = data.c_type;
    document.getElementById("coast_discription").value = data.coast_discription;
    document.getElementById("co_date").value = data.co_date;
    document.getElementById("req_id").value = data.req_id;
    document.getElementById("product_num").value = data.product_num || "";

    updateBtn.textContent = "حفظ التعديل الحالي";
}

// حفظ التعديلات
async function updateCoast(){
    if(!editID) return alert("الرجاء اختيار سجل لتعديله من الجدول أولاً");

    const req = document.getElementById("req_id").value.trim();
    const value = document.getElementById("coast_value").value;
    const type = document.getElementById("c_type").value;
    const desc = document.getElementById("coast_discription").value;
    const date = document.getElementById("co_date").value;
    const product_num = document.getElementById("product_num").value.trim() || null;

    await supabaseClient.from("coasts")
        .update({ 
            coast_value: Number(value), 
            c_type: type, 
            coast_discription: desc, 
            co_date: date, 
            req_id: req, 
            product_num: product_num ? Number(product_num) : null 
        })
        .eq("coast_id", editID);

    updateBtn.textContent = "تعديل";
    clearForm();
    loadCoasts();
}

// حذف سجل التكلفة
async function deleteRow(id){
    if(!confirm("هل أنت متأكد من حذف سجل هذا المنصرف؟")) return;
    await supabaseClient.from("coasts").delete().eq("coast_id", id);
    loadCoasts();
}

// تصفية مدخلات الاستمارة
function clearForm(){
    editID = null;
    document.getElementById("coast_value").value = "";
    document.getElementById("coast_discription").value = "";
    document.getElementById("co_date").value = "";
    document.getElementById("req_id").value = "";
    document.getElementById("product_num").value = "";
    updateBtn.textContent = "تعديل";
}

// دالة التوزيع الذكية والمحسّنة للتكاليف على جدول المنتجات
async function distributeCosts(){
    const { data: coasts } = await supabaseClient.from("coasts").select("req_id, coast_value");
    if(!coasts || coasts.length === 0) return alert("لا توجد بيانات منصرفات لتوزيعها حالياً");

    const reqIDs = [...new Set(coasts.map(c => c.req_id).filter(Boolean))];

    for(const req of reqIDs){
        // تجميع التكاليف الإجمالية للطلبية المستهدفة
        const totalCost = coasts
            .filter(c => c.req_id === req)
            .reduce((sum, c) => sum + Number(c.coast_value || 0), 0);

        // حساب عدد أصناف المنتجات المرتبطة بتلك الطلبية
        const { count } = await supabaseClient
            .from("products")
            .select("*", { count: "exact", head: true })
            .eq("req_id", req);

        const productCount = count || 0;
        if(productCount === 0) continue;

        // نصيب الصنف الواحد بالتساوي داخل الشحنة
        const costPerProduct = totalCost / productCount;

        // تحديث الحقل المخصص للتكاليف بجدول المنتجات
        await supabaseClient
            .from("products")
            .update({ coasts_value: costPerProduct })
            .eq("req_id", req);
    }

    alert("🚀 تم توزيع كافة التكاليف بالتساوي بناءً على أرقام الطلبيات بنجاح!");
}

// تحميل أولي للبيانات
loadCoasts();

function logout(){
    window.location.href="index.html";
}
</script>

</body>
</html>
