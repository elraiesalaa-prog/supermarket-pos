<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الأزياء الإلكتروني</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🛍️</span>
                <span class="text-xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">ABM للملبوسات</span>
            </div>
            
            <a href="cart.html" class="relative bg-slate-100 hover:bg-slate-200 p-2.5 rounded-xl transition flex items-center gap-2 font-bold text-sm">
                <span>🛒 سلة المشتريات</span>
                <span id="cartCount" class="bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full">0</span>
            </a>
        </div>
    </nav>

    <header class="relative bg-slate-900 text-white overflow-hidden py-16 px-4 text-center">
        <div class="absolute inset-0 opacity-40 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1000&auto=format&fit=crop');"></div>
        <div class="relative max-w-2xl mx-auto z-10">
            <h1 class="text-3xl md:text-5xl font-extrabold mb-4">أحدث صيحات الموضة والأزياء</h1>
            <p class="text-sm md:text-base text-slate-300">اكتشف تشكيلتنا الجديدة المتميزة المتزامنة مباشرة مع مخازننا.</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-10">
        <h2 class="text-xl md:text-2xl font-bold mb-6 flex items-center gap-2">✨ أحدث معروضاتنا</h2>
        
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-12 text-slate-400 text-sm">جاري تحديث الملبوسات من سوبابيز...</div>
        </div>
    </main>

    <script>
        const supabaseClient = supabase.createClient(
            "https://vmxbedovoahuggfpcmyk.supabase.co",
            "sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"
        );

        let products = [];
        let cart = JSON.parse(localStorage.getItem('customerCart')) || [];

        async function fetchProducts() {
            try {
                const { data, error } = await supabaseClient
                    .from("products")
                    .select("*");

                if (error) throw error;
                products = data;
                renderProducts();
            } catch (error) {
                console.error("خطأ أثناء جلب البيانات:", error);
                document.getElementById("productsGrid").innerHTML = `<div class="col-span-full text-center py-12 text-red-500">عذراً، فشل الاتصال بقاعدة البيانات الحية.</div>`;
            }
            updateCartCount();
        }

        // دالة ديناميكية متطورة لاستخراج السعر مهما كان اسم الحقل في جدولك
        function extractProductPrice(product) {
            // 1. الفحص المبدئي بناءً على المسميات الأكثر شيوعاً في الأنظمة المحاسبية
            const commonKeys = ['sell_price', 'price_sell', 'product_price', 'coasts_value', 'price', 'unit_price'];
            for (let key of commonKeys) {
                if (product[key] !== undefined && product[key] !== null && Number(product[key]) > 0) {
                    return Number(product[key]);
                }
            }

            // 2. فحص تلقائي شامل لجميع حقول الكائن في حال كان الحقل يمتلك اسماً مخصصاً تماماً
            for (let key in product) {
                // تجنب قراءة المعرفات والكميات كأنها أسعار
                if (key.toLowerCase().includes('id') || key.toLowerCase().includes('qte') || key.toLowerCase().includes('quantity') || key.toLowerCase().includes('count')) {
                    continue;
                }
                const value = Number(product[key]);
                // إذا وجدنا أي حقل عددي قيمته أكبر من 0 نعتبره السعر الافتراضي المتوفر
                if (!isNaN(value) && value > 0) {
                    return value;
                }
            }
            return 0; // القيمة الافتراضية إذا كان المنتج مجانياً أو فارغ السعر
        }

        function renderProducts() {
            let html = "";
            if(products.length === 0) {
                document.getElementById("productsGrid").innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">لا توجد منتجات معروضة حالياً.</div>`;
                return;
            }

            products.forEach(p => {
                // استخراج السعر والاسم ديناميكياً
                let price = extractProductPrice(p);
                let productName = p.product_name || p.name || Object.values(p).find(val => typeof val === 'string') || "منتج غير مسمى";
                let imgUrl = p.image_url || "https://images.unsplash.com/photo-1479064555552-3ef4979f8908?q=80&w=500";
                
                // البحث عن حقل المعرّف الفريد ديناميكياً لحساب إضافة السلة
                let idProduct = p.id_product || p.id || Object.values(p).find(val => typeof val === 'number');

                html += `
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md border border-slate-100 transition flex flex-col justify-between">
                    <img src="${imgUrl}" alt="${productName}" class="w-full h-56 object-cover bg-slate-100">
                    <div class="p-4 flex-1 flex flex-col justify-between gap-3">
                        <div>
                            <h3 class="font-bold text-slate-800 text-base line-clamp-2">${productName}</h3>
                            <div class="text-blue-600 font-extrabold text-lg mt-1">${Number(price).toFixed(2)} ج.م</div>
                        </div>
                        <button onclick="handleAddToCartClick(${idProduct}, ${price})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl transition text-sm">
                            ➕ إضافة للسلة
                        </button>
                    </div>
                </div>`;
            });
            document.getElementById("productsGrid").innerHTML = html;
        }

        function handleAddToCartClick(id, activePrice) {
            // البحث عن المنتج بالمعرف الديناميكي
            const product = products.find(p => (p.id_product || p.id) === id);
            if (!product) return;

            const targetId = product.id_product || product.id;
            const existingItem = cart.find(item => (item.id_product || item.id) === targetId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ 
                    ...product, 
                    id_product: targetId,
                    product_name: product.product_name || product.name,
                    quantity: 1, 
                    sell_price: activePrice 
                });
            }

            localStorage.setItem('customerCart', JSON.stringify(cart));
            updateCartCount();
        }

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById("cartCount").innerText = count;
        }

        fetchProducts();
    </script>
</body>
</html>
