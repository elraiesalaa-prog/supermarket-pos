<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلغاء المبيعات والمرتجع</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Tahoma', Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-6">

    <div class="max-w-5xl mx-auto bg-white shadow-xl rounded-xl p-4 md:p-6">
        
        <h1 class="text-2xl font-bold text-center text-red-600 mb-6 border-b pb-4">
            🔄 شاشة المرتجعات وإلغاء المبيعات
        </h1>

        <div class="bg-slate-50 p-4 rounded-lg border mb-6 flex flex-col md:flex-row gap-3 items-end">
            <div class="w-full md:w-1/3">
                <label class="block text-sm font-bold text-gray-700 mb-1">ابحث برقم الفاتورة (ID):</label>
                <input id="orderIdInput" type="number" placeholder="أدخل رقم الفاتورة..." 
                       class="w-full border p-2 rounded focus:ring-2 focus:ring-red-400 outline-none">
            </div>
            <button onclick="searchInvoice()" 
                    class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700 transition w-full md:w-auto h-[42px]">
                🔍 جلب بيانات الفاتورة
            </button>
        </div>

        <div id="invoiceSection" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-red-50 p-4 rounded-lg border border-red-200 mb-6 text-sm">
                <div><b>رقم الفاتورة:</b> <span id="info_id" class="text-red-700 font-bold"></span></div>
                <div><b>تاريخ البيع:</b> <span id="info_date"></span></div>
                <div><b>العميل:</b> <span id="info_customer"></span></div>
                <div><b>طريقة الدفع:</b> <span id="info_method"></span></div>
                <div><b>البائع:</b> <span id="info_seller" class="font-bold"></span></div>
                <div class="md:text-left text-lg font-bold text-red-600">
                    الإجمالي: <span id="info_total">0</span>
                </div>
            </div>

            <h3 class="font-bold text-gray-700 mb-2">📦 محتويات الفاتورة:</h3>
            <div class="overflow-x-auto border rounded-lg">
                <table class="w-full text-center border-collapse text-sm">
                    <thead class="bg-slate-800 text-white">
                        <tr>
                            <th class="p-3 text-right">اسم المنتج</th>
                            <th class="p-3">الكمية المباعة</th>
                            <th class="p-3">سعر البيع</th>
                            <th class="p-3">الإجمالي</th>
                            <th class="p-3">عملية المرتجع</th>
                        </tr>
                    </thead>
                    <tbody id="invoiceItemsBody" class="divide-y bg-white">
                        </tbody>
                </table>
            </div>

            <div class="mt-6 pt-4 border-t flex justify-end gap-3">
                <button onclick="cancelWholeInvoice()" 
                        class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-3 rounded-lg shadow-md transition">
                    🚨 إلغاء وحذف الفاتورة بالكامل (إرجاع كافة المخزون)
                </button>
            </div>
        </div>

        <div id="noDataPlaceholder" class="text-center py-12 text-gray-400">
            يرجى إدخال رقم فاتورة صحيح في الأعلى للبدء في إدارة المرتجعات.
        </div>

    </div>

    <script>
        // ================== Supabase Client ==================
        const supabaseClient = window.supabase.createClient(
            "https://vmxbedovoahuggfpcmyk.supabase.co",
            "sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"
        );

        let currentOrder = null;
        let currentDetails = [];
        let productMap = new Map();

        // جلب الفاتورة وتفاصيلها عند البحث
        async function searchInvoice() {
            const idInput = document.getElementById("orderIdInput").value.trim();
            if (!idInput) {
                alert("الرجاء إدخال رقم الفاتورة أولاً");
                return;
            }

            // 1. جلب رأس الفاتورة
            const { data: orderData, error: orderErr } = await supabaseClient
                .from("orders_o")
                .select("*")
                .eq("id_order", idInput)
                .single();

            if (orderErr || !orderData) {
                alert("الفاتورة غير موجودة، يرجى التحقق من الرقم المكتوب.");
                hideInvoiceData();
                return;
            }

            // 2. جلب تفاصيل الفاتورة
            const { data: detailsData, error: detailsErr } = await supabaseClient
                .from("orders_details")
                .select("*")
                .eq("id_order", idInput);

            if (detailsErr || !detailsData || detailsData.length === 0) {
                alert("لم يتم العثور على بنود مخزنة لهذه الفاتورة.");
                return;
            }

            // 3. جلب أسماء المنتجات للمطابقة
            const { data: productsData } = await supabaseClient.from("products").select("id_product, product_name, qte_in_stock");
            productMap.clear();
            if (productsData) {
                productsData.forEach(p => productMap.set(p.id_product, p));
            }

            currentOrder = orderData;
            currentDetails = detailsData;

            showInvoiceData();
        }

        // عرض البيانات في الواجهة
        function showInvoiceData() {
            document.getElementById("noDataPlaceholder").classList.add("hidden");
            document.getElementById("invoiceSection").classList.remove("hidden");

            document.getElementById("info_id").innerText = currentOrder.id_order;
            document.getElementById("info_date").innerText = new Date(currentOrder.date_order).toLocaleString("ar-EG");
            document.getElementById("info_customer").innerText = "عميل رقم (" + currentOrder.customer_id + ")";
            document.getElementById("info_method").innerText = currentOrder.pay_method === "cash" ? "نقدي" : currentOrder.pay_method === "bank" ? "تحويل" : "آجل";
            document.getElementById("info_seller").innerText = currentOrder.seal_man || "غير معروف";

            let total = 0;
            let html = "";

            currentDetails.forEach((item, index) => {
                const prod = productMap.get(item.id_product);
                const prodName = prod ? prod.product_name : "منتج غير مدرج حالياً";
                const lineTotal = item.total_amount || item.amount || (item.qte * item.price);
                total += Number(lineTotal);

                html += `
                <tr class="hover:bg-gray-50">
                    <td class="p-3 text-right font-medium text-gray-800">${prodName}</td>
                    <td class="p-3 font-bold">${item.qte}</td>
                    <td class="p-3">${Number(item.price).toLocaleString()}</td>
                    <td class="p-3 font-bold text-blue-600">${Number(lineTotal).toLocaleString()}</td>
                    <td class="p-3">
                        <button onclick="returnSingleItem(${index})" 
                                class="bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold px-3 py-1.5 rounded transition">
                            ↩ إرجاع الصنف
                        </button>
                    </td>
                </tr>`;
            });

            document.getElementById("info_total").innerText = Number(total).toLocaleString();
            document.getElementById("invoiceItemsBody").innerHTML = html;
        }

        function hideInvoiceData() {
            document.getElementById("noDataPlaceholder").classList.remove("hidden");
            document.getElementById("invoiceSection").classList.add("hidden");
            currentOrder = null;
            currentDetails = [];
        }

        // 1️⃣ إرجاع صنف واحد محدد (تعديل تفاصيل الفاتورة والمخزون)
        async function returnSingleItem(index) {
            const item = currentDetails[index];
            const prod = productMap.get(item.id_product);

            if (!confirm(`هل أنت متأكد من رغبتك في إرجاع هذا الصنف وتعديل المخزون؟`)) return;

            // أ. حساب الكمية الجديدة في المستودع (المخزون الحالي + الكمية المرجعة)
            const currentStock = prod ? Number(prod.qte_in_stock || 0) : 0;
            const newStock = currentStock + Number(item.qte);

            // ب. تحديث المخزون في جدول المنتجات
            const { error: stockErr } = await supabaseClient
                .from("products")
                .update({ qte_in_stock: newStock })
                .eq("id_product", item.id_product);

            if (stockErr) {
                alert("خطأ أثناء تحديث المخزون: " + stockErr.message);
                return;
            }

            // ج. حذف السطر من تفاصيل الفاتورة
            await supabaseClient
                .from("orders_details")
                .delete()
                .eq("id", item.id); // يفترض وجود عمود معرف فرعي (id) في التفاصيل، أو المطابقة بالمنتج والأمر معاً كالتالي:
                // .eq("id_order", item.id_order).eq("id_product", item.id_product);

            alert("تم إرجاع المنتج بنجاح وتحديث كمية المستودع المستهدفة.");
            searchInvoice(); // إعادة تحميل الفاتورة المحدثة
        }

        // 2️⃣ إلغاء وحذف الفاتورة كاملة (إرجاع المخزون لكل المنتجات وتصفير الفاتورة)
        async function cancelWholeInvoice() {
            if (!confirm("⚠️ تحذير: هل أنت متأكد من إلغاء الفاتورة بالكامل؟ سيتم إعادة جميع كميات المنتجات إلى المخزن وحذف الفاتورة نهائياً.")) return;

            // أ. الدوران على كل المنتجات في الفاتورة لإرجاع كمياتها للمخزن
            for (let item of currentDetails) {
                const prod = productMap.get(item.id_product);
                const currentStock = prod ? Number(prod.qte_in_stock || 0) : 0;
                const newStock = currentStock + Number(item.qte);

                await supabaseClient
                    .from("products")
                    .update({ qte_in_stock: newStock })
                    .eq("id_product", item.id_product);
            }

            // ب. حذف تفاصيل الفاتورة من قاعدة البيانات
            await supabaseClient
                .from("orders_details")
                .delete()
                .eq("id_order", currentOrder.id_order);

            // ج. حذف رأس الفاتورة من قاعدة البيانات
            const { error: deleteOrderErr } = await supabaseClient
                .from("orders_o")
                .delete()
                .eq("id_order", currentOrder.id_order);

            if (deleteOrderErr) {
                alert("خطأ أثناء حذف الفاتورة: " + deleteOrderErr.message);
                return;
            }

            alert("🚀 تم إلغاء الفاتورة بالكامل بنجاح، وإرجاع كافة السلع إلى المخزون الرئيسي.");
            document.getElementById("orderIdInput").value = "";
            hideInvoiceData();
        }
    </script>
</body>
</html>
