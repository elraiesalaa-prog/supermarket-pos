<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المنتجات المطور</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Tahoma;
            background: #f4f6f9;
            padding: 10px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            font-size: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        /* للشاشات الكبيرة */
        @media(min-width:768px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-top: 5px;
        }

        /* للشاشات الكبيرة */
        @media(min-width:768px) {
            button {
                width: auto;
            }
        }

        .save { background: #28a745; color: white }
        .edit { background: #ffc107 }
        .delete { background: #dc3545; color: white }
        .logout { background: #333; color: white; float: none; margin-bottom: 10px }

        /* للشاشات الكبيرة */
        @media(min-width:768px) {
            .logout { float: left }
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            min-width: 600px;
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            font-size: 13px;
        }

        th {
            background: #007bff;
            color: white;
        }

        /* تنسيق الصورة المصغرة في الجدول */
        .img-preview {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 5px;
            background: #eee;
        }
    </style>
</head>

<body>

<div class="container">

    <button class="logout" onclick="logout()">خروج</button>

    <h2>إدارة المنتجات</h2>

    <input type="text" id="searchBox" placeholder="بحث عن منتج..." onkeyup="searchProduct()">

    <br><br>

    <div class="grid">
        <input id="product_name" placeholder="اسم المنتج">
        <input id="pay_qte" type="number" placeholder="كمية الشراء">
        <input id="pice_qte" type="number" placeholder="عدد القطع">
        <input id="qte_in_stock" type="number" placeholder="المخزون">
        <input id="pay_price" type="number" placeholder="سعر الشراء">
        <input id="seal_price" type="number" placeholder="سعر البيع">
        <input id="pay_date" type="date">
        <input id="expare_date" type="date">
        <input id="req_id" placeholder="رقم الطلب">
        <input id="coasts_value" type="number" placeholder="التكاليف">
        <select id="id_cat"></select>
        <input id="p_weight" placeholder="الوزن">
        
        <div style="display: flex; flex-direction: column; gap: 2px;">
            <label style="font-size: 11px; font-weight: bold; color: #555;">صورة المنتج حقيقي:</label>
            <input id="product_image_file" type="file" accept="image/*">
        </div>
    </div>

    <br>

    <button class="save" id="btnSave" onclick="saveProduct()">حفظ المنتج</button>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>الصورة</th>
                    <th>المنتج</th>
                    <th>المخزون</th>
                    <th>سعر البيع</th>
                    <th>الصنف</th>
                    <th>تعديل</th>
                    <th>حذف</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

</div>

<script>
const supabaseClient = window.supabase.createClient(
    "https://vmxbedovoahuggfpcmyk.supabase.co",
    "sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"
)

let edit_id = null
let products = []
let current_image_url = null // للاحتفاظ بالصورة القديمة عند التعديل بدون رفع صورة جديدة

// تحميل الأصناف
async function loadCategories(){
    const {data} = await supabaseClient
        .from("categories")
        .select("*")
        .order("description_cat")

    let html = ""
    if(data){
        data.forEach(c => {
            html += `<option value="${c.id_cat}">${c.description_cat}</option>`
        })
    }
    document.getElementById("id_cat").innerHTML = html
}

// تحميل المنتجات
async function loadProducts(){
    const {data} = await supabaseClient
        .from("products")
        .select("*")

    products = data || []
    renderTable(products)
}

// عرض الجدول مضافاً إليه خانة الصور الفورية
function renderTable(list){
    let html = ""
    let fallbackImg = "https://images.unsplash.com/photo-1479064555552-3ef4979f8908?q=80&w=150";
    
    list.forEach(p => {
        let img = p.image_url || fallbackImg;
        html += `
        <tr>
            <td>${p.id_product}</td>
            <td><img src="${img}" class="img-preview" onerror="this.src='${fallbackImg}'"></td>
            <td>${p.product_name || ''}</td>
            <td>${p.qte_in_stock || 0}</td>
            <td>${p.seal_price || 0}</td>
            <td>${p.id_cat || ''}</td>
            <td><button class="edit" onclick="editProduct(${p.id_product})">تعديل</button></td>
            <td><button class="delete" onclick="deleteProduct(${p.id_product})">حذف</button></td>
        </tr>`
    })
    document.getElementById("tableBody").innerHTML = html
}

// دالة مخصصة لرفع الصورة إلى الـ Storage الخاص بسوبابيز
async function uploadImageFile() {
    const fileInput = document.getElementById("product_image_file");
    if (!fileInput.files || fileInput.files.length === 0) {
        return current_image_url; // إذا لم يرفع ملفاً جديداً، نحتفظ بالرابط الحالي
    }

    const file = fileInput.files[0];
    const fileExt = file.name.split('.').pop();
    // إنشاء اسم فريد للملف لمنع التداخل
    const fileName = `${Date.now()}_${Math.floor(Math.random() * 1000)}.${fileExt}`;
    const filePath = `${fileName}`;

    // رفع الملف إلى حاوية اسمها product-images (تأكد من إنشائها وجعلها Public في سوبابيز)
    const { data, error } = await supabaseClient.storage
        .from('product-images')
        .upload(filePath, file);

    if (error) {
        console.error("خطأ رفع الصورة:", error.message);
        throw new Error("فشل رفع الصورة لـ Storage: " + error.message);
    }

    // جلب الرابط العام للملف المرفوع
    const { data: publicUrlData } = supabaseClient.storage
        .from('product-images')
        .getPublicUrl(filePath);

    return publicUrlData.publicUrl;
}

// حفظ المنتج مع تفعيل معالج رفع الصور
async function saveProduct(){
    const btnSave = document.getElementById("btnSave");
    btnSave.disabled = true;
    btnSave.innerText = "جاري الحفظ والرفع...";

    let payQte = Number(pay_qte.value) || 0
    let piceQte = Number(pice_qte.value) || 0
    let stockCalculated = payQte * piceQte

    try {
        // 1. تشغيل دالة الرفع أولاً والحصول على رابط الصورة المحدث
        let uploadedUrl = await uploadImageFile();

        let data = {
            product_name: product_name.value || null,
            pay_qte: payQte,
            pice_qte: piceQte,
            qte_in_stock: qte_in_stock.value ? Number(qte_in_stock.value) : stockCalculated,
            pay_price: Number(pay_price.value) || 0,
            seal_price: Number(seal_price.value) || 0,
            pay_date: pay_date.value || null,
            expare_date: expare_date.value || null,
            req_id: req_id.value || null,
            coasts_value: Number(coasts_value.value) || 0,
            id_cat: Number(id_cat.value) || 1,
            p_weight: p_weight.value || null,
            image_url: uploadedUrl // إدراج الرابط في قاعدة البيانات
        }

        if(edit_id == null){
            await supabaseClient.from("products").insert([data])
        } else {
            await supabaseClient.from("products").update(data).eq("id_product", edit_id)
            edit_id = null
        }

        clearForm()
        loadProducts()
    } catch(err) {
        alert("خطأ أثناء المعالجة: " + err.message)
    } finally {
        btnSave.disabled = false;
        btnSave.innerText = "حفظ المنتج";
    }
}

// تعديل
function editProduct(id){
    let p = products.find(x => x.id_product == id)

    product_name.value = p.product_name || ''
    pay_qte.value = p.pay_qte || ''
    pice_qte.value = p.pice_qte || ''
    qte_in_stock.value = p.qte_in_stock || ''
    pay_price.value = p.pay_price || ''
    seal_price.value = p.seal_price || ''
    pay_date.value = p.pay_date || ''
    expare_date.value = p.expare_date || ''
    req_id.value = p.req_id || ''
    coasts_value.value = p.coasts_value || ''
    id_cat.value = p.id_cat || ''
    p_weight.value = p.p_weight || ''
    
    current_image_url = p.image_url || null // حفظ الرابط المتواجد سابقاً في الذاكرة المؤقتة
    document.getElementById("product_image_file").value = ""; // تصفية حقل الرفع للحالة الجديدة
    
    edit_id = id
}

// حذف
async function deleteProduct(id){
    if(!confirm("تأكيد الحذف؟")) return
    await supabaseClient.from("products").delete().eq("id_product", id)
    loadProducts()
}

// بحث
function searchProduct(){
    let word = searchBox.value.toLowerCase()
    let filtered = products.filter(p =>
        p.product_name?.toLowerCase().includes(word)
    )
    renderTable(filtered)
}

// مسح
function clearForm(){
    document.querySelectorAll("input").forEach(i => i.value = "")
    current_image_url = null;
}

// خروج
function logout(){
    window.location.href = "index.html"
}

loadCategories()
loadProducts()
</script>

</body>
</html>
