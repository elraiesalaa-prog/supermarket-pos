   //==========================

function renderCart(){

    const table =

        table.innerHTML += `

<td class="p-2 font-bold text-blue-700">

${money(item.total)}

</td>

<button
onclick="removeItem(${index})"
class="text-red-600 hover:text-red-800">

</button>

`;

window.addItem = function(){

    const id =
    document.getElementById("product").value;

    const qty =
    Number(document.getElementById("qte").value);

    const price =
    Number(document.getElementById("price").value);

    const product =
    products.find(p=>p.id_product==id);

    if(!product){

        alert("المنتج غير موجود");

        return;

    }

    if(qty<=0){

        alert("أدخل الكمية");

        return;

    }

    if(price<=0){

        alert("السعر غير صحيح");

        return;

    }

    if(qty>product.qte_in_stock){

        alert("الكمية المطلوبة أكبر من المخزون");

        return;

    }

    const exist =
    cart.find(x=>x.id_product==id);

    if(exist){

        if(exist.qte + qty > product.qte_in_stock){

            alert("الكمية أكبر من المخزون");

            return;

        }

        exist.qte += qty;

        exist.total =
        exist.qte * exist.price;

    }else{

        cart.push({

            id_product:id,

            name:product.product_name,

            price:price,

            qte:qty,

            total:price*qty

        });

    }

    product.qte_in_stock -= qty;

    renderCart();

    showProduct();

    document.getElementById("qte").value = "";

}

//==========================

window.removeItem = function(index){

    const item = cart[index];

    const product =
    products.find(p=>p.id_product==item.id_product);

    if(product){

        product.qte_in_stock += item.qte;

    }

    cart.splice(index,1);

    renderCart();

    showProduct();

}

window.saveInvoice = async function(){

    if(cart.length===0){

        alert("السلة فارغة");

        return;

    }

    const customerId =
    document.getElementById("customer").value;

    if(!customerId){

        alert("اختر العميل");

        return;

    }

    const customer =
    customers.find(c=>c.id_customer==customerId);

    try{

        //====================
        // حفظ رأس الفاتورة
        //====================

        const {data:order,error:orderError} =
        await supabase
        .from("orders_o")
        .insert({

            customer_id:customerId,

            user_id:currentUserId,

            created_at:new Date().toISOString()

        })
        .select()
        .single();

        if(orderError) throw orderError;

        currentInvoiceNo =
        order.id_order;

        //====================
        // حفظ التفاصيل
        //====================

        for(const item of cart){

            const detailError =
            await supabase
            .from("orders_details")
            .insert({

                id_order:order.id_order,

                id_product:item.id_product,

                qte:item.qte,

                price:item.price,

                total_amount:item.total

            });

            if(detailError.error)
                throw detailError.error;

            //====================
            // تحديث المخزون
            //====================

            const product =
            products.find(p=>p.id_product==item.id_product);

            if(product){

                const newQty =
                Number(product.qte_in_stock);

                const updateError =
                await supabase
                .from("products")
                .update({

                    qte_in_stock:newQty

                })
                .eq("id_product",item.id_product);

                if(updateError.error)
                    throw updateError.error;

            }

        }

        //====================
        // تحديث الشاشة
        //====================

        renderCart();

        await loadProducts();

        cart=[];

        renderCart();

        showInvoiceModal(

            order.id_order,

            customer?.first_name || "غير معروف"

        );

    }
    catch(err){

        console.error(err);

        alert("حدث خطأ أثناء حفظ الفاتورة");

    }

}
