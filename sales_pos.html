<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<title>نظام POS متقدم v3</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body class="bg-gray-100 p-6">

<div class="max-w-7xl mx-auto">

<h1 class="text-3xl font-bold text-center mb-6">نظام POS متقدم v3</h1>

<div class="grid grid-cols-3 gap-6">

<!-- العملاء -->
<div class="bg-white p-4 rounded shadow">

<h2 class="font-bold mb-3">العميل</h2>

<select id="customer" class="border p-2 w-full mb-3"></select>

<select id="pay_method" class="border p-2 w-full mb-3">
<option value="cash">نقد</option>
<option value="bank">تحويل</option>
<option value="later">آجل</option>
</select>

<input id="seal_man" class="border p-2 w-full" readonly/>

</div>

<!-- المنتجات -->
<div class="bg-white p-4 rounded shadow">

<h2 class="font-bold mb-3">المنتجات</h2>

<select id="product" class="border p-2 w-full mb-3"></select>

<div class="flex gap-2 mb-3">
<input id="price" class="border p-2 w-full" readonly/>
<input id="stock" class="border p-2 w-full" readonly/>
</div>

<input id="qte" type="number" placeholder="الكمية" class="border p-2 w-full mb-3">

<button onclick="addItem()" class="bg-blue-600 text-white w-full py-2 rounded">
إضافة للسلة
</button>

</div>

<!-- الإجمالي -->
<div class="bg-white p-4 rounded shadow">

<h2 class="font-bold mb-3">الإجمالي</h2>

<div class="text-xl font-bold mb-4">
الإجمالي : <span id="total">0</span>
</div>

<div class="flex flex-col gap-2">

<button onclick="showInvoiceModal()" class="bg-yellow-600 text-white w-full py-2 rounded">
عرض الفاتورة
</button>

<button id="saveBtn" onclick="saveInvoice()" class="bg-green-600 text-white w-full py-2 rounded">
إتمام البيع
</button>

</div>

</div>

</div>

<!-- السلة -->
<div class="bg-white mt-6 p-4 rounded shadow">

<table class="w-full text-center">

<thead class="bg-gray-200">
<tr>
<th>المنتج</th>
<th>السعر</th>
<th>الكمية</th>
<th>المجموع</th>
<th>حذف</th>
</tr>
</thead>

<tbody id="cart"></tbody>

</table>

</div>

</div>

<!-- نافذة الفاتورة -->
<div id="invoiceModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center">

<div class="bg-white p-6 rounded shadow w-3/4 max-w-3xl">

<h2 class="text-xl font-bold mb-4 text-center">فاتورة البيع</h2>

<table class="w-full text-center border">

<thead class="bg-gray-200">
<tr>
<th class="border p-2">المنتج</th>
<th class="border p-2">السعر</th>
<th class="border p-2">الكمية</th>
<th class="border p-2">المجموع</th>
</tr>
</thead>

<tbody id="invoiceTable"></tbody>

</table>

<div class="text-xl font-bold mt-4 text-left">
الإجمالي : <span id="invoiceTotal">0</span>
</div>

<div class="flex justify-center gap-4 mt-4">
<button onclick="closeInvoice()" class="bg-red-600 text-white px-4 py-2 rounded">
إغلاق
</button>
</div>

</div>
</div>

<script>

document.addEventListener("DOMContentLoaded", async () => {

const supabase = window.supabase.createClient(
"https://vmxbedovoahuggfpcmyk.supabase.co",
"sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"
)

// ================= المستخدم الحالي =================
const currentUserId =
    localStorage.getItem("userId") || "";

const currentUserName =
    localStorage.getItem("userName") || "غير معروف";

const currentUserRole =
    localStorage.getItem("userRole") || "";

const sellerName = currentUserName;

// ================= DATA =================
let customers = [];
let products = [];
let orders = [];
let details = [];

let customerMap = new Map();
let productMap = new Map();
let detailsMap = new Map();

const money = v => Number(v || 0).toLocaleString();

/* تحميل العملاء */

async function loadCustomers(){

const {data,error} = await supabase
.from("customers")
.select("id_customer,first_name")

if(error){ alert(error.message); return }

let select = document.getElementById("customer")
select.innerHTML = ""

data.forEach(c=>{
let op = document.createElement("option")
op.value = c.id_customer
op.textContent = c.first_name
select.appendChild(op)
})

}

/* تحميل المنتجات */

async function loadProducts(){

const {data,error} = await supabase
.from("products")
.select("id_product,product_name,seal_price,qte_in_stock")

if(error){ alert(error.message); return }

products = data

let select = document.getElementById("product")
select.innerHTML = ""

data.forEach(p=>{
let op = document.createElement("option")
op.value = p.id_product
op.textContent = p.product_name
select.appendChild(op)
})

select.addEventListener("change",showProduct)

showProduct()

}

/* عرض المنتج */

function showProduct(){

let id = document.getElementById("product").value
let p = products.find(x=>x.id_product==id)

if(!p) return

document.getElementById("price").value = p.seal_price
document.getElementById("stock").value = p.qte_in_stock

}

/* عرض السلة */

function renderCart(){

let table = document.getElementById("cart")
table.innerHTML = ""

let total = 0

cart.forEach((i,index)=>{

total += i.total

table.innerHTML += `
<tr class="border-b">
<td>${i.name}</td>
<td>${i.price}</td>
<td>${i.qte}</td>
<td>${i.total}</td>
<td>
<button onclick="removeItem(${index})" class="text-red-600">حذف</button>
</td>
</tr>
`

})

document.getElementById("total").innerText = total

}

/* إضافة للسلة */

window.addItem = function(){

let productId = document.getElementById("product").value
let qte = parseFloat(document.getElementById("qte").value)

let product = products.find(p=>p.id_product==productId)

if(!qte || qte<=0){
alert("ادخل الكمية")
return
}

if(qte > product.qte_in_stock){
alert("الكمية أكبر من المخزون")
return
}

cart.push({
id_product:productId,
name:product.product_name,
price:product.seal_price,
qte:qte,
total:qte*product.seal_price
})

renderCart()

}

/* حذف من السلة */

window.removeItem = function(index){
cart.splice(index,1)
renderCart()
}

/* عرض الفاتورة */

window.showInvoiceModal = function(){

let table = document.getElementById("invoiceTable")
table.innerHTML = ""

let total = 0

cart.forEach(i=>{

total += i.total

table.innerHTML += `
<tr>
<td class="border p-2">${i.name}</td>
<td class="border p-2">${i.price}</td>
<td class="border p-2">${i.qte}</td>
<td class="border p-2">${i.total}</td>
</tr>
`

})

document.getElementById("invoiceTotal").innerText = total
document.getElementById("invoiceModal").classList.remove("hidden")

}

/* إغلاق الفاتورة */

window.closeInvoice = function(){
document.getElementById("invoiceModal").classList.add("hidden")
}

/* حفظ الفاتورة */

window.saveInvoice = async function(){

if(cart.length==0){
alert("السلة فارغة")
return
}

let btn = document.getElementById("saveBtn")
btn.disabled = true

let customer = document.getElementById("customer").value
let pay_method = document.getElementById("pay_method").value
let seal_man = document.getElementById("seal_man").value

const {data,error} = await supabase
.from("orders_o")
.insert([{
customer_id:customer,
date_order:new Date(),
pay_method:pay_method,
seal_man:seal_man
}]).select()

if(error){
alert(error.message)
btn.disabled=false
return
}

let orderId = data[0].id_order

for(let item of cart){

await supabase
.from("orders_details")
.insert([{
id_product:item.id_product,
id_order:orderId,
qte:item.qte,
price:item.price,
descount:0,
amount:item.total,
total_amount:item.total,
id_customer:customer,
date_order:new Date(),
pay_method:pay_method,
description_order:"",
seal_man:seal_man,
first_name:""
}])

}

alert("تمت عملية البيع بنجاح")

cart=[]
renderCart()

await loadProducts()

btn.disabled=false

}

/* تحميل البيانات */

await loadCustomers()
await loadProducts()

})
// ================= LOAD MASTER =================
async function loadMaster(){

try{

const [customersRes,productsRes] = await Promise.all([

supabaseClient
.from("customers")
.select("*"),

supabaseClient
.from("products")
.select("*")

]);

if(customersRes.error) throw customersRes.error;
if(productsRes.error) throw productsRes.error;

customers = customersRes.data || [];
products = productsRes.data || [];

customerMap.clear();
productMap.clear();

customers.forEach(c=>{
customerMap.set(c.id_customer,c);
});

products.forEach(p=>{
productMap.set(p.id_product,p);
});

console.log("Customers :",customers.length);
console.log("Products :",products.length);

}catch(err){

console.error("LOAD MASTER ERROR :",err);

alert("خطأ في تحميل العملاء أو المنتجات");

}

}
// ================= LOAD DETAILS =================
async function loadDetails(){

try{

const {data,error} = await supabaseClient

.from("orders_details")

.select("*");

if(error) throw error;

details = data || [];

detailsMap.clear();

details.forEach(item=>{

if(!detailsMap.has(item.id_order)){

detailsMap.set(item.id_order,[]);

}

detailsMap.get(item.id_order).push(item);

});

console.log("Details :",details.length);

}catch(err){

console.error("DETAIL ERROR :",err);

alert("تعذر تحميل تفاصيل الفواتير");

}

}
// ================= LOAD ORDERS =================
async function loadOrders(){

try{

const {data,error} = await supabaseClient

.from("orders_o")

.select("*")

.order("id_order",{ascending:false});

if(error) throw error;

orders = data || [];

console.log("Orders :",orders.length);

renderOrders();

}catch(err){

console.error("ORDER ERROR :",err);

alert("تعذر تحميل الفواتير");

}

}

// ================= RENDER =================
function renderOrders(){

const tbody = document.getElementById("invoices");

tbody.innerHTML="";

if(!orders.length){

tbody.innerHTML=`
<tr>

<td colspan="3">

لا توجد فواتير

</td>

</tr>
`;

return;

}

orders.forEach(order=>{

const customer=

customerMap.get(order.customer_id);

const items=

detailsMap.get(order.id_order)||[];

const total=

items.reduce((sum,item)=>{

return sum+Number(item.total_amount||0);

},0);

tbody.innerHTML+=`

<tr class="cursor-pointer hover:bg-blue-50 transition"

onclick="openOrder(${order.id_order})">

<td>

${order.id_order}

</td>

<td>

${customer?.first_name||"بدون اسم"}

</td>

<td class="font-bold text-green-600">

${money(total)}

</td>

</tr>

`;

});

}

// ================= OPEN ORDER =================
function openOrder(id){

    const order = orders.find(o => o.id_order == id);

    if(!order){
        alert("الفاتورة غير موجودة");
        return;
    }

    const cust = customerMap.get(order.customer_id);
    const items = detailsMap.get(id) || [];

    let total = 0;
    let rows = "";

    items.forEach((item,index)=>{

        const product = productMap.get(item.id_product);

        const qty =
            item.qte ??
            item.quantity ??
            item.qty ??
            0;

        const price =
            Number(item.price || 0);

        const lineTotal =
            Number(item.total_amount || 0);

        total += lineTotal;

       rows += `
<tr>

<td style="
padding:7px;
border-bottom:1px solid #eee;
text-align:right;
">
${product?.product_name || "-"}
</td>

<td style="
text-align:center;
border-bottom:1px solid #eee;
">
${qty}
</td>

<td style="
text-align:center;
border-bottom:1px solid #eee;
">
${money(price)}
</td>

<td style="
text-align:center;
font-weight:bold;
color:#2563eb;
border-bottom:1px solid #eee;
">
${money(lineTotal)}
</td>

</tr>
`;


    });

    const invoiceDate =
        order.created_at ||
        order.date_order ||
        order.order_date ||
        new Date().toISOString();

    const invoiceObj = new Date(invoiceDate);

    const date =
        invoiceObj.toLocaleDateString("ar-EG");

    const time =
        invoiceObj.toLocaleTimeString("ar-EG");

   document.getElementById("invoiceContent").innerHTML = `

<div style="
display:flex;
justify-content:center;
padding:15px;
background:#eef2f7;
">

<div style="
width:80mm;
background:#fff;
border:2px solid #2563eb;
border-radius:12px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,.18);
font-family:Cairo,Arial,sans-serif;
font-size:12px;
color:#222;
">

<!-- الرأس -->

<div style="
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:12px;
text-align:center;
">

<div style="
font-size:22px;
font-weight:bold;
">

مؤسسة علاء الدين

</div>

<div style="
font-size:14px;
margin-top:3px;
">

فاتورة بيع

</div>

<div style="
font-size:11px;
opacity:.9;
">

POS SYSTEM

</div>

</div>

<!-- معلومات الفاتورة -->

<div style="
padding:10px;
background:#f8fafc;
border-bottom:1px solid #ddd;
line-height:1.9;
">

<div style="display:flex;justify-content:space-between;">
<span><b>رقم:</b> ${id}</span>
<span>${date}</span>
</div>

<div style="margin-top:4px;">
👤 <b>العميل :</b> ${cust?.first_name || "-"}
</div>

<div>
🛒 <b>البائع :</b> ${sellerName}
</div>

<div>
🕒 ${time}
</div>

</div>

<!-- جدول المنتجات -->

<table style="
width:100%;
border-collapse:collapse;
font-size:11px;
">

<thead>

<tr style="
background:#2563eb;
color:#fff;
">

<th style="padding:6px;">الصنف</th>
<th style="padding:6px;">الكمية</th>
<th style="padding:6px;">السعر</th>
<th style="padding:6px;">الجملة</th>

</tr>

</thead>

<tbody>

${rows}

</tbody>

</table>

<!-- الإجمالي -->

<div style="
padding:10px;
background:#f8fafc;
border-top:1px solid #ddd;
">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
background:#2563eb;
color:#fff;
padding:10px;
border-radius:8px;
font-size:16px;
font-weight:bold;
">

<span>الإجمالي</span>

<span>${money(total)}</span>

</div>

</div>

<!-- التذييل -->

<div style="
padding:12px;
text-align:center;
font-size:11px;
color:#666;
border-top:1px dashed #ccc;
">

شكراً لتعاملكم معنا 🌹

<br>

نتمنى لكم يوماً سعيداً

</div>

</div>

</div>

`;
const modal = document.getElementById("invoiceModal");

modal.classList.remove("hidden");
modal.classList.add("flex");

}
// ================= STATS =================
async function loadStats(){

try{

const [{data:ordersData,error:e1},

{data:detailsData,error:e2}] = await Promise.all([

supabaseClient

.from("orders_o")

.select("*"),

supabaseClient

.from("orders_details")

.select("total_amount")

]);

if(e1) throw e1;
if(e2) throw e2;

const total=(detailsData||[])

.reduce((s,x)=>

s+Number(x.total_amount||0)

,0);

document.getElementById("sales").innerText=

money(total);

document.getElementById("invCount").innerText=

ordersData.length;

document.getElementById("cusCount").innerText=

customers.length;

document.getElementById("proCount").innerText=

products.length;

}catch(err){

console.error(err);

}
}
</script>

</body>
</html>
