async function loadCustomers(){

    const select =
    document.getElementById("customer");

    select.innerHTML = "";

    const {data,error} = await supabase

    .from("customers")

    .select("id_customer,first_name")

    .order("first_name");

    if(error){

        console.error(error);

        alert("تعذر تحميل العملاء");

        return;

    }

    customers = data || [];

    customers.forEach(c=>{

        const option =
        document.createElement("option");

        option.value =
        c.id_customer;

        option.textContent =
        c.first_name;

        select.appendChild(option);

    });

}

async function loadProducts(){

    const select =
    document.getElementById("product");

    select.innerHTML = "";

    const {data,error} = await supabase

    .from("products")

    .select("*")

    .order("product_name");

    if(error){

        console.error(error);

        alert("تعذر تحميل المنتجات");

        return;

    }

    products = data || [];

    products.forEach(product=>{

        const option =
        document.createElement("option");

        option.value =
        product.id_product;

        option.textContent =
        product.product_name;

        select.appendChild(option);

    });

    select.onchange = showProduct;

    showProduct();

}

//============================
// عرض بيانات المنتج
//============================

function showProduct(){

    const id =
    document.getElementById("product").value;

    const product =
    products.find(p=>p.id_product==id);

    if(!product){

        document.getElementById("price").value="";

        document.getElementById("stock").value="";

        return;

    }

    document.getElementById("price").value =
    product.seal_price;

    document.getElementById("stock").value =
    product.qte_in_stock;

}
   //============================
// عرض السلة
//============================

function renderCart(){

    const tbody =
    document.getElementById("cart");

    tbody.innerHTML = "";

    let total = 0;

    cart.forEach((item,index)=>{

        total += Number(item.total);

        tbody.innerHTML += `

<tr>

<td class="border p-2 text-center">

${index+1}

</td>

<td class="border p-2">

${item.name}

</td>

<td class="border p-2 text-center">

${money(item.price)}

</td>

<td class="border p-2 text-center">

<input
type="number"
min="1"
value="${item.qte}"
style="width:60px;text-align:center"
onchange="updateQty(${index},this.value)">

</td>

<td class="border p-2 text-center font-bold text-blue-700">

${money(item.total)}

</td>

<td class="border p-2 text-center">

<button
class="bg-red-600 text-white px-2 py-1 rounded"
onclick="removeItem(${index})">

حذف

</button>

</td>

</tr>

`;

    });

    document.getElementById("total").innerText =
    money(total);

}

//============================
// إضافة منتج
//============================

function addItem(){

    const productId =
    document.getElementById("product").value;

    const qty =
    Number(document.getElementById("qte").value);

    const product =
    products.find(p=>p.id_product==productId);

    if(!product){

        alert("اختر منتجاً");

        return;

    }

    if(qty<=0){

        alert("أدخل الكمية");

        return;

    }

    if(qty>Number(product.qte_in_stock)){

        alert("الكمية المطلوبة أكبر من المخزون");

        return;

    }

    const price =
    Number(product.seal_price);

    const exist =
    cart.find(x=>x.id_product==productId);

    if(exist){

        if(exist.qte + qty > Number(product.qte_in_stock)){

            alert("الكمية أكبر من المخزون");

            return;

        }

        exist.qte += qty;

        exist.total =
        exist.qte * exist.price;

    }else{

        cart.push({

            id_product:product.id_product,

            name:product.product_name,

            price:price,

            qte:qty,

            total:price*qty

        });

    }

    product.qte_in_stock -= qty;

    document.getElementById("qte").value = "";

    showProduct();

    renderCart();

}

//============================
// تعديل الكمية
//============================

function updateQty(index,newQty){

    newQty = Number(newQty);

    if(newQty<=0){

        return;

    }

    const item =
    cart[index];

    const product =
    products.find(p=>p.id_product==item.id_product);

    if(!product){

        return;

    }

    const oldQty =
    item.qte;

    const diff =
    newQty - oldQty;

    if(diff>0){

        if(diff>Number(product.qte_in_stock)){

            alert("الكمية غير متوفرة");

            renderCart();

            return;

        }

        product.qte_in_stock -= diff;

    }else{

        product.qte_in_stock += Math.abs(diff);

    }

    item.qte =
    newQty;

    item.total =
    item.price * newQty;

    showProduct();

    renderCart();

}

//============================
// حذف منتج
//============================

function removeItem(index){

    const item =
    cart[index];

    const product =
    products.find(p=>p.id_product==item.id_product);

    if(product){

        product.qte_in_stock += item.qte;

    }

    cart.splice(index,1);

    showProduct();

    renderCart();

}
