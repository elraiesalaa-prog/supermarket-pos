<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير رأس المال والمخزون</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Tahoma', Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-6">

    <div class="max-w-6xl mx-auto bg-white shadow-xl rounded-xl p-4 md:p-6">
        
        <!-- العناوين وزر العودة -->
        <div class="flex flex-col md:flex-row justify-between items-center border-b pb-4 mb-6 gap-3">
            <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                💰 تقرير ومؤشر رأس المال الحالي
            </h1>
            <button onclick="window.location.href='products.html'" 
                    class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded text-sm transition">
                ⬅️ العودة لإدارة المنتجات
            </button>
        </div>

        <!-- كروت الإحصائيات السريعة -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-gradient-to-br from-emerald-500 to-green-600 text-white p-4 rounded-xl shadow-md">
                <div class="text-sm opacity-90">إجمالي رأس المال بالمستودع</div>
                <div id="totalCapital" class="text-2xl font-bold mt-1">0</div>
            </div>
            <div class="bg-gradient-to-br from-blue-500 to-indigo-600 text-white p-4 rounded-xl shadow-md">
                <div class="text-sm opacity-90">إجمالي عدد القطع المتبقية</div>
                <div id="totalItemsCount" class="text-2xl font-bold mt-1">0</div>
            </div>
            <div class="bg-gradient-to-br from-amber-500 to-orange-600 text-white p-4 rounded-xl shadow-md">
                <div class="text-sm opacity-90">عدد الأصناف المتوفرة</div>
                <div id="productsCount" class="text-2xl font-bold mt-1">0</div>
            </div>
        </div>

        <!-- شريط البحث السريع -->
        <div class="mb-4">
            <input type="text" id="searchBox" placeholder="🔍 ابحث عن منتج معين لتصفية التقرير..." onkeyup="filterReport()"
                   class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none text-sm shadow-sm">
        </div>

        <!-- جدول البيانات المدروس -->
        <div class="overflow-x-auto border rounded-xl shadow-sm bg-white">
            <table class="w-full text-center border-collapse text-sm">
                <thead class="bg-slate-800 text-white sticky top-0">
                    <tr>
                        <th class="p-3">ID</th>
                        <th class="p-3 text-right">اسم المنتج</th>
                        <th class="p-3">سعر الشراء الكلي</th>
                        <th class="p-3">التجزئة (قطع)</th>
                        <th class="p-3 bg-slate-700">تكلفة القطعة</th>
                        <th class="p-3 text-emerald-400">المخزون الحالي</th>
                        <th class="p-3 bg-emerald-900 text-white font-bold">قيمة رأس المال الحالي</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody" class="divide-y text-gray-700">
                    <!-- تُولد البيانات تلقائياً هنا -->
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // ================== Supabase Client ==================
        const supabaseClient = window.supabase.createClient(
            "https://vmxbedovoahuggfpcmyk.supabase.co",
            "sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"
        );

        let allProducts = [];
        const formatMoney = (v) => Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        // جلب المنتجات من قاعدة البيانات وحساب رأس المال
        async function loadCapitalReport() {
            const { data, error } = await supabaseClient
                .from("products")
                .select("*");

            if (error) {
                alert("خطأ أثناء تحميل البيانات: " + error.message);
                return;
            }

            allProducts = data || [];
            renderReport(allProducts);
        }

        // بناء الجدول وحساب الإجماليات العامة
        function renderReport(list) {
            let html = "";
            let overallCapital = 0;
            let overallStockItems = 0;

            list.forEach(p => {
                let payPrice = Number(p.pay_price) || 0;
                let pieceQte = Number(p.pice_qte) || 1; // تفادي القسمة على صفر إذا كان الحقل فارغاً
                let stock = Number(p.qte_in_stock) || 0;

                // 1. حساب تكلفة القطعة الواحدة بدقة
                let unitCost = payPrice / pieceQte;

                // 2. حساب رأس مال المنتج المتبقي حالياً في المخزن
                let productCapital = unitCost * stock;

                // جمع الإجماليات للكروت العلوية
                overallCapital += productCapital;
                overallStockItems += stock;

                html += `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-3 text-gray-400 font-mono">${p.id_product}</td>
                    <td class="p-3 text-right font-medium text-gray-900">${p.product_name || 'بدون اسم'}</td>
                    <td class="p-3 text-gray-500">${formatMoney(payPrice)}</td>
                    <td class="p-3 text-gray-500">${pieceQte} صنف/قطعة</td>
                    <td class="p-3 bg-slate-50 font-semibold text-gray-700">${formatMoney(unitCost)}</td>
                    <td class="p-3 font-bold text-emerald-600">${stock}</td>
                    <td class="p-3 bg-emerald-50 font-bold text-emerald-900">${formatMoney(productCapital)}</td>
                </tr>`;
            });

            // تحديث كروت الإحصائيات في الأعلى
            document.getElementById("totalCapital").innerText = formatMoney(overallCapital);
            document.getElementById("totalItemsCount").innerText = overallStockItems.toLocaleString();
            document.getElementById("productsCount").innerText = list.length;

            document.getElementById("reportTableBody").innerHTML = html;
        }

        // محرك تصفية البحث الفوري
        function filterReport() {
            let word = document.getElementById("searchBox").value.toLowerCase();
            let filtered = allProducts.filter(p =>
                p.product_name?.toLowerCase().includes(word)
            );
            renderReport(filtered);
        }

        // تشغيل التقرير عند فتح الصفحة فوراً
        loadCapitalReport();
    </script>
</body>
</html>
