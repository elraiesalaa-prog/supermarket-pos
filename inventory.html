```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة الفواتير</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

body{
background:#f1f5f9;
font-family:Tahoma,sans-serif;
}

::-webkit-scrollbar{
width:8px;
height:8px;
}

::-webkit-scrollbar-thumb{
background:#3b82f6;
border-radius:20px;
}

.card{
background:white;
border-radius:20px;
box-shadow:0 2px 15px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<header class="bg-blue-900 text-white shadow-lg">

<div class="max-w-7xl mx-auto p-4 flex justify-between items-center">

<h1 class="text-3xl font-bold">
📄 إدارة الفواتير
</h1>

<a href="index.html"
class="bg-white text-blue-900 px-4 py-2 rounded-lg font-bold">
رجوع
</a>

</div>

</header>

<div class="max-w-7xl mx-auto p-4">

<!-- احصائيات -->

<div class="grid md:grid-cols-4 gap-4 mb-6">

<div class="card p-5">
<div class="text-gray-500">إجمالي المبيعات</div>
<div id="totalSales"
class="text-3xl font-bold text-green-600 mt-2">
0
</div>
</div>

<div class="card p-5">
<div class="text-gray-500">عدد الفواتير</div>
<div id="invoiceCount"
class="text-3xl font-bold text-blue-600 mt-2">
0
</div>
</div>

<div class="card p-5">
<div class="text-gray-500">عدد العملاء</div>
<div id="customersCount"
class="text-3xl font-bold text-orange-600 mt-2">
0
</div>
</div>

<div class="card p-5">
<div class="text-gray-500">عدد المنتجات</div>
<div id="productsCount"
class="text-3xl font-bold text-purple-600 mt-2">
0
</div>
</div>

</div>

<!-- فلاتر -->

<div class="card p-4 mb-6">

<div class="grid md:grid-cols-3 gap-3">

<input
id="search"
onkeyup="searchInvoices()"
placeholder="بحث برقم الفاتورة أو العميل"
class="border rounded-xl p-3">

<select
id="payFilter"
class="border rounded-xl p-3"
onchange="loadInvoices()">

<option value="">كل طرق الدفع</option>
<option value="cash">نقد</option>
<option value="bank">تحويل</option>
<option value="later">آجل</option>

</select>

<button
onclick="loadInvoices()"
class="bg-blue-600 text-white rounded-xl">
تحديث
</button>

</div>

</div>

<div class="grid lg:grid-cols-2 gap-6">

<!-- الفواتير -->

<div class="card overflow-hidden">

<div class="bg-blue-600 text-white p-4 font-bold">
قائمة الفواتير
</div>

<div class="overflow-auto max-h-[750px]">

<table class="w-full text-center">

<thead class="bg-slate-100 sticky top-0">

<tr>

<th class="p-3">رقم</th>
<th class="p-3">العميل</th>
<th class="p-3">التاريخ</th>
<th class="p-3">الدفع</th>
<th class="p-3">الإجمالي</th>

</tr>

</thead>

<tbody id="invoiceTable"></tbody>

</table>

</div>

</div>

<!-- التفاصيل -->

<div class="card">

<div class="bg-green-600 text-white p-4 flex justify-between">

<span class="font-bold">
تفاصيل الفاتورة
</span>

<div class="flex gap-2">

<button
onclick="printInvoice()"
class="bg-white text-green-700 px-3 rounded">
طباعة
</button>

<button
onclick="downloadPDF()"
class="bg-white text-blue-700 px-3 rounded">
PDF
</button>

</div>

</div>

<div
id="invoiceDetails"
class="p-5 min-h-[600px]">

<div class="text-center text-gray-400 mt-20">
اختر فاتورة من القائمة
</div>

</div>

</div>

</div>

</div>

<script>

const supabase = window.supabase.createClient(

"https://YOUR_PROJECT.supabase.co",

"YOUR_ANON_KEY"

);

let currentInvoiceId = null;

function money(v){
return Number(v||0).toLocaleString();
}

function payBadge(method){

if(method==="cash")
return '<span class="bg-green-100 text-green-700 px-2 py-1 rounded-full">نقد</span>';

if(method==="bank")
return '<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded-full">تحويل</span>';

if(method==="later")
return '<span class="bg-orange-100 text-orange-700 px-2 py-1 rounded-full">آجل</span>';

return method;

}

async function loadStats(){

const {data:salesData}=await supabase
.from("orders_details")
.select("total_amount");

const totalSales=salesData.reduce(
(sum,row)=>sum+Number(row.total_amount||0),0
);

document.getElementById("totalSales")
.innerText=money(totalSales);

const {count:invoiceCount}=await supabase
.from("orders_o")
.select("*",{count:"exact",head:true});

document.getElementById("invoiceCount")
.innerText=invoiceCount||0;

const {count:customersCount}=await supabase
.from("customers")
.select("*",{count:"exact",head:true});

document.getElementById("customersCount")
.innerText=customersCount||0;

const {count:productsCount}=await supabase
.from("products")
.select("*",{count:"exact",head:true});

document.getElementById("productsCount")
.innerText=productsCount||0;

}

async function loadInvoices(){

const payFilter=
document.getElementById("payFilter").value;

let query=supabase
.from("orders_o")
.select(`
id_order,
date_order,
pay_method,
customer_id,
customers(
first_name
)
`)
.order("id_order",{ascending:false});

if(payFilter){
query=query.eq("pay_method",payFilter);
}

const {data,error}=await query;

if(error){
alert(error.message);
return;
}

let html="";

for(const inv of data){

const {data:details}=await supabase
.from("orders_details")
.select("total_amount")
.eq("id_order",inv.id_order);

const total=(details||[])
.reduce(
(sum,row)=>sum+Number(row.total_amount||0),
0
);

html+=`

<tr
onclick="openInvoice(${inv.id_order})"
class="cursor-pointer hover:bg-blue-50 border-b">

<td class="p-3 font-bold text-blue-600">
${inv.id_order}
</td>

<td class="p-3">
${inv.customers?.first_name||'-'}
</td>

<td class="p-3">
${new Date(inv.date_order)
.toLocaleDateString()}
</td>

<td class="p-3">
${payBadge(inv.pay_method)}
</td>

<td class="p-3 text-green-600 font-bold">
${money(total)}
</td>

</tr>

`;

}

document.getElementById("invoiceTable")
.innerHTML=html;

}

async function openInvoice(id_order){

currentInvoiceId=id_order;

const {data:order}=await supabase
.from("orders_o")
.select(`
*,
customers(
first_name,
tel,
whatsapp,
balance
)
`)
.eq("id_order",id_order)
.single();

const {data:details}=await supabase
.from("orders_details")
.select(`
*,
products(
product_name
)
`)
.eq("id_order",id_order);

let total=0;
let rows="";

details.forEach((item,index)=>{

total+=Number(item.total_amount||0);

rows+=`

<tr class="border-b">

<td class="p-2">${index+1}</td>

<td class="p-2">
${item.products?.product_name||''}
</td>

<td class="p-2">
${money(item.price)}
</td>

<td class="p-2">
${item.qte}
</td>

<td class="p-2 font-bold text-green-600">
${money(item.total_amount)}
</td>

</tr>

`;

});

document.getElementById("invoiceDetails")
.innerHTML=`

<div id="printArea">

<div class="bg-slate-50 rounded-xl p-4 mb-4">

<h2 class="text-2xl font-bold text-blue-700">
فاتورة رقم ${id_order}
</h2>

<div class="mt-2">
التاريخ:
${new Date(order.date_order)
.toLocaleString()}
</div>

</div>

<div class="bg-slate-50 rounded-xl p-4 mb-4">

<div class="font-bold text-xl">
${order.customers?.first_name||''}
</div>

<div>
📞 ${order.customers?.tel||'-'}
</div>

<div>
💬 ${order.customers?.whatsapp||'-'}
</div>

<div class="text-blue-700 font-bold">
الرصيد:
${money(order.customers?.balance)}
</div>

</div>

<table class="w-full text-center">

<thead class="bg-slate-100">

<tr>

<th class="p-2">#</th>
<th class="p-2">المنتج</th>
<th class="p-2">السعر</th>
<th class="p-2">الكمية</th>
<th class="p-2">الإجمالي</th>

</tr>

</thead>

<tbody>

${rows}

</tbody>

</table>

<div class="mt-5 bg-green-50 p-5 rounded-xl">

<div class="text-lg">
الإجمالي الكلي
</div>

<div class="text-3xl font-bold text-green-700">
${money(total)}
</div>

</div>

</div>

`;

}

function searchInvoices(){

const value=
document.getElementById("search")
.value.toLowerCase();

document
.querySelectorAll("#invoiceTable tr")
.forEach(row=>{

row.style.display=
row.innerText.toLowerCase()
.includes(value)
? ""
: "none";

});

}

function printInvoice(){

const area=
document.getElementById("printArea");

if(!area) return;

const win=window.open();

win.document.write(area.innerHTML);

win.print();

win.close();

}

function downloadPDF(){

const area=
document.getElementById("printArea");

if(!area) return;

html2pdf()
.from(area)
.save(
"invoice_"+currentInvoiceId+".pdf"
);

}

loadStats();
loadInvoices();

</script>

</body>
</html>
```
