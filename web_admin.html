<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم طلبات المتجر - حساب الشحن المظبوط</title>
    <!-- استدعاء المكتبات والخطوط -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
        <!-- أولاً: واجهة إضافة وتعديل مناطق الشحن -->
        <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="font-bold text-lg text-gray-800 mb-4">🌍 إضافة / تعديل منطقة شحن</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">اسم المنطقة / المحافظة</label>
                    <input type="text" id="inputRegionName" placeholder="مثال: السوق الكبير، القلعة ..." class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">تكلفة الشحن (ج.س)</label>
                    <input type="number" id="inputRegionCost" placeholder="أدخل التكلفة..." class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-400">
                </div>
                <button onclick="addOrUpdateRegion()" id="btnAddRegion" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-sm transition cursor-pointer">
                    ➕ حفظ المنطقة
                </button>
            </div>
        </div>

        <!-- ثانياً: جدول استعراض المناطق والأسعار -->
        <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="font-bold text-lg text-gray-800 mb-4">🗺️ أسعار الشحن الحالية حسب المناطق</h3>
            <div class="overflow-y-auto max-h-[180px] border rounded-xl">
                <table class="w-full text-center text-xs">
                    <thead class="bg-gray-50 text-gray-600 sticky top-0">
                        <tr>
                            <th class="p-2.5">المنطقة</th>
                            <th class="p-2.5">تكلفة الشحن</th>
                            <th class="p-2.5">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="shippingRegionsTableBody" class="divide-y divide-gray-100">
                        <tr><td colspan="3" class="p-4 text-gray-400">جاري تحميل المناطق...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ثالثاً: واجهة إدارة واعتماد الطلبات -->
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-2xl shadow">
        <h1 class="text-2xl font-bold text-slate-800 border-b pb-4 mb-6 flex justify-between items-center">
            <span>📦 إدارة واعتماد طلبات المتجر أونلاين</span>
            <button onclick="loadWebOrders()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded-xl cursor-pointer">🔄 تحديث القائمة</button>
        </h1>

        <div class="overflow-x-auto">
            <table class="w-full text-center border-collapse">
                <thead>
                    <tr class="bg-slate-800 text-white text-sm">
                        <th class="p-3 rounded-r-lg">رقم الطلب</th>
                        <th class="p-3">العميل</th>
                        <th class="p-3">الهاتف</th>
                        <th class="p-3">العنوان / المنطقة</th>
                        <th class="p-3">تكلفة الشحن</th>
                        <th class="p-3">إجمالي الطلب</th>
                        <th class="p-3">الحالة</th>
                        <th class="p-3 rounded-l-lg">إجراءات</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody" class="text-sm divide-y divide-gray-100">
                    <tr><td colspan="8" class="p-8 text-gray-400">جاري تحميل الطلبات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- رابعاً: شاشة معاينة الفاتورة والمشاركة -->
    <div id="invoiceModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-[96%] max-w-lg overflow-hidden">
            <div class="bg-slate-800 text-white p-4 flex justify-between items-center">
                <h2 class="font-bold text-lg">📄 معاينة الفاتورة وتفاصيل الحساب</h2>
                <button onclick="closeInvoiceModal()" class="text-white hover:text-red-400 text-xl font-bold cursor-pointer">✕</button>
            </div>
            
            <div id="invoicePreviewContent" class="p-6 bg-gray-50 max-h-[60vh] overflow-y-auto flex justify-center">
                <!-- محتوى الفاتورة برمجياً -->
            </div>

            <div class="p-4 bg-white border-t flex flex-wrap gap-2 justify-center">
                <button id="btnPrintAction" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-bold cursor-pointer">🖨️ طباعة</button>
                <button id="btnWhatsappAction" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold cursor-pointer">📱 واتساب</button>
                <button id="btnCopyAction" class="bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-sm font-bold cursor-pointer">📋 نسخ النص</button>
                <button onclick="closeInvoiceModal()" class="bg-gray-200 hover:bg-gray-300 text-slate-700 px-4 py-2 rounded-xl text-sm font-bold cursor-pointer">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vmxbedovoahuggfpcmyk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"; 
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let loadedOrdersCache = [];
        let shippingRatesMap = {}; 

        // 1. جلب مناطق الشحن
        async function loadShippingRegions() {
            try {
                const { data, error } = await supabaseClient
                    .from("shipping_settings")
                    .select("*")
                    .order("region_name", { ascending: true });
                
                if (error) throw error;

                shippingRatesMap = {}; 
                let html = "";
                
                if (!data || data.length === 0) {
                    html = `<tr><td colspan="3" class="p-4 text-gray-400">لم يتم إضافة مناطق شحن بعد.</td></tr>`;
                } else {
                    data.forEach(row => {
                        shippingRatesMap[row.region_name.trim()] = Number(row.shipping_cost);
                        const safeRegionName = escapeHtml(row.region_name);

                        html += `
                        <tr class="hover:bg-gray-50">
                            <td class="p-2.5 font-semibold text-gray-700">${safeRegionName}</td>
                            <td class="p-2.5 font-bold text-blue-600">${Number(row.shipping_cost).toFixed(2)} ج.س</td>
                            <td class="p-2.5">
                                <button onclick="deleteRegion(${row.id}, '${safeRegionName}')" class="text-red-500 hover:text-red-700 font-bold px-2 cursor-pointer">حذف</button>
                            </td>
                        </tr>`;
                    });
                }
                document.getElementById("shippingRegionsTableBody").innerHTML = html;
            } catch (err) { 
                console.error("خطأ في قراءة إعدادات الشحن:", err); 
            }
        }

        // 2. دالة حساب الشحن فقط للمنطقة
        function getShippingCostForAddress(address) {
            if (!address) return 0;
            const cleanedAddress = address.trim();
            for (let region in shippingRatesMap) {
                if (cleanedAddress.includes(region) || region.includes(cleanedAddress)) {
                    return shippingRatesMap[region];
                }
            }
            return 0;
        }

        // 3. إضافة/تعديل منطقة
        async function addOrUpdateRegion() {
            const regionName = document.getElementById("inputRegionName").value.trim();
            const shippingCost = parseFloat(document.getElementById("inputRegionCost").value);

            if (!regionName || isNaN(shippingCost) || shippingCost < 0) {
                return alert("الرجاء إدخال اسم منطقة وتكلفة شحن صحيحة!");
            }

            const btn = document.getElementById("btnAddRegion");
            btn.disabled = true;

            try {
                const { error } = await supabaseClient
                    .from("shipping_settings")
                    .upsert(
                        { region_name: regionName, shipping_cost: shippingCost, updated_at: new Date().toISOString() },
                        { onConflict: 'region_name' }
                    );

                if (error) throw error;

                alert(`🎉 تم حفظ تكلفة الشحن لمنطقة (${regionName}) بنجاح!`);
                document.getElementById("inputRegionName").value = "";
                document.getElementById("inputRegionCost").value = "";
                await loadShippingRegions(); 
                loadWebOrders(); 
            } catch (err) {
                alert("حدث خطأ أثناء الحفظ: " + err.message);
            } finally {
                btn.disabled = false;
            }
        }

        // 4. حذف منطقة شحن
        async function deleteRegion(id, regionName) {
            if (!confirm(`هل تريد إزالة منطقة (${regionName})؟`)) return;
            try {
                const { error } = await supabaseClient.from("shipping_settings").delete().eq("id", id);
                if (error) throw error;
                await loadShippingRegions();
                loadWebOrders();
            } catch(err) {
                alert("فشل الحذف: " + err.message);
            }
        }

        // 5. جلب وعرض طلبات المتجر مع تفادي التكرار
        async function loadWebOrders() {
            try {
                const { data, error } = await supabaseClient
                    .from("web_orders")
                    .select("*")
                    .order("id_web_order", { ascending: false });

                if (error) throw error;

                loadedOrdersCache = data || [];
                let html = "";

                if (loadedOrdersCache.length === 0) {
                    html = `<tr><td colspan="8" class="p-8 text-gray-400">لا توجد طلبات جديدة حالياً.</td></tr>`;
                } else {
                    loadedOrdersCache.forEach(o => {
                        let isApproved = o.order_status === "تم الاعتماد والتوصيل";
                        let badgeClass = isApproved ? "bg-green-100 text-green-800" : "bg-yellow-100 text-yellow-800";
                        
                        let shippingCost = getShippingCostForAddress(o.client_address);
                        // نعتمد total_amount المسجل في الطلب كإجمالي نهائي ثابت
                        let totalAmount = Number(o.total_amount || 0);

                        html += `
                        <tr class="hover:bg-slate-50">
                            <td class="p-3 font-bold text-blue-600">#${o.id_web_order}</td>
                            <td class="p-3 font-semibold">${escapeHtml(o.client_name)}</td>
                            <td class="p-3">${escapeHtml(o.client_phone)}</td>
                            <td class="p-3 text-right max-w-xs truncate" title="${escapeHtml(o.client_address)}">${escapeHtml(o.client_address)}</td>
                            <td class="p-3 font-semibold text-orange-600">${shippingCost.toFixed(2)} ج.س</td>
                            <td class="p-3 font-bold text-emerald-600">${totalAmount.toFixed(2)} ج.س</td>
                            <td class="p-3"><span class="px-2 py-1 rounded-full text-xs ${badgeClass}">${escapeHtml(o.order_status)}</span></td>
                            <td class="p-3 flex justify-center gap-2 items-center">
                                <button onclick="previewAndPrepareInvoice(${o.id_web_order})" class="bg-amber-500 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-amber-600 font-bold cursor-pointer">🔍 عرض ومشاركة</button>
                                ${!isApproved ? `
                                    <button id="btn-approve-${o.id_web_order}" onclick="approveAndDeductStock(${o.id_web_order})" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-emerald-700 font-bold cursor-pointer">✔️ اعتماد</button>
                                ` : `<span class="text-xs text-gray-400 font-bold px-2 py-1 bg-gray-100 rounded-lg">🔒 معتمد</span>`}
                                <button onclick="deleteOrder(${o.id_web_order})" class="bg-red-500 text-white text-xs px-2 py-1.5 rounded-lg hover:bg-red-600 cursor-pointer">❌</button>
                            </td>
                        </tr>`;
                    });
                }
                document.getElementById("ordersTableBody").innerHTML = html;
            } catch(err) {
                alert("خطأ أثناء جلب الطلبات: " + err.message);
            }
        }

        // 6. معاينة الفاتورة وفصل المنتجات عن الشحن بدقة بدون دبلة
        async function previewAndPrepareInvoice(orderId) {
            const order = loadedOrdersCache.find(item => item.id_web_order === orderId);
            if (!order) return alert("تعذر العثور على معلومات الطلب");

            const { data: items, error } = await supabaseClient
                .from("web_order_details")
                .select("*")
                .eq("id_web_order", orderId);

            if (error || !items) return alert("فشل جلب تفاصيل المنتجات: " + error.message);

            const money = v => Number(v || 0).toLocaleString();
            
            // حساب مجموع المنتجات مباشرة من الأصناف
            let productsTotal = items.reduce((sum, item) => sum + Number(item.amount || 0), 0);
            let shippingCost = getShippingCostForAddress(order.client_address);
            
            // إذا كان total_amount المخزن في الطلب أكبر من مجموع المنتجات، نعتمد الإجمالي المخزن لضمان الدقة
            let grandTotal = Number(order.total_amount || 0);
            if (grandTotal < productsTotal) {
                grandTotal = productsTotal + shippingCost;
            }

            let rows = "";
            let shareText = `🧾 فاتورة طلب أونلاين رقم: #${orderId}\n👤 العميل: ${order.client_name}\n📞 الهاتف: ${order.client_phone}\n📍 العنوان: ${order.client_address}\n\n📦 المنتجات المطلوبة:\n`;

            items.forEach(i => {
                rows += `
                <tr>
                    <td style="padding:6px; border-bottom:1px solid #eee; text-align:right;">${escapeHtml(i.product_name)}</td>
                    <td style="text-align:center; border-bottom:1px solid #eee;">${i.qte}</td>
                    <td style="text-align:center; border-bottom:1px solid #eee;">${money(i.price)}</td>
                    <td style="text-align:center; font-weight:bold; color:#2563eb; border-bottom:1px solid #eee;">${money(i.amount)}</td>
                </tr>`;
                shareText += `- ${i.product_name} (الكمية: ${i.qte} | السعر: ${money(i.price)} ج.س)\n`;
            });

            shareText += `\n💵 مجموع المنتجات: ${money(productsTotal)} ج.س\n🚚 رسوم الشحن: ${money(shippingCost)} ج.س\n💰 الإجمالي النهائي: ${money(grandTotal)} ج.س\n🌹 شكراً لتعاملك مع ة ABM!`;

            const dateObj = new Date(order.date_created);
            const formattedDate = dateObj.toLocaleDateString("ar-EG");

            const invoiceHTML = `
            <div id="printableArea" style="width:80mm; background:#fff; border:1px solid #2563eb; border-radius:8px; overflow:hidden; font-size:11px; color:#222; box-shadow: 0 4px 6px rgba(0,0,0,0.05); direction:rtl;">
                <div style="background:linear-gradient(135deg,#2563eb,#1d4ed8); color:#fff; padding:10px; text-align:center;">
                    <div style="font-size:18px; font-weight:bold;">مؤسسة ABM</div>
                    <div style="font-size:12px; margin-top:2px;">فاتورة المتجر الإلكتروني</div>
                </div>
                <div style="padding:8px; background:#f8fafc; border-bottom:1px solid #ddd; line-height:1.7;">
                    <div style="display:flex; justify-content:space-between;">
                        <span><b>رقم الطلب:</b> #${orderId}</span>
                        <span>${formattedDate}</span>
                    </div>
                    <div>👤 <b>العميل :</b> ${escapeHtml(order.client_name)}</div>
                    <div>📞 <b>الهاتف :</b> ${escapeHtml(order.client_phone)}</div>
                    <div style="font-size:10px; color:#555;">📍 <b>العنوان :</b> ${escapeHtml(order.client_address)}</div>
                </div>
                <table style="width:100%; border-collapse:collapse; font-size:10px;">
                    <thead>
                        <tr style="background:#2563eb; color:#fff;">
                            <th style="padding:4px; text-align:right;">الصنف</th>
                            <th style="padding:4px;">الكمية</th>
                            <th style="padding:4px;">السعر</th>
                            <th style="padding:4px;">الجملة</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
                <div style="padding:8px; background:#f8fafc; border-top:1px solid #ddd; font-size:11px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                        <span>مجموع الاصناف:</span>
                        <span>${money(productsTotal)} ج.س</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:6px; color:#d97706; font-weight:bold;">
                        <span>🚚 رسوم الشحن:</span>
                        <span>${money(shippingCost)} ج.س</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#2563eb; color:#fff; padding:6px; border-radius:6px; font-size:12px; font-weight:bold;">
                        <span>الإجمالي النهائي</span>
                        <span>${money(grandTotal)} ج.س</span>
                    </div>
                </div>
                <div style="padding:8px; text-align:center; font-size:10px; color:#666; border-top:1px dashed #ccc;">
                    شكراً لتسوقكم أونلاين 🌹
                </div>
            </div>`;

            document.getElementById("invoicePreviewContent").innerHTML = invoiceHTML;

            // إجراءات الأزرار
            document.getElementById("btnPrintAction").onclick = function() {
                const w = window.open("", "_blank");
                w.document.write(`<html><head><title>طباعة الفاتورة</title><style>body{direction:rtl; font-family:Arial; display:flex; justify-content:center; padding:20px;}</style></head><body>${document.getElementById("invoicePreviewContent").innerHTML}<script>window.onload=function(){window.print(); window.close();}<\/script></body></html>`);
                w.document.close();
            };

            document.getElementById("btnWhatsappAction").onclick = function() {
                let cleanPhone = String(order.client_phone).replace(/\D/g, ''); 
                if (cleanPhone.startsWith('01')) { cleanPhone = '249' + cleanPhone.substring(1); }
                window.open(`https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodeURIComponent(shareText)}`, '_blank');
            };

            document.getElementById("btnCopyAction").onclick = function() {
                navigator.clipboard.writeText(shareText);
                alert("📋 تم نسخ نص الفاتورة الحقيقي بنجاح!");
            };

            const modal = document.getElementById("invoiceModal");
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        function closeInvoiceModal() {
            const modal = document.getElementById("invoiceModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }

        // 7. اعتماد الطلب وخصم الكميات بالقيم الدقيقة
        async function approveAndDeductStock(webOrderId) {
            const order = loadedOrdersCache.find(item => item.id_web_order === webOrderId);
            if (!order) return alert("تعذر العثور على معلومات الطلب");

            let shippingCost = getShippingCostForAddress(order.client_address);
            let finalGrandTotal = Number(order.total_amount || 0);

            if (!confirm(`هل أنت متأكد من اعتماد الطلب #${webOrderId}؟\nالإجمالي النهائي المعتمد: ${finalGrandTotal} ج.س`)) return;

            const btn = document.getElementById(`btn-approve-${webOrderId}`);
            if(btn) {
                btn.disabled = true;
                btn.innerText = "جاري الاعتماد...";
            }

            try {
                const currentDateTime = new Date().toISOString();
                const { data: items, error: itemsError } = await supabaseClient.from("web_order_details").select("*").eq("id_web_order", webOrderId);
                if (itemsError) throw itemsError;

                const { data: customerData } = await supabaseClient.from("customers").select("id_customer").limit(1);
                let fallbackCustomerId = (customerData && customerData.length > 0) ? customerData[0].id_customer : 1;

                const { data: orderData, error: orderError } = await supabaseClient.from("orders_o").insert([{
                    customer_id: fallbackCustomerId, date_order: currentDateTime, pay_method: "cash", seal_man: "اعتماد المتجر الإلكتروني"
                }]).select();

                if (orderError) throw orderError;
                const mainOrderId = orderData[0].id_order;

                for (let item of items) {
                    await supabaseClient.from("orders_details").insert([{
                        id_product: Number(item.id_product), id_order: Number(mainOrderId), qte: Number(item.qte),
                        price: Number(item.price), descount: 0, amount: Number(item.amount), total_amount: finalGrandTotal,
                        id_customer: fallbackCustomerId, date_order: currentDateTime, pay_method: "cash",
                        description_order: `فاتورة متجر معتمدة - العنوان: ${order.client_address} (رسوم الشحن: ${shippingCost} ج.س)`, 
                        seal_man: "المتجر الإلكتروني", first_name: order.client_name
                    }]);

                    const { data: prodData } = await supabaseClient.from("products").select("qte_in_stock").eq("id_product", item.id_product).single();
                    if (prodData) {
                        let newStock = (Number(prodData.qte_in_stock) || 0) - Number(item.qte);
                        await supabaseClient.from("products").update({ qte_in_stock: newStock }).eq("id_product", item.id_product);
                    }
                }

                await supabaseClient.from("web_orders").update({ order_status: "تم الاعتماد والتوصيل" }).eq("id_web_order", webOrderId);
                alert(`🎉 تم الاعتماد وتوليد الفاتورة رقم: ${mainOrderId}`);
                loadWebOrders();
            } catch (error) {
                alert("حدث خطأ أثناء عملية الاعتماد: " + error.message);
                if(btn) {
                    btn.disabled = false;
                    btn.innerText = "✔️ اعتماد";
                }
            }
        }

        // 8. حذف الطلب
        async function deleteOrder(id) {
            if (!confirm("هل أنت متأكد من حذف الطلب نهائياً؟")) return;
            try {
                const { error } = await supabaseClient.from("web_orders").delete().eq("id_web_order", id);
                if (error) throw error;
                loadWebOrders();
            } catch(err) {
                alert("تعذر حذف الطلب: " + err.message);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        window.onload = async function() {
            await loadShippingRegions();
            loadWebOrders();
        };
    </script>
</body>
</html>
