<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم طلبات المتجر الإلكتروني - مع الطباعة والاعتماد</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-100 p-4 md:p-8">

    <div class="max-w-6xl mx-auto bg-white p-6 rounded-2xl shadow">
        <h1 class="text-2xl font-bold text-slate-800 border-b pb-4 mb-6 flex justify-between items-center">
            <span>📦 إدارة واعتماد طلبات المتجر أونلاين</span>
            <button onclick="loadWebOrders()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded-xl">🔄 تحديث القائمة</button>
        </h1>

        <div class="overflow-x-auto">
            <table class="w-full text-center border-collapse">
                <thead>
                    <tr class="bg-slate-800 text-white text-sm">
                        <th class="p-3 rounded-r-lg">رقم الطلب</th>
                        <th class="p-3">العميل</th>
                        <th class="p-3">الهاتف</th>
                        <th class="p-3">العنوان</th>
                        <th class="p-3">الإجمالي</th>
                        <th class="p-3">الحالة</th>
                        <th class="p-3 rounded-l-lg">إجراءات</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody" class="text-sm divide-y divide-gray-100">
                    <tr><td colspan="7" class="p-8 text-gray-400">جاري تحميل الطلبات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(
            "https://vmxbedovoahuggfpcmyk.supabase.co",
            "sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"
        );

        async function loadWebOrders() {
            const { data, error } = await supabaseClient
                .from("web_orders")
                .select("*")
                .order("id_web_order", { ascending: false });

            if (error) return alert("خطأ أثناء جلب الطلبات: " + error.message);

            let html = "";
            if(data.length === 0) {
                html = `<tr><td colspan="7" class="p-8 text-gray-400">لا توجد طلبات جديدة حالياً.</td></tr>`;
            } else {
                data.forEach(o => {
                    let isApproved = o.order_status === "تم الاعتماد والتوصيل";
                    let badgeClass = isApproved ? "bg-green-100 text-green-800" : "bg-yellow-100 text-yellow-800";
                    
                    html += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-bold text-blue-600">#${o.id_web_order}</td>
                        <td class="p-3 font-semibold">${o.client_name}</td>
                        <td class="p-3">${o.client_phone}</td>
                        <td class="p-3 text-right max-w-xs truncate">${o.client_address}</td>
                        <td class="p-3 font-bold text-emerald-600">${Number(o.total_amount).toFixed(2)} ج.م</td>
                        <td class="p-3"><span class="px-2 py-1 rounded-full text-xs ${badgeClass}">${o.order_status}</span></td>
                        <td class="p-3 flex justify-center gap-2 items-center">
                            <button onclick="printWebInvoice(${o.id_web_order}, '${o.client_name}', '${o.client_phone}', '${o.client_address}', ${o.total_amount}, '${o.date_created}')" class="bg-amber-500 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-amber-600 font-bold flex items-center gap-1">🖨️ طباعة الفاتورة</button>
                            
                            ${!isApproved ? `
                                <button id="btn-approve-${o.id_web_order}" onclick="approveAndDeductStock(${o.id_web_order}, '${o.client_name}', '${o.client_phone}', '${o.client_address}', ${o.total_amount})" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-emerald-700 font-bold">✔️ اعتماد وخصم</button>
                            ` : `<span class="text-xs text-gray-400 font-bold px-2 py-1 bg-gray-100 rounded-lg">🔒 معتمد</span>`}
                            
                            <button onclick="deleteOrder(${o.id_web_order})" class="bg-red-500 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-red-600">❌</button>
                        </td>
                    </tr>`;
                });
            }
            document.getElementById("ordersTableBody").innerHTML = html;
        }

        // --- دالة الطباعة الاحترافية بنفس قالب الـ POS الأصلي ---
        async function printWebInvoice(orderId, name, phone, address, totalAmount, dateStr) {
            // جلب تفاصيل المنتجات الخاصة بالطلب من قاعدة البيانات أولاً
            const { data: items, error } = await supabaseClient
                .from("web_order_details")
                .select("*")
                .eq("id_web_order", orderId);

            if (error || !items) return alert("فشل جلب تفاصيل المنتجات للطباعة: " + error.message);

            const money = v => Number(v || 0).toLocaleString();
            let rows = "";

            items.forEach(i => {
                rows += `
                <tr>
                    <td style="padding:7px; border-bottom:1px solid #eee; text-align:right;">${i.product_name}</td>
                    <td style="text-align:center; border-bottom:1px solid #eee;">${i.qte}</td>
                    <td style="text-align:center; border-bottom:1px solid #eee;">${money(i.price)}</td>
                    <td style="text-align:center; font-weight:bold; color:#2563eb; border-bottom:1px solid #eee;">${money(i.amount)}</td>
                </tr>`;
            });

            const dateObj = new Date(dateStr);
            const formattedDate = dateObj.toLocaleDateString("ar-EG");
            const formattedTime = dateObj.toLocaleTimeString("ar-EG");

            // فتح نافذة طباعة جديدة منبثقة تحمل التصميم المطابق
            const w = window.open("", "_blank");
            w.document.write(`
            <!DOCTYPE html>
            <html lang="ar" dir="rtl">
            <head>
                <meta charset="UTF-8">
                <title>فاتورة طلب رقم #${orderId}</title>
                <style>
                    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
                    body { font-family: 'Cairo', Arial, sans-serif; direction: rtl; background: #fff; padding: 10px; display: flex; justify-content: center; }
                    table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; }
                    th { background: #2563eb; color: #fff; padding: 6px; text-align: center; }
                    @media print { body { padding: 0; } }
                </style>
            </head>
            <body>
                <div style="width:80mm; background:#fff; border:2px solid #2563eb; border-radius:12px; overflow:hidden; box-shadow:0 8px 20px rgba(0,0,0,.1); font-size:12px; color:#222;">
                    
                    <div style="background:linear-gradient(135deg,#2563eb,#1d4ed8); color:#fff; padding:12px; text-align:center;">
                        <div style="font-size:22px; font-weight:bold;">مؤسسة علاء الدين</div>
                        <div style="font-size:14px; margin-top:3px;">فاتورة المتجر الإلكتروني</div>
                        <div style="font-size:11px; opacity:.9;">ONLINE ORDER</div>
                    </div>

                    <div style="padding:10px; background:#f8fafc; border-bottom:1px solid #ddd; line-height:1.9;">
                        <div style="display:flex; justify-content:space-between;">
                            <span><b>رقم الطلب:</b> #${orderId}</span>
                            <span>${formattedDate}</span>
                        </div>
                        <div style="margin-top:4px;">👤 <b>العميل :</b> ${name}</div>
                        <div>📞 <b>الهاتف :</b> ${phone}</div>
                        <div style="font-size:11px; color:#555;">📍 <b>العنوان :</b> ${address}</div>
                        <div>🕒 ${formattedTime}</div>
                    </div>

                    <table>
                        <thead>
                            <tr>
                                <th style="padding:6px; text-align:right;">الصنف</th>
                                <th style="padding:6px;">الكمية</th>
                                <th style="padding:6px;">السعر</th>
                                <th style="padding:6px;">الجملة</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>

                    <div style="padding:10px; background:#f8fafc; border-top:1px solid #ddd;">
                        <div style="display:flex; justify-content:space-between; align-items:center; background:#2563eb; color:#fff; padding:10px; border-radius:8px; font-size:16px; font-weight:bold;">
                            <span>الإجمالي</span>
                            <span>${money(totalAmount)} ج.م</span>
                        </div>
                    </div>

                    <div style="padding:12px; text-align:center; font-size:11px; color:#666; border-top:1px dashed #ccc;">
                        شكراً لتسوقكم من متجرنا أونلاين 🌹<br>مؤسسة علاء الدين لخدمتكم دائماً
                    </div>
                </div>

                <script>
                    window.onload = function() {
                        window.print();
                        setTimeout(() => { window.close(); }, 500);
                    }
                <\/script>
            </body>
            </html>
            `);
            w.document.close();
        }

        // --- دالة الاعتماد والترحيل المحاسبي وتحديث المخزون ---
        async function approveAndDeductStock(webOrderId, name, phone, address, totalAmount) {
            if(!confirm(`هل أنت متأكد من اعتماد الطلب #${webOrderId}؟ سيتم خصم الكميات من المخزون وتوليد فاتورة POS.`)) return;

            const btn = document.getElementById(`btn-approve-${webOrderId}`);
            btn.disabled = true;
            btn.innerText = "جاري الاعتماد والخصم...";

            try {
                const currentDateTime = new Date().toISOString();

                const { data: items, error: itemsError } = await supabaseClient
                    .from("web_order_details")
                    .select("*")
                    .eq("id_web_order", webOrderId);

                if (itemsError) throw itemsError;

                const { data: customerData } = await supabaseClient.from("customers").select("id_customer").limit(1);
                let fallbackCustomerId = (customerData && customerData.length > 0) ? customerData[0].id_customer : 1;

                const { data: orderData, error: orderError } = await supabaseClient
                    .from("orders_o")
                    .insert([{
                        customer_id: fallbackCustomerId,
                        date_order: currentDateTime,
                        pay_method: "cash",
                        seal_man: "اعتماد المتجر الإلكتروني"
                    }]).select();

                if (orderError) throw orderError;
                const mainOrderId = orderData[0].id_order;

                for (let item of items) {
                    const { error: insertDetError } = await supabaseClient
                        .from("orders_details")
                        .insert([{
                            id_product: Number(item.id_product),
                            id_order: Number(mainOrderId),
                            qte: Number(item.qte),
                            price: Number(item.price),
                            descount: 0,
                            amount: Number(item.amount),
                            total_amount: Number(totalAmount),
                            id_customer: fallbackCustomerId,
                            date_order: currentDateTime,
                            pay_method: "cash",
                            description_order: `فاتورة متجر معتمدة - هاتف: ${phone}`,
                            seal_man: "المتجر الإلكتروني",
                            first_name: name
                        }]);

                    if (insertDetError) throw insertDetError;

                    const { data: prodData } = await supabaseClient
                        .from("products")
                        .select("qte_in_stock")
                        .eq("id_product", item.id_product)
                        .single();

                    if(prodData) {
                        let currentStock = Number(prodData.qte_in_stock) || 0;
                        let newStock = currentStock - Number(item.qte);

                        await supabaseClient
                            .from("products")
                            .update({ qte_in_stock: newStock })
                            .eq("id_product", item.id_product);
                    }
                }

                await supabaseClient
                    .from("web_orders")
                    .update({ order_status: "تم الاعتماد والتوصيل" })
                    .eq("id_web_order", webOrderId);

                alert(`🎉 تم الاعتماد بنجاح!\n- تم توليد فاتورة POS برقم: ${mainOrderId}\n- تم تحديث وخصم المخزون الفعلي لجميع القطع.`);
                loadWebOrders();

            } catch (error) {
                console.error(error);
                alert("حدث خطأ أثناء عملية الاعتماد: " + error.message);
                btn.disabled = false;
                btn.innerText = "✔️ اعتماد وخصم";
            }
        }

        async function deleteOrder(id) {
            if(!confirm("هل أنت متأكد من حذف هذا الطلب نهائياً من المتجر؟")) return;
            await supabaseClient.from("web_orders").delete().eq("id_web_order", id);
            loadWebOrders();
        }

        loadWebOrders();
    </script>
</body>
</html>
