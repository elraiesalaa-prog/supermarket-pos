<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POS + إدارة الفواتير الاحترافية</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{background:#eef2f7;font-family:Cairo}
.card{background:#fff;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,.08)}
</style>
</head>

<body>

<!-- HEADER -->
<header class="bg-blue-900 text-white p-4 text-center text-2xl font-bold">
📦 نظام الفواتير الاحترافي POS
</header>

<div class="max-w-7xl mx-auto p-4">

<!-- STATS -->
<div class="grid grid-cols-4 gap-3 mb-4 text-center">

<div class="card p-4">
<div>المبيعات</div>
<div id="totalSales" class="text-green-600 font-bold text-xl">0</div>
</div>

<div class="card p-4">
<div>الفواتير</div>
<div id="invoiceCount" class="text-blue-600 font-bold text-xl">0</div>
</div>

<div class="card p-4">
<div>العملاء</div>
<div id="customersCount" class="text-orange-600 font-bold text-xl">0</div>
</div>

<div class="card p-4">
<div>المنتجات</div>
<div id="productsCount" class="text-purple-600 font-bold text-xl">0</div>
</div>

</div>

<!-- TABLE -->
<div class="grid md:grid-cols-2 gap-4">

<!-- INVOICES -->
<div class="card p-3">
<h2 class="font-bold mb-2">الفواتير</h2>

<table class="w-full text-center text-sm">
<thead>
<tr class="bg-gray-100">
<th>رقم</th>
<th>عميل</th>
<th>الإجمالي</th>
</tr>
</thead>

<tbody id="invoiceTable">
<tr><td colspan="3">تحميل...</td></tr>
</tbody>

</table>
</div>

<!-- DETAILS -->
<div class="card p-3">
<h2 class="font-bold mb-2">التفاصيل</h2>
<div id="detailsBox" class="text-gray-500">اختر فاتورة</div>
</div>

</div>
</div>

<script>

// ================= SUPABASE =================
const { createClient } = window.supabase;

const supabase = createClient(
"https://vmxbedovoahuggfpcmyk.supabase.co",
"sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"
);

// ================= CACHE =================
let customers = [];
let products = [];
let invoices = [];

let customerMap = new Map();
let productMap = new Map();
let detailsMap = new Map();

// ================= FORMAT =================
const money = v => Number(v||0).toLocaleString();

// ================= LOAD MASTER DATA =================
async function loadMaster(){

const [{data:c},{data:p}] = await Promise.all([
supabase.from("customers").select("*"),
supabase.from("products").select("*")
]);

customers = c || [];
products = p || [];

// MAPS (FAST ACCESS)
customerMap = new Map(customers.map(c => [c.id_customer, c]));
productMap = new Map(products.map(p => [p.id_product, p]));
console.log("customers:", c);
console.log("products:", p);
}

// ================= LOAD DETAILS (ONE TIME ONLY) =================
async function loadDetails(){

const {data} = await supabase
.from("orders_details")
.select("*");

detailsMap.clear();

(data||[]).forEach(d=>{
if(!detailsMap.has(d.id_order)) detailsMap.set(d.id_order,[]);
detailsMap.get(d.id_order).push(d);
});

}

// ================= STATS =================
async function loadStats(){

const [{data:orders},{data:details}] = await Promise.all([

supabase.from("orders_o").select("*"),
supabase.from("orders_details").select("total_amount")

]);

const total = (details||[])
.reduce((s,r)=>s+Number(r.total_amount||0),0);

document.getElementById("totalSales").innerText = money(total);
document.getElementById("invoiceCount").innerText = orders.length;
document.getElementById("customersCount").innerText = customers.length;
document.getElementById("productsCount").innerText = products.length;

}

// ================= LOAD INVOICES =================
async function loadInvoices(){

const {data} = await supabase
.from("orders_o")
.select("*")
.order("id_order",{ascending:false});

invoices = data || [];

renderInvoices();

}

// ================= RENDER =================
function renderInvoices(){

let html="";

invoices.forEach(inv=>{

const cust = customerMap.get(inv.customer_id);

const details = detailsMap.get(inv.id_order)||[];

const total = details.reduce((s,r)=>s+Number(r.total_amount||0),0);

html+=`
<tr onclick="openInvoice(${inv.id_order})" class="border-b hover:bg-blue-50 cursor-pointer">

<td>${inv.id_order}</td>
<td>${cust?.first_name||"-"}</td>
<td class="text-green-600 font-bold">${money(total)}</td>

</tr>
`;

});

document.getElementById("invoiceTable").innerHTML =
html || "<tr><td colspan='3'>لا توجد بيانات</td></tr>";

}

// ================= OPEN INVOICE =================
function openInvoice(id){

const inv = invoices.find(i=>i.id_order===id);

const cust = customerMap.get(inv.customer_id);

const details = detailsMap.get(id)||[];

let total = 0;

let rows="";

details.forEach((d,i)=>{

const p = productMap.get(d.id_product);

total += Number(d.total_amount||0);

rows+=`
<tr>
<td>${i+1}</td>
<td>${p?.product_name||"-"}</td>
<td>${money(d.price)}</td>
<td>${d.qte}</td>
<td>${money(d.total_amount)}</td>
</tr>
`;

});

document.getElementById("detailsBox").innerHTML=`

<div id="printArea" class="p-3">

<h2 class="text-xl font-bold text-blue-700">
فاتورة #${inv.id_order}
</h2>

<div>العميل: ${cust?.first_name||"-"}</div>
<div>الهاتف: ${cust?.tel||"-"}</div>

<table class="w-full mt-3 border text-center">
<tr class="bg-gray-100">
<th>#</th><th>منتج</th><th>سعر</th><th>كمية</th><th>إجمالي</th>
</tr>
${rows}
</table>

<div class="mt-3 text-green-700 font-bold text-xl">
الإجمالي: ${money(total)}
</div>

</div>
`;

}

// ================= INIT =================
async function init(){

await loadMaster();
await loadDetails();
await loadStats();
await loadInvoices();

}

init();

</script>

</body>
</html>
