<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الفواتير الاحترافي FIXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { background: #eef2f7; font-family: 'Cairo', sans-serif; }
        .card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,.1) }
        table { width: 100% }
        th, td { padding: 8px; text-align: center }
        
        #invoiceContent table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        #invoiceContent th {
            background: #1e40af;
            color: white;
            padding: 10px;
            border: 1px solid #d1d5db;
        }
        #invoiceContent td {
            padding: 9px;
            border: 1px solid #d1d5db;
        }
        #invoiceContent tr:nth-child(even) {
            background: #f8fafc;
        }
        #invoiceContent h2 {
            letter-spacing: 1px;
        }

        @media print {
            button, .no-print { display: none !important; }
            body { background: white; }
        }

        tbody tr {
            cursor: pointer;
            transition: .25s;
        }
        tbody tr:hover {
            transform: scale(1.01);
            background: #dbeafe;
        }
    </style>
</head>

<body class="bg-slate-100">

    <header class="bg-gradient-to-l from-blue-900 to-blue-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto flex items-center justify-between p-4">
            <h1 class="text-2xl font-bold">📦 نظام الفواتير الاحترافي</h1>
            <div class="text-sm opacity-80">Professional Invoice System</div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto p-5">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-xl shadow p-5 text-center">
                <div class="text-gray-500 mb-2">إجمالي المبيعات (بالشحن)</div>
                <div id="sales" class="text-2xl font-bold text-green-600">0</div>
            </div>
            <div class="bg-white rounded-xl shadow p-5 text-center">
                <div class="text-gray-500 mb-2">عدد الفواتير</div>
                <div id="invCount" class="text-2xl font-bold text-blue-700">0</div>
            </div>
            <div class="bg-white rounded-xl shadow p-5 text-center">
                <div class="text-gray-500 mb-2">العملاء</div>
                <div id="cusCount" class="text-2xl font-bold text-orange-600">0</div>
            </div>
            <div class="bg-white rounded-xl shadow p-5 text-center">
                <div class="text-gray-500 mb-2">المنتجات</div>
                <div id="proCount" class="text-2xl font-bold text-purple-700">0</div>
            </div>
        </div>

        <div class="grid lg:grid-cols-2 gap-5">
            <div class="bg-white rounded-xl shadow overflow-hidden">
                <div class="bg-blue-700 text-white p-4 font-bold">📋 قائمة الفواتير</div>
                <div class="overflow-auto">
                    <table class="min-w-full">
                        <thead>
                            <tr class="bg-slate-100">
                                <th class="p-3">رقم</th>
                                <th class="p-3">العميل</th>
                                <th class="p-3">الإجمالي الكلي</th>
                            </tr>
                        </thead>
                        <tbody id="invoices">
                            <tr>
                                <td colspan="3" class="p-6 text-gray-500">جاري تحميل البيانات...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow">
                <div class="bg-green-700 text-white p-4 font-bold">🧾 تفاصيل الفاتورة</div>
                <div id="details" class="p-6 text-gray-500">اختر فاتورة لعرض تفاصيلها</div>
            </div>
        </div>
    </div>

    <div id="invoiceModal" class="fixed inset-0 hidden items-center justify-center bg-black/70 z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
            
            <div class="bg-gradient-to-l from-blue-900 to-blue-700 text-white p-4 flex justify-between items-center shrink-0">
                <h2 class="font-bold text-lg">📄 معاينة وخيارات المشاركة</h2>
                <button onclick="closeInvoice()" class="bg-red-500 hover:bg-red-600 text-white rounded-lg px-3 py-1 font-bold">✕</button>
            </div>
            
            <div id="invoiceContent" class="bg-gray-100 p-4 overflow-y-auto flex justify-center grow">
                </div>

            <div class="bg-white p-3 shrink-0 border-t flex flex-wrap gap-2 justify-center no-print">
                <button onclick="shareInvoiceWhatsApp()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-bold text-xs transition">
                    📱 واتساب
                </button>
                <button onclick="copyInvoiceText()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-xl font-bold text-xs transition">
                    📋 نسخ النص
                </button>
                <button onclick="printInvoice()" class="bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded-xl font-bold text-xs transition">
                    🖨 طباعة
                </button>
                <button onclick="closeInvoice()" class="bg-gray-200 hover:bg-gray-300 text-slate-800 px-4 py-2 rounded-xl font-bold text-xs transition">
                    إغلاق
                </button>
            </div>

        </div>
    </div>

    <script>
        // ================= FIX SUPABASE =================
        const { createClient } = window.supabase;
        const supabaseClient = createClient(
            "https://vmxbedovoahuggfpcmyk.supabase.co",
            "sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"
        );

        // ================= DATA STATE =================
        let customers = [];
        let products = [];
        let orders = [];
        let details = [];

        let customerMap = new Map();
        let productMap = new Map();
        let detailsMap = new Map();

        // كائن عالمي لحفظ بيانات الفاتورة المفتوحة حالياً لتمريرها للأزرار
        let currentOpenInvoiceData = null;

        const money = v => Number(v || 0).toLocaleString();
        let sellerName = "المستخدم الحالي";

        async function loadCurrentUser() {
            try {
                const { data } = await supabaseClient.auth.getUser();
                if (data.user) {
                    sellerName = data.user.user_metadata?.full_name || data.user.user_metadata?.name || data.user.email || "المستخدم الحالي";
                }
            } catch (e) {
                console.log(e);
            }
        }

        function closeInvoice() {
            document.getElementById("invoiceModal").classList.add("hidden");
            document.getElementById("invoiceModal").classList.remove("flex");
        }

        function printInvoice() {
            const content = document.getElementById("invoiceContent").innerHTML;
            const w = window.open("", "_blank");
            w.document.write(`
            <!DOCTYPE html>
            <html lang="ar" dir="rtl">
            <head>
                <meta charset="UTF-8">
                <title>فاتورة</title>
                <style>
                    body{ font-family:Cairo,Arial; padding:10px; direction:rtl; display:flex; justify-content:center; }
                    @media print{ body{ margin:0; } }
                </style>
            </head>
            <body>
                ${content}
                <script>window.onload=function(){ window.print(); window.close(); }<\/script>
            </body>
            </html>`);
            w.document.close();
        }

        // ================= LOAD MASTER DATA =================
        async function loadMaster() {
            try {
                const [customersRes, productsRes] = await Promise.all([
                    supabaseClient.from("customers").select("*"),
                    supabaseClient.from("products").select("*")
                ]);

                if (customersRes.error) throw customersRes.error;
                if (productsRes.error) throw productsRes.error;

                customers = customersRes.data || [];
                products = productsRes.data || [];

                customerMap.clear();
                productMap.clear();

                customers.forEach(c => customerMap.set(c.id_customer, c));
                products.forEach(p => productMap.set(p.id_product, p));

            } catch (err) {
                console.error("LOAD MASTER ERROR :", err);
                alert("خطأ في تحميل العملاء أو المنتجات");
            }
        }

        // ================= LOAD DETAILS =================
        async function loadDetails() {
            try {
                const { data, error } = await supabaseClient.from("orders_details").select("*");
                if (error) throw error;

                details = data || [];
                detailsMap.clear();

                details.forEach(item => {
                    if (!detailsMap.has(item.id_order)) {
                        detailsMap.set(item.id_order, []);
                    }
                    detailsMap.get(item.id_order).push(item);
                });
            } catch (err) {
                console.error("DETAIL ERROR :", err);
                alert("تعذر تحميل تفاصيل الفواتير");
            }
        }

        // ================= LOAD ORDERS =================
        async function loadOrders() {
            try {
                // ملاحظة: تأكد أن حقل shipping_cost موجود في جدول orders_o بقاعدة البيانات
                const { data, error } = await supabaseClient.from("orders_o").select("*").order("id_order", { ascending: false });
                if (error) throw error;

                orders = data || [];
                renderOrders();
            } catch (err) {
                console.error("ORDER ERROR :", err);
                alert("تعذر تحميل الفواتير");
            }
        }

        // ================= RENDER ORDERS LIST =================
        function renderOrders() {
            const tbody = document.getElementById("invoices");
            tbody.innerHTML = "";

            if (!orders.length) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-gray-400">لا توجد فواتير</td></tr>`;
                return;
            }

            orders.forEach(order => {
                const customer = customerMap.get(order.customer_id);
                const items = detailsMap.get(order.id_order) || [];
                
                // حساب مجموع المنتجات + إضافة تكلفة الشحن المخزنة في الفاتورة الرئيسية
                const itemsTotal = items.reduce((sum, item) => sum + Number(item.total_amount || 0), 0);
                const shippingCost = Number(order.shipping_cost || order.delivery_fee || 0); 
                const finalTotal = itemsTotal + shippingCost;

                tbody.innerHTML += `
                <tr class="cursor-pointer hover:bg-blue-50 transition" onclick="openOrder(${order.id_order})">
                    <td class="p-3">#${order.id_order}</td>
                    <td class="p-3">${customer?.first_name || "بدون اسم"}</td>
                    <td class="p-3 font-bold text-green-600">${money(finalTotal)} ج.م</td>
                </tr>`;
            });
        }

        // ================= OPEN AND VIEW ORDER =================
        function openOrder(id) {
            const order = orders.find(o => o.id_order == id);
            if (!order) {
                alert("الفاتورة غير موجودة");
                return;
            }

            const cust = customerMap.get(order.customer_id);
            const items = detailsMap.get(id) || [];

            let itemsSubtotal = 0;
            let rows = "";
            let itemsTextForShare = "";

            items.forEach((item) => {
                const product = productMap.get(item.id_product);
                const qty = item.qte ?? item.quantity ?? item.qty ?? 0;
                const price = Number(item.price || 0);
                const lineTotal = Number(item.total_amount || item.amount || (qty * price));

                itemsSubtotal += lineTotal;
                const prodName = product?.product_name || "منتج غير مدرج حالياً";

                rows += `
                <tr>
                    <td style="padding:6px; border-bottom:1px solid #eee; text-align:right;">${prodName}</td>
                    <td style="text-align:center; border-bottom:1px solid #eee;">${qty}</td>
                    <td style="text-align:center; border-bottom:1px solid #eee;">${money(price)}</td>
                    <td style="text-align:center; font-weight:bold; color:#2563eb; border-bottom:1px solid #eee;">${money(lineTotal)}</td>
                </tr>`;

                itemsTextForShare += `- ${prodName} (الكمية: ${qty} | السعر: ${money(price)} ج.م)\n`;
            });

            // جلب قيمة الشحن المضافة للفاتورة الرئيسية وحساب الإجمالي النهائي
            const shippingCost = Number(order.shipping_cost || order.delivery_fee || 0);
            const finalTotal = itemsSubtotal + shippingCost;

            const invoiceDate = order.created_at || order.date_order || order.order_date || new Date().toISOString();
            const invoiceObj = new Date(invoiceDate);
            const date = invoiceObj.toLocaleDateString("ar-EG");
            const time = invoiceObj.toLocaleTimeString("ar-EG");
            const currentInvoiceSeller = order.seal_man || sellerName || "غير معروف";

            // تخزين البيانات في الكائن لضمان عمل دالة المشاركة والنسخ
            currentOpenInvoiceData = {
                id: id,
                customerName: cust?.first_name || "بدون اسم",
                customerPhone: cust?.phone || "",
                seller: currentInvoiceSeller,
                date: date,
                itemsText: itemsTextForShare,
                shipping: shippingCost,
                subtotal: itemsSubtotal,
                total: money(finalTotal)
            };

            // بناء هيكل الفاتورة الحرارية المعروضة متضمنة الشحن
            document.getElementById("invoiceContent").innerHTML = `
            <div style="width:80mm; background:#fff; border:1px solid #2563eb; border-radius:8px; overflow:hidden; font-family:Cairo,sans-serif; font-size:11px; color:#222; padding:2px;">
                <div style="background:linear-gradient(135deg,#2563eb,#1d4ed8); color:#fff; padding:10px; text-align:center;">
                    <div style="font-size:18px; font-weight:bold;">مؤسسة علاء الدين</div>
                    <div style="font-size:12px; margin-top:2px;">فاتورة مبيعات</div>
                </div>

                <div style="padding:8px; background:#f8fafc; border-bottom:1px solid #ddd; line-height:1.7;">
                    <div style="display:flex; justify-content:space-between;">
                        <span><b>رقم الفاتورة:</b> #${id}</span>
                        <span>${date}</span>
                    </div>
                    <div style="margin-top:2px;">👤 <b>العميل :</b> ${currentOpenInvoiceData.customerName}</div>
                    <div>🛒 <b>البائع :</b> ${currentOpenInvoiceData.seller}</div>
                    <div>🕒 ${time}</div>
                </div>

                <table style="width:100%; border-collapse:collapse; font-size:10px;">
                    <thead>
                        <tr style="background:#2563eb; color:#fff;">
                            <th style="padding:5px; text-align:right;">الصنف</th>
                            <th style="padding:5px;">الكمية</th>
                            <th style="padding:5px;">السعر</th>
                            <th style="padding:5px;">الجملة</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>

                <div style="padding:8px; background:#f8fafc; border-top:1px solid #ddd; font-size:10px; line-height: 1.6;">
                    <div style="display:flex; justify-content:space-between; color:#555;">
                        <span>إجمالي المنتجات:</span>
                        <span>${money(itemsSubtotal)} ج.م</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; color:#555; margin-bottom:4px;">
                        <span>تكلفة الشحن:</span>
                        <span>+ ${money(shippingCost)} ج.م</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#2563eb; color:#fff; padding:6px; border-radius:6px; font-size:13px; font-weight:bold;">
                        <span>الإجمالي الكلي</span>
                        <span>${money(finalTotal)} ج.م</span>
                    </div>
                </div>

                <div style="padding:10px; text-align:center; font-size:10px; color:#666; border-top:1px dashed #ccc;">
                    شكراً لتعاملكم معنا 🌹<br>نتمنى لكم يوماً سعيداً
                </div>
            </div>`;

            // تحديث قسم التفاصيل السريعة على جانب الصفحة
            document.getElementById("details").innerHTML = `
                <div class="space-y-2">
                    <p class="font-bold text-lg text-slate-800">فاتورة رقم: #${id}</p>
                    <p><b>العميل:</b> ${currentOpenInvoiceData.customerName}</p>
                    <p><b>التاريخ:</b> ${date}</p>
                    <div class="border-t pt-2 text-sm text-gray-600">
                        <p>إجمالي الأصناف: ${money(itemsSubtotal)} ج.م</p>
                        <p>تكلفة الشحن: ${money(shippingCost)} ج.م</p>
                    </div>
                    <p class="text-xl font-bold text-blue-700 pt-1">الإجمالي الكلي: ${money(finalTotal)} ج.م</p>
                </div>`;

            const modal = document.getElementById("invoiceModal");
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        // ================= MEDIA SHARE LOGIC =================
        function generateShareText() {
            if (!currentOpenInvoiceData) return "";
            let text = `🧾 *فاتورة مبيعات - مؤسسة علاء الدين* 🧾\n`;
            text += `------------------------------------\n`;
            text += `🔢 *رقم الفاتورة:* #${currentOpenInvoiceData.id}\n`;
            text += `👤 *العميل:* ${currentOpenInvoiceData.customerName}\n`;
            text += `🛒 *البائع:* ${currentOpenInvoiceData.seller}\n`;
            text += `📅 *التاريخ:* ${currentOpenInvoiceData.date}\n`;
            text += `------------------------------------\n`;
            text += `📦 *الأصناف والقطع:*\n`;
            text += currentOpenInvoiceData.itemsText;
            text += `------------------------------------\n`;
            text += `💵 *إجمالي الأصناف:* ${money(currentOpenInvoiceData.subtotal)} ج.م\n`;
            text += `🛵 *تكلفة الشحن:* ${money(currentOpenInvoiceData.shipping)} ج.م\n`;
            text += `💰 *الإجمالي الكلي:* ${currentOpenInvoiceData.total} ج.م\n\n`;
            text += `🌹 شكراً لتعاملكم معنا ونتمنى لكم يوماً سعيداً 🌹`;
            return text;
        }

        function shareInvoiceWhatsApp() {
            if (!currentOpenInvoiceData) return alert("الرجاء اختيار فاتورة أولاً!");
            const shareText = generateShareText();
            let phone = currentOpenInvoiceData.customerPhone.replace(/\D/g, '');
            if (phone.startsWith('01')) { phone = '20' + phone.substring(1); }
            
            const url = `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(shareText)}`;
            window.open(url, '_blank');
        }

        function copyInvoiceText() {
            if (!currentOpenInvoiceData) return alert("الرجاء اختيار فاتورة أولاً!");
            const shareText = generateShareText();
            navigator.clipboard.writeText(shareText).then(() => {
                alert("📋 تم نسخ نص الفاتورة المنظم بنجاح! يمكنك الآن لصقها في أي ميديا (تليجرام، ماسنجر، إيميل...).");
            }).catch(() => {
                alert("فشل نسخ النص، يرجى المحاولة يدوياً.");
            });
        }

        // ================= STATS =================
        async function loadStats() {
            try {
                const [{ data: ordersData, error: e1 }, { data: detailsData, error: e2 }] = await Promise.all([
                    supabaseClient.from("orders_o").select("*"),
                    supabaseClient.from("orders_details").select("total_amount")
                ]);

                if (e1) throw e1;
                if (e2) throw e2;

                // احتساب المبيعات شاملة قيمة الشحن لكل الفواتير
                const itemsSum = (detailsData || []).reduce((s, x) => s + Number(x.total_amount || 0), 0);
                const shippingSum = (ordersData || []).reduce((s, o) => s + Number(o.shipping_cost || o.delivery_fee || 0), 0);
                const totalSales = itemsSum + shippingSum;

                document.getElementById("sales").innerText = money(totalSales) + " ج.م";
                document.getElementById("invCount").innerText = ordersData.length;
                document.getElementById("cusCount").innerText = customers.length;
                document.getElementById("proCount").innerText = products.length;

            } catch (err) {
                console.error(err);
            }
        }

        // ================= INITIALIZATION =================
        async function init() {
            console.log("loading...");
            await loadCurrentUser();
            await loadMaster();
            await loadDetails();
            await loadOrders();
            await loadStats();
            console.log("done");
        }

        init();
    </script>
</body>
</html>
