<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة الفواتير</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

<!-- ================= HEADER ================= -->
<div class="bg-blue-600 text-white p-4 text-center text-2xl font-bold">
    نظام إدارة الفواتير
</div>

<!-- ================= MAIN ================= -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4">

<!-- ========== العملاء ========== -->
<div class="bg-white p-4 rounded shadow">
    <h2 class="text-lg font-bold mb-2">العملاء</h2>
    <select id="customerSelect" class="w-full border p-2 rounded"></select>

    <div class="mt-2 text-sm text-gray-500" id="customerInfo"></div>
</div>

<!-- ========== المنتجات ========== -->
<div class="bg-white p-4 rounded shadow">
    <h2 class="text-lg font-bold mb-2">المنتجات</h2>

    <select id="productSelect" class="w-full border p-2 rounded"></select>

    <input id="qty" type="number" placeholder="الكمية"
        class="w-full border p-2 rounded mt-2">

    <button onclick="addToCart()"
        class="bg-green-600 text-white w-full p-2 mt-2 rounded">
        إضافة للفاتورة
    </button>
</div>

<!-- ========== الفاتورة الحالية ========== -->
<div class="bg-white p-4 rounded shadow">
    <h2 class="text-lg font-bold mb-2">الفاتورة الحالية</h2>

    <div id="cart" class="text-sm space-y-2"></div>

    <button onclick="createOrder()"
        class="bg-blue-600 text-white w-full p-2 mt-3 rounded">
        حفظ الفاتورة
    </button>
</div>

</div>

<!-- ================= الفواتير ================= -->
<div class="p-4">
    <h2 class="text-xl font-bold mb-3">الفواتير المسجلة</h2>
    <div id="ordersList" class="space-y-3"></div>
</div>

<script>
// ================= SUPABASE =================
const { createClient } = window.supabase;

const supabase = createClient(
  "https://vmxbedovoahuggfpcmyk.supabase.co",
  "sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"
);

// ================= STATE =================
let cart = [];

// ================= LOAD DATA =================
async function loadCustomers() {
    let { data } = await supabase.from('customers').select('*');

    let select = document.getElementById('customerSelect');
    select.innerHTML = "";

    data.forEach(c => {
        let opt = document.createElement('option');
        opt.value = c.id_customer;
        opt.textContent = c.first_name + " - " + (c.tel || "");
        select.appendChild(opt);
    });
}

async function loadProducts() {
    let { data } = await supabase.from('products').select('*');

    let select = document.getElementById('productSelect');
    select.innerHTML = "";

    data.forEach(p => {
        let opt = document.createElement('option');
        opt.value = p.id_product;
        opt.textContent = p.product_name + " | سعر: " + p.seal_price;
        opt.dataset.price = p.seal_price;
        select.appendChild(opt);
    });
}

async function loadOrders() {
    let { data } = await supabase
        .from('orders_o')
        .select('*, customers(first_name)')
        .order('id_order', { ascending: false });

    let container = document.getElementById('ordersList');
    container.innerHTML = "";

    data.forEach(o => {
        let div = document.createElement('div');
        div.className = "bg-white p-3 rounded shadow";

        div.innerHTML = `
            <div class="font-bold">فاتورة #${o.id_order}</div>
            <div>العميل: ${o.customers?.first_name || ''}</div>
            <div>التاريخ: ${o.date_order || ''}</div>
            <button onclick="loadOrderDetails(${o.id_order})"
                class="text-blue-600 mt-2">عرض التفاصيل</button>
            <div id="details-${o.id_order}" class="mt-2"></div>
        `;

        container.appendChild(div);
    });
}

// ================= CART =================
function addToCart() {
    let select = document.getElementById('productSelect');
    let qty = document.getElementById('qty').value;

    let product = select.options[select.selectedIndex];

    cart.push({
        id_product: product.value,
        name: product.text,
        qty: qty,
        price: product.dataset.price,
        total: qty * product.dataset.price
    });

    renderCart();
}

function renderCart() {
    let container = document.getElementById('cart');
    container.innerHTML = "";

    cart.forEach((item, i) => {
        container.innerHTML += `
            <div class="border p-2 rounded">
                ${item.name} - ${item.qty} × ${item.price} = ${item.total}
                <button onclick="removeItem(${i})" class="text-red-600">حذف</button>
            </div>
        `;
    });
}

function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
}

// ================= CREATE ORDER =================
async function createOrder() {

    let customer_id = document.getElementById('customerSelect').value;

    let { data: order } = await supabase
        .from('orders_o')
        .insert([{
            customer_id: customer_id,
            date_order: new Date(),
            pay_method: "cash",
            description_order: "فاتورة جديدة"
        }])
        .select()
        .single();

    for (let item of cart) {
        await supabase.from('orders_details').insert([{
            id_order: order.id_order,
            id_product: item.id_product,
            qte: item.qty,
            price: item.price,
            total_amount: item.total,
            id_customer: customer_id,
            date_order: new Date()
        }]);
    }

    cart = [];
    renderCart();
    loadOrders();

    alert("تم حفظ الفاتورة بنجاح");
}

// ================= ORDER DETAILS =================
async function loadOrderDetails(orderId) {

    let { data } = await supabase
        .from('orders_details')
        .select('*, products(product_name)')
        .eq('id_order', orderId);

    let container = document.getElementById(`details-${orderId}`);
    container.innerHTML = "";

    data.forEach(d => {
        container.innerHTML += `
            <div class="text-sm border-t p-1">
                ${d.products?.product_name} - ${d.qte} × ${d.price} = ${d.total_amount}
            </div>
        `;
    });
}

// ================= INIT =================
loadCustomers();
loadProducts();
loadOrders();

</script>

</body>
</html>
