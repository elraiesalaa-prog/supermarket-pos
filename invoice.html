<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الفواتير - عرض بيانات المتجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { background: #f8fafc; font-family: 'Cairo', sans-serif; }
        
        .invoice-table {
            width: 100%;
            border-collapse: collapse;
        }
        .invoice-table th {
            background: #1e40af;
            color: white;
            padding: 6px 4px;
            border: 1px solid #cbd5e1;
            font-size: 11px;
        }
        .invoice-table td {
            padding: 5px 4px;
            border: 1px solid #cbd5e1;
            font-size: 11px;
        }

        @media print {
            button, .no-print { display: none !important; }
            body { background: white; margin: 0; padding: 0; }
            #invoiceModal { position: static; background: none; padding: 0; display: block !important; }
            .modal-box { width: 100% !important; box-shadow: none !important; }
        }
    </style>
</head>

<body class="bg-slate-100">

    <header class="bg-blue-900 text-white p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">📋 عرض بيانات الفواتير المعتمدة والهاتف والمنطقة</h1>
        </div>
    </header>

    <div class="max-w-7xl mx-auto p-4 grid lg:grid-cols-2 gap-5">
        
        <!-- قائمة الفواتير -->
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <div class="bg-blue-800 text-white p-3 font-bold">قائمة الفواتير</div>
            <div class="overflow-auto max-h-[600px]">
                <table class="min-w-full text-right">
                    <thead>
                        <tr class="bg-slate-100 border-b text-xs">
                            <th class="p-3 text-center">رقم الفاتورة</th>
                            <th class="p-3">اسم العميل</th>
                            <th class="p-3">الهاتف</th>
                            <th class="p-3 text-center">الإجمالي</th>
                        </tr>
                    </thead>
                    <tbody id="invoicesList">
                        <tr>
                            <td colspan="4" class="p-6 text-gray-500 text-center">جاري تحميل البيانات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- تفاصيل الفاتورة -->
        <div class="bg-white rounded-xl shadow p-5">
            <div class="bg-slate-800 text-white p-3 rounded-t-lg font-bold -m-5 mb-5">معاينة البيانات والجلب</div>
            <div id="invoiceDetails" class="text-gray-500 text-center py-12">
                اضغط على أي فاتورة لعرض رقم الهاتف والمنطقة والتفاصيل.
            </div>
        </div>

    </div>

    <!-- نافذة المعاينة والطباعة -->
    <div id="invoiceModal" class="fixed inset-0 hidden items-center justify-center bg-black/60 z-50 p-4">
        <div class="modal-box bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-blue-900 text-white px-4 py-3 flex justify-between items-center">
                <h2 class="font-bold text-sm">📄 الفاتورة الرسمية</h2>
                <button onclick="closeInvoice()" class="bg-red-500 text-white rounded px-2 py-0.5 font-bold text-xs">✕</button>
            </div>
            
            <div id="invoiceContent" class="p-3 overflow-y-auto grow flex justify-center bg-slate-100"></div>
            
            <div class="bg-white p-3 border-t flex justify-center gap-2 no-print">
                <button onclick="printInvoice()" class="bg-blue-700 text-white px-4 py-1.5 rounded font-bold text-xs">🖨 طباعة</button>
                <button onclick="closeInvoice()" class="bg-gray-200 text-slate-800 px-4 py-1.5 rounded font-bold text-xs">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        const { createClient } = window.supabase;
        const supabaseClient = createClient(
            "https://vmxbedovoahuggfpcmyk.supabase.co",
            "sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"
        );

        let posOrders = [];
        let webOrdersMap = new Map();
        let posDetailsMap = new Map();
        let unifiedInvoices = [];

        const money = v => Number(v || 0).toLocaleString('ar-EG');

        function closeInvoice() {
            document.getElementById("invoiceModal").classList.add("hidden");
            document.getElementById("invoiceModal").classList.remove("flex");
        }

        function printInvoice() {
            const content = document.getElementById("invoiceContent").innerHTML;
            const w = window.open("", "_blank");
            w.document.write(`
            <!DOCTYPE html>
            <html lang="ar" dir="rtl">
            <head>
                <meta charset="UTF-8">
                <title>طباعة الفاتورة</title>
                <style>
                    body { font-family: Cairo, sans-serif; padding: 10px; direction: rtl; }
                    table { width: 100%; border-collapse: collapse; }
                    th, td { border: 1px solid #ccc; padding: 4px; font-size: 11px; }
                    th { background: #1e40af; color: white; }
                </style>
            </head>
            <body>${content}<script>window.onload=function(){window.print();window.close();}<\/script></body>
            </html>`);
            w.document.close();
        }

        async function fetchData() {
            try {
                // 1. جلب طلبات المتجر (التي تحتوي الهاتف والمنطقة/العنوان)
                const { data: webData } = await supabaseClient.from("web_orders").select("*");
                if (webData) {
                    webData.forEach(w => {
                        if (w.id_web_order) {
                            webOrdersMap.set(String(w.id_web_order), w);
                        }
                    });
                }

                // 2. جلب طلبات النظام الداخلي
                const { data: posData } = await supabaseClient.from("orders_o").select("*");
                posOrders = posData || [];

                // 3. جلب تفاصيل الاصناف
                const { data: detailsData } = await supabaseClient.from("orders_details").select("*");
                if (detailsData) {
                    detailsData.forEach(d => {
                        const oid = String(d.id_order);
                        if (!posDetailsMap.has(oid)) posDetailsMap.set(oid, []);
                        posDetailsMap.get(oid).push(d);
                    });
                }

                buildInvoices();
                renderInvoices();
            } catch (err) {
                console.error("خطأ في جلب البيانات:", err);
            }
        }

        function buildInvoices() {
            unifiedInvoices = [];

            posOrders.forEach(o => {
                const officialNo = String(o.id_order);
                const webOrderId = o.id_web_order ? String(o.id_web_order) : null;

                // **الخطوة الأساسية: جلب سجل المتجر المرتبط للحصول على الهاتف والمنطقة**
                let webOrder = webOrderId ? webOrdersMap.get(webOrderId) : null;

                // استخراج الهاتف والمنطقة مباشرة من بيانات سلة المتجر
                let phone = webOrder?.client_phone || webOrder?.phone || o.client_phone || o.phone || "غير مدون";
                let address = webOrder?.client_address || webOrder?.address || webOrder?.city || webOrder?.region || o.client_address || o.address || "غير مدون";
                let clientName = webOrder?.client_name || o.client_name || "عميل نقدي";

                let items = posDetailsMap.get(officialNo) || [];
                let itemsTotal = items.reduce((sum, i) => sum + (Number(i.qte || 1) * Number(i.price || 0)), 0);

                unifiedInvoices.push({
                    officialNo: officialNo,
                    webOrderId: webOrderId,
                    clientName: clientName,
                    phone: phone,
                    address: address,
                    itemsTotal: itemsTotal,
                    date: o.date_order || new Date().toISOString(),
                    items: items
                });
            });
        }

        function renderInvoices() {
            const tbody = document.getElementById("invoicesList");
            tbody.innerHTML = "";

            if (!unifiedInvoices.length) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400">لا توجد فواتير</td></tr>`;
                return;
            }

            unifiedInvoices.forEach(inv => {
                tbody.innerHTML += `
                <tr class="border-b hover:bg-blue-50 cursor-pointer text-xs" onclick="openInvoice('${inv.officialNo}')">
                    <td class="p-3 text-center font-bold text-blue-700">#${inv.officialNo}</td>
                    <td class="p-3 font-semibold">${inv.clientName}</td>
                    <td class="p-3 text-gray-600">${inv.phone}</td>
                    <td class="p-3 text-center font-bold text-green-700">${money(inv.itemsTotal)} ج.م</td>
                </tr>`;
            });
        }

        function openInvoice(officialNo) {
            const inv = unifiedInvoices.find(i => i.officialNo === officialNo);
            if (!inv) return;

            let rows = "";
            inv.items.forEach(item => {
                const qty = Number(item.qte || 1);
                const price = Number(item.price || 0);
                rows += `
                <tr>
                    <td style="text-align:right;">${item.product_name || 'صنف'}</td>
                    <td style="text-align:center;">${qty}</td>
                    <td style="text-align:center;">${money(price)}</td>
                    <td style="text-align:center; font-weight:bold;">${money(qty * price)}</td>
                </tr>`;
            });

            // عرض تفاصيل الفاتورة مع إبراز الهاتف والمنطقة المجلوبة من سلة المتجر
            document.getElementById("invoiceContent").innerHTML = `
            <div style="width:100%; max-width:80mm; background:#fff; border:1px solid #1e40af; border-radius:8px; padding:10px; font-size:11px;">
                <div style="text-align:center; font-weight:bold; font-size:14px; color:#1e40af; border-b:1px solid #ccc; padding-bottom:5px; margin-bottom:8px;">
                    فاتورة مبيعات #${inv.officialNo}
                </div>
                
                <div style="background:#f1f5f9; padding:6px; border-radius:5px; margin-bottom:8px; font-size:10.5px; line-height:1.6;">
                    <div>👤 <b>العميل:</b> ${inv.clientName}</div>
                    <div>📞 <b>رقم الهاتف:</b> ${inv.phone}</div>
                    <div>📍 <b>العنوان / المنطقة:</b> ${inv.address}</div>
                </div>

                <table class="invoice-table" style="margin-bottom:8px;">
                    <thead>
                        <tr>
                            <th style="text-align:right;">الصنف</th>
                            <th>الكمية</th>
                            <th>السعر</th>
                            <th>الإجمالي</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>

                <div style="text-align:left; font-weight:bold; font-size:12px; border-top:1px solid #ccc; padding-top:5px; color:#1e40af;">
                    الإجمالي: ${money(inv.itemsTotal)} ج.م
                </div>
            </div>`;

            // المعاينة الجانبية
            document.getElementById("invoiceDetails").innerHTML = `
                <div class="text-right space-y-2 text-sm">
                    <p class="text-lg font-bold text-blue-800">فاتورة رقم: #${inv.officialNo}</p>
                    <hr>
                    <p><b>اسم العميل:</b> ${inv.clientName}</p>
                    <p class="text-green-700 font-bold"><b>رقم الهاتف (من المتجر):</b> ${inv.phone}</p>
                    <p class="text-blue-700 font-bold"><b>العنوان / المنطقة (من المتجر):</b> ${inv.address}</p>
                    <hr>
                    <p class="text-xl font-bold">الإجمالي: ${money(inv.itemsTotal)} ج.م</p>
                </div>`;

            document.getElementById("invoiceModal").classList.remove("hidden");
            document.getElementById("invoiceModal").classList.add("flex");
        }

        fetchData();
    </script>
</body>
</html>
