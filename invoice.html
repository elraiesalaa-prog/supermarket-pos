<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة حرارية - بوليصة شحن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }
        @media print {
            .no-print { display: none !important; }
            body { background: white; pading: 0; margin: 0; }
            #thermalReceipt { border: none !important; box-shadow: none !important; width: 80mm !important; margin: 0 auto; }
        }
    </style>
</head>
<body class="flex flex-col items-center p-4">

    <!-- أزرار التحكم العلوية (تختفي أثناء الطباعة) -->
    <div class="no-print flex flex-wrap gap-2 justify-center mb-6 bg-white p-4 rounded-xl shadow-md w-full max-w-md">
        <button onclick="window.print()" class="bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded-xl font-bold text-xs transition">
            🖨 طباعة الفاتورة
        </button>
        <button onclick="shareWhatsApp()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-bold text-xs transition">
            📱 واتساب العميل
        </button>
        <button onclick="copyInvoiceText()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-xl font-bold text-xs transition">
            📋 نسخ النص
        </button>
        <button onclick="window.close()" class="bg-gray-200 hover:bg-gray-300 text-slate-800 px-4 py-2 rounded-xl font-bold text-xs transition">
            إغلاق النافذة
        </button>
    </div>

    <!-- مكان عرض الفاتورة الحرارية -->
    <div id="invoiceContainer" class="w-full flex justify-center">
        <p class="text-gray-500 animate-pulse">جاري تحميل بيانات الفاتورة الرقمية...</p>
    </div>

    <script>
        // ربط قاعدة البيانات
        const { createClient } = window.supabase;
        const supabaseClient = createClient(
            "https://vmxbedovoahuggfpcmyk.supabase.co",
            "sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"
        );

        // التقاط رقم الطلب من الرابط الموجه من الصفحة الرئيسية
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        
        let invoiceData = null;
        const money = v => Number(v || 0).toFixed(2);

        async function loadInvoice() {
            if (!orderId) {
                document.getElementById("invoiceContainer").innerHTML = "<p class='text-red-500 font-bold'>خطأ: لم يتم تحديد رقم الفاتورة!</p>";
                return;
            }

            try {
                // 1. جلب بيانات الطلب الرئيسي
                const { data: order, error: oErr } = await supabaseClient.from("orders_o").select("*").eq("id_order", orderId).single();
                if (oErr || !order) throw new Error("الطلب غير موجود");

                // 2. جلب بيانات العميل والمنتجات وتفاصيل الطلب بالتوازي لسرعة الأداء
                const [custRes, detailsRes, productsRes] = await Promise.all([
                    supabaseClient.from("customers").select("*").eq("id_customer", order.customer_id).single(),
                    supabaseClient.from("orders_details").select("*").eq("id_order", orderId),
                    supabaseClient.from("products").select("*")
                ]);

                const cust = custRes.data;
                const items = detailsRes.data || [];
                const products = productsRes.data || [];
                const productMap = new Map(products.map(p => [p.id_product, p]));

                let itemsSubtotal = 0;
                let rowsHtml = "";
                let itemsTextForShare = "";

                items.forEach((item) => {
                    const product = productMap.get(item.id_product);
                    const qty = item.qte ?? item.quantity ?? item.qty ?? 0;
                    const price = Number(item.price || 0);
                    const lineTotal = Number(item.total_amount || (qty * price));

                    itemsSubtotal += lineTotal;
                    const prodName = product?.product_name || "منتج غير مدرج";

                    rowsHtml += `
                    <tr>
                        <td style="padding:6px; border-bottom:1px solid #edf2f7; text-align:right;">${prodName}</td>
                        <td style="text-align:center; border-bottom:1px solid #edf2f7;">${qty}</td>
                        <td style="text-align:center; border-bottom:1px solid #edf2f7;">${money(price)}</td>
                        <td style="text-align:center; font-weight:bold; color:#1e40af; border-bottom:1px solid #edf2f7;">${money(lineTotal)}</td>
                    </tr>`;

                    itemsTextForShare += `- ${prodName} (الكمية: ${qty} | السعر: ${money(price)} ج.م)\n`;
                });

                const clientName = order.client_name || cust?.first_name || "بدون اسم";
                const clientPhone = order.client_phone || order.phone || cust?.phone || "غير مسجل";
                const region = order.client_region || order.region || order.shipping_region || "غير محددة";
                const fullAddress = order.client_address || order.address || "العنوان بالتفصيل غير متوفر";
                const shippingCost = Number(order.shipping_cost || order.delivery_fee || order.delivery_cost || 0);
                const finalTotal = itemsSubtotal + shippingCost;
                const dateStr = new Date(order.created_at || Date.now()).toLocaleDateString("ar-EG");

                // حفظ البيانات محلياً لاستخدامها في الواتساب والنسخ
                invoiceData = { id: orderId, name: clientName, phone: clientPhone, region: region, address: fullAddress, subtotal: itemsSubtotal, shipping: shippingCost, total: finalTotal, itemsText: itemsTextForShare, date: dateStr };

                // حقن تصميم الفاتورة الحرارية المتطابق تماماً
                document.getElementById("invoiceContainer").innerHTML = `
                <div id="thermalReceipt" style="width:80mm; background:#fff; border:1px solid #cbd5e1; border-radius:12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); overflow:hidden; font-size:11px; color:#1e293b; padding:6px;">
                    <div style="background:#1e3a8a; color:#fff; padding:12px; text-align:center;">
                        <div style="font-size:16px; font-weight:bold;">مؤسسة علاء الدين للماركتنج</div>
                        <div style="font-size:11px; opacity:0.9; margin-top:2px;">إيصال تسليم شحنة مبيعات</div>
                    </div>

                    <div style="padding:8px; background:#f8fafc; border-bottom:1px dashed #cbd5e1; line-height:1.6;">
                        <div><b>رقم الطلب:</b> #${orderId} | <b>التاريخ:</b> ${dateStr}</div>
                        <div style="margin-top:4px; border-top:1px solid #e2e8f0; padding-top:4px;">👤 <b>المستلم:</b> ${clientName}</div>
                        <div>📞 <b>الهاتف:</b> <span dir="ltr">${clientPhone}</span></div>
                        <div>📍 <b>المنطقة:</b> ${region}</div>
                        <div>🏠 <b>العنوان:</b> ${fullAddress}</div>
                    </div>

                    <table style="width:100%; border-collapse:collapse; font-size:10px; margin-top:5px;">
                        <thead>
                            <tr style="background:#f1f5f9; color:#334155;">
                                <th style="padding:4px; text-align:right; border-bottom:1px solid #cbd5e1;">الصنف</th>
                                <th style="padding:4px; border-bottom:1px solid #cbd5e1;">كمية</th>
                                <th style="padding:4px; border-bottom:1px solid #cbd5e1;">سعر</th>
                                <th style="padding:4px; border-bottom:1px solid #cbd5e1;">الجملة</th>
                            </tr>
                        </thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>

                    <div style="padding:8px; background:#f8fafc; border-top:1px solid #e2e8f0; font-size:11px; line-height:1.7; margin-top:5px;">
                        <div style="display:flex; justify-content:space-between; color:#475569;">
                            <span>إجمالي المنتجات:</span>
                            <span>${money(itemsSubtotal)} ج.م</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; color:#b45309; font-weight:600;">
                            <span>تكلفة التوصيل للمنطقة:</span>
                            <span>+ ${money(shippingCost)} ج.م</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; background:#10b981; color:#fff; padding:6px; border-radius:6px; font-size:13px; font-weight:bold; margin-top:5px;">
                            <span>إجمالي الحساب النهائي</span>
                            <span>${money(finalTotal)} ج.م</span>
                        </div>
                    </div>

                    <div style="padding:8px; text-align:center; font-size:10px; color:#64748b; border-top:1px dashed #e2e8f0; margin-top:5px;">
                        يرجى مراجعة الشحنة قبل مغادرة المندوب 🌹
                    </div>
                </div>`;
            } catch (err) {
                document.getElementById("invoiceContainer").innerHTML = `<p class='text-red-500 font-bold'>حدث خطأ أثناء جلب البيانات: ${err.message}</p>`;
            }
        }

        function generateText() {
            if (!invoiceData) return "";
            return `📦 *بيانات شحنة وفاتورة من مؤسسة علاء الدين* 📦\n` +
                   `🔢 *رقم الطلب:* #${invoiceData.id}\n👤 *الاسم:* ${invoiceData.name}\n📞 *الهاتف:* ${invoiceData.phone}\n📍 *المنطقة:* ${invoiceData.region}\n🏠 *العنوان:* ${invoiceData.address}\n` +
                   `🛍️ *الأصناف:*\n${invoiceData.itemsText}💰 *الحساب النهائي النهائي:* ${money(invoiceData.total)} ج.م\n🌹 يرجى مراجعة الشحنة مع المندوب.`;
        }

        function shareWhatsApp() {
            if (!invoiceData) return;
            let p = invoiceData.phone.replace(/\D/g, '');
            if (p.startsWith('01')) p = '20' + p.substring(1);
            window.open(`https://api.whatsapp.com/send?phone=${p}&text=${encodeURIComponent(generateText())}`, '_blank');
        }

        function copyInvoiceText() {
            if (!invoiceData) return;
            navigator.clipboard.writeText(generateText()).then(() => alert("📋 تم نسخ النص بنجاح!"));
        }

        loadInvoice();
    </script>
</body>
</html>
