<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة الفواتير الاحترافية</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Cairo,Tahoma,sans-serif;
}

body{
background:#eef2f7;
}

::-webkit-scrollbar{
width:8px;
height:8px;
}

::-webkit-scrollbar-thumb{
background:#2563eb;
border-radius:20px;
}

.card{
background:#fff;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.tableHover tbody tr:hover{
background:#eff6ff;
cursor:pointer;
transition:.25s;
}

.statCard{
background:white;
border-radius:18px;
padding:20px;
box-shadow:0 10px 20px rgba(0,0,0,.08);
}

.statTitle{
font-size:14px;
color:#666;
margin-bottom:8px;
}

.statValue{
font-size:32px;
font-weight:bold;
}

input,select{
outline:none;
}

button{
transition:.25s;
}

button:hover{
transform:translateY(-2px);
}

</style>

</head>

<body>

<header class="bg-blue-900 text-white shadow-xl">

<div class="max-w-7xl mx-auto p-5 flex justify-between items-center">

<div>

<h1 class="text-3xl font-bold">

📄 إدارة الفواتير

</h1>

<div class="text-sm text-blue-200">

عرض جميع الفواتير ومتابعة تفاصيلها

</div>

</div>

<div class="flex gap-3">

<button
onclick="loadInvoices()"
class="bg-green-600 hover:bg-green-700 px-5 py-2 rounded-lg">

تحديث

</button>

<a
href="index.html"
class="bg-white text-blue-900 px-5 py-2 rounded-lg font-bold">

رجوع

</a>

</div>

</div>

</header>

<div class="max-w-7xl mx-auto p-5">

<div class="grid lg:grid-cols-4 md:grid-cols-2 gap-4 mb-6">

<div class="statCard">

<div class="statTitle">

إجمالي المبيعات

</div>

<div
id="totalSales"
class="statValue text-green-600">

0

</div>

</div>

<div class="statCard">

<div class="statTitle">

عدد الفواتير

</div>

<div
id="invoiceCount"
class="statValue text-blue-700">

0

</div>

</div>

<div class="statCard">

<div class="statTitle">

عدد العملاء

</div>

<div
id="customersCount"
class="statValue text-orange-600">

0

</div>

</div>

<div class="statCard">

<div class="statTitle">

عدد المنتجات

</div>

<div
id="productsCount"
class="statValue text-purple-700">

0

</div>

</div>

</div>

<div class="card p-5 mb-6">

<div class="grid md:grid-cols-4 gap-3">

<input
id="search"
type="text"
placeholder="بحث برقم الفاتورة أو اسم العميل"
class="border rounded-xl p-3">

<select
id="payFilter"
class="border rounded-xl p-3">

<option value="">كل طرق الدفع</option>
<option value="cash">نقد</option>
<option value="bank">تحويل</option>
<option value="later">آجل</option>

</select>

<input
id="dateFrom"
type="date"
class="border rounded-xl p-3">

<input
id="dateTo"
type="date"
class="border rounded-xl p-3">

</div>

</div>
<!-- محتوى الصفحة -->

<div class="grid lg:grid-cols-2 gap-6">

    <!-- قائمة الفواتير -->

    <div class="card overflow-hidden">

        <div class="bg-blue-600 text-white p-4 flex justify-between items-center">

            <span class="font-bold text-lg">
                قائمة الفواتير
            </span>

            <span id="invoiceRows"
                class="bg-white text-blue-700 px-3 py-1 rounded-full text-sm">
                0 فاتورة
            </span>

        </div>

        <div class="overflow-auto max-h-[700px]">

            <table class="w-full text-center tableHover">

                <thead class="bg-slate-100 sticky top-0">

                    <tr>

                        <th class="p-3">رقم</th>

                        <th class="p-3">العميل</th>

                        <th class="p-3">التاريخ</th>

                        <th class="p-3">طريقة الدفع</th>

                        <th class="p-3">الإجمالي</th>

                    </tr>

                </thead>

                <tbody id="invoiceTable">

                    <tr>

                        <td colspan="5"
                            class="p-5 text-gray-400">

                            جاري تحميل البيانات...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

    <!-- تفاصيل الفاتورة -->

    <div class="card overflow-hidden">

        <div class="bg-green-600 text-white p-4 flex justify-between items-center">

            <span class="font-bold text-lg">

                تفاصيل الفاتورة

            </span>

            <div class="flex gap-2">

                <button
                    onclick="printInvoice()"
                    class="bg-white text-green-700 px-3 py-2 rounded-lg">

                    🖨 طباعة

                </button>

                <button
                    onclick="downloadPDF()"
                    class="bg-white text-blue-700 px-3 py-2 rounded-lg">

                    PDF

                </button>

            </div>

        </div>

        <div
            id="invoiceDetails"
            class="p-6 min-h-[650px]">

            <div
                class="flex flex-col items-center justify-center h-full text-gray-400">

                <svg xmlns="http://www.w3.org/2000/svg"
                    width="80"
                    height="80"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    viewBox="0 0 24 24">

                    <path d="M9 12h6"/>
                    <path d="M9 16h6"/>
                    <path d="M8 2h8l5 5v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h3z"/>
                    <path d="M14 2v6h6"/>

                </svg>

                <div class="mt-4 text-xl">

                    اختر فاتورة من القائمة

                </div>

            </div>

        </div>

    </div>

</div>

</div>

<script>

const supabase = window.supabase.createClient(

"https://vmxbedovoahuggfpcmyk.supabase.co",

"sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"

);

let customers = [];
let products = [];
let invoices = [];
let currentInvoiceId = null;

function money(v){

    return Number(v || 0).toLocaleString();

}

function payBadge(pay){

    if(pay==="cash")
        return "<span class='bg-green-100 text-green-700 px-2 py-1 rounded-full'>نقد</span>";

    if(pay==="bank")
        return "<span class='bg-blue-100 text-blue-700 px-2 py-1 rounded-full'>تحويل</span>";

    if(pay==="later")
        return "<span class='bg-orange-100 text-orange-700 px-2 py-1 rounded-full'>آجل</span>";

    return pay || "-";
}

async function loadMasterData(){

    const {data:cust}=await supabase
    .from("customers")
    .select("*");

    customers=cust||[];

    const {data:prod}=await supabase
    .from("products")
    .select("*");

    products=prod||[];

}
  //=========================
// تحميل الإحصائيات
//=========================

async function loadStats(){

    try{

        const {data:sales,error:salesErr}=await supabase
        .from("orders_details")
        .select("total_amount");

        if(salesErr) throw salesErr;

        const totalSales=(sales||[]).reduce(
            (sum,row)=>sum+Number(row.total_amount||0),
            0
        );

        document.getElementById("totalSales").innerText=
        money(totalSales);

        const {count:invoiceCount}=await supabase
        .from("orders_o")
        .select("*",{count:"exact",head:true});

        document.getElementById("invoiceCount").innerText=
        invoiceCount||0;

        const {count:customersCount}=await supabase
        .from("customers")
        .select("*",{count:"exact",head:true});

        document.getElementById("customersCount").innerText=
        customersCount||0;

        const {count:productsCount}=await supabase
        .from("products")
        .select("*",{count:"exact",head:true});

        document.getElementById("productsCount").innerText=
        productsCount||0;

    }catch(err){

        console.error(err);

    }

}



//=========================
// تحميل الفواتير
//=========================

async function loadInvoices(){

    try{

        const payMethod=
        document.getElementById("payFilter").value;

        let query=supabase
        .from("orders_o")
        .select("*")
        .order("id_order",{ascending:false});

        if(payMethod){

            query=query.eq("pay_method",payMethod);

        }

        const {data,error}=await query;

        if(error) throw error;

        invoices=data||[];

        document.getElementById("invoiceRows").innerHTML=
        invoices.length+" فاتورة";

        let html="";

        for(const inv of invoices){

            const customer=customers.find(c=>

                Number(c.id_customer)===Number(inv.customer_id)

            );

            const {data:details}=await supabase
            .from("orders_details")
            .select("total_amount")
            .eq("id_order",inv.id_order);

            const total=(details||[]).reduce(

                (sum,row)=>sum+Number(row.total_amount||0),

                0

            );

            html+=`

            <tr
            onclick="openInvoice(${inv.id_order})"
            class="border-b hover:bg-blue-50">

                <td class="p-3 font-bold text-blue-700">

                    ${inv.id_order}

                </td>

                <td class="p-3">

                    ${customer?.first_name||"-"}

                </td>

                <td class="p-3">

                    ${new Date(inv.date_order).toLocaleDateString()}

                </td>

                <td class="p-3">

                    ${payBadge(inv.pay_method)}

                </td>

                <td class="p-3 font-bold text-green-600">

                    ${money(total)}

                </td>

            </tr>

            `;

        }

        if(html===""){

            html=`

            <tr>

            <td colspan="5"
            class="p-5 text-gray-400">

            لا توجد بيانات

            </td>

            </tr>

            `;

        }

        document.getElementById("invoiceTable").innerHTML=html;

    }

    catch(err){

        console.error(err);

        alert(err.message);

    }

}



//=========================
// البحث
//=========================

document
.getElementById("search")
.addEventListener("keyup",function(){

    const value=this.value.toLowerCase();

    document
    .querySelectorAll("#invoiceTable tr")
    .forEach(row=>{

        row.style.display=

        row.innerText.toLowerCase()

        .includes(value)

        ? ""

        : "none";

    });

});



//=========================
// تحديث الفلاتر
//=========================

document
.getElementById("payFilter")
.addEventListener("change",loadInvoices);
  //======================================
// عرض تفاصيل الفاتورة
//======================================

async function openInvoice(id_order){

    currentInvoiceId=id_order;

    try{

        const {data:order,error:orderError}=await supabase
        .from("orders_o")
        .select("*")
        .eq("id_order",id_order)
        .single();

        if(orderError) throw orderError;

        const customer=customers.find(c=>
            Number(c.id_customer)===Number(order.customer_id)
        );

        const {data:details,error:detailsError}=await supabase
        .from("orders_details")
        .select("*")
        .eq("id_order",id_order);

        if(detailsError) throw detailsError;

        let total=0;
        let rows="";

        details.forEach((item,index)=>{

            const product=products.find(p=>
                Number(p.id_product)===Number(item.id_product)
            );

            total+=Number(item.total_amount||0);

            rows+=`

            <tr class="border-b">

                <td class="p-2">${index+1}</td>

                <td class="p-2">
                    ${product?.product_name||"-"}
                </td>

                <td class="p-2">
                    ${money(item.price)}
                </td>

                <td class="p-2">
                    ${item.qte}
                </td>

                <td class="p-2 text-green-700 font-bold">
                    ${money(item.total_amount)}
                </td>

            </tr>

            `;

        });

        document.getElementById("invoiceDetails").innerHTML=`

        <div id="printArea">

            <div class="mb-5 border-b pb-3">

                <h2 class="text-3xl font-bold text-blue-700">

                    فاتورة رقم ${order.id_order}

                </h2>

                <div class="text-gray-600 mt-2">

                    التاريخ :
                    ${new Date(order.date_order).toLocaleString()}

                </div>

                <div class="mt-2">

                    طريقة الدفع :
                    ${payBadge(order.pay_method)}

                </div>

            </div>

            <div class="grid grid-cols-2 gap-4 mb-5">

                <div>

                    <div class="font-bold">

                        العميل

                    </div>

                    <div>

                        ${customer?.first_name||"-"}

                    </div>

                    <div>

                        ${customer?.tel||"-"}

                    </div>

                    <div>

                        ${customer?.whatsapp||"-"}

                    </div>

                </div>

                <div class="text-left">

                    <div class="font-bold">

                        الرصيد

                    </div>

                    <div class="text-blue-700 text-2xl">

                        ${money(customer?.balance)}

                    </div>

                </div>

            </div>

            <table class="w-full text-center border">

                <thead class="bg-slate-100">

                    <tr>

                        <th class="p-2">#</th>
                        <th class="p-2">المنتج</th>
                        <th class="p-2">السعر</th>
                        <th class="p-2">الكمية</th>
                        <th class="p-2">الإجمالي</th>

                    </tr>

                </thead>

                <tbody>

                    ${rows}

                </tbody>

            </table>

            <div class="mt-6 p-5 bg-green-50 rounded-xl">

                <div class="text-lg">

                    إجمالي الفاتورة

                </div>

                <div class="text-3xl font-bold text-green-700">

                    ${money(total)}

                </div>

            </div>

        </div>

        `;

    }

    catch(err){

        console.error(err);

        alert(err.message);

    }

}



//======================================
// الطباعة
//======================================

function printInvoice(){

    const area=document.getElementById("printArea");

    if(!area) return;

    const win=window.open("");

    win.document.write(`
    <html dir="rtl">
    <head>
    <title>فاتورة</title>
    </head>
    <body>
    ${area.innerHTML}
    </body>
    </html>`);

    win.document.close();

    win.print();

}



//======================================
// PDF
//======================================

function downloadPDF(){

    const area=document.getElementById("printArea");

    if(!area) return;

    html2pdf()
    .set({

        margin:5,

        filename:"Invoice_"+currentInvoiceId+".pdf",

        image:{type:"jpeg",quality:1},

        html2canvas:{scale:2},

        jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}

    })
    .from(area)
    .save();

}



//======================================
// تشغيل الصفحة
//======================================

async function init(){

    await loadMasterData();

    await loadStats();

    await loadInvoices();

}

init();

</script>

</body>

</html>
