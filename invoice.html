<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام الفواتير الاحترافي FIXED</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{background:#eef2f7;font-family:Cairo}
.card{background:#fff;padding:15px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,.1)}
table{width:100%}
th,td{padding:8px;text-align:center}
tr:hover{background:#f1f5f9}
  #invoiceContent table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

#invoiceContent th{
background:#1e40af;
color:white;
padding:10px;
border:1px solid #d1d5db;
}

#invoiceContent td{
padding:9px;
border:1px solid #d1d5db;
}

#invoiceContent tr:nth-child(even){
background:#f8fafc;
}

#invoiceContent h2{
letter-spacing:1px;
}

@media print{

button{
display:none!important;
}

body{
background:white;
}

}
  tbody tr{

cursor:pointer;
transition:.25s;

}

tbody tr:hover{

transform:scale(1.01);

background:#dbeafe;

}
</style>

</head>

<body>
<body class="bg-slate-100">

<header class="bg-gradient-to-l from-blue-900 to-blue-700 text-white shadow-lg">

<div class="max-w-7xl mx-auto flex items-center justify-between p-4">

<h1 class="text-2xl font-bold">
📦 نظام الفواتير الاحترافي
</h1>

<div class="text-sm opacity-80">
Professional Invoice System
</div>

</div>

</header>

<div class="max-w-7xl mx-auto p-5">

<!-- الإحصائيات -->

<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">

<div class="bg-white rounded-xl shadow p-5 text-center">

<div class="text-gray-500 mb-2">
إجمالي المبيعات
</div>

<div id="sales"
class="text-2xl font-bold text-green-600">
0
</div>

</div>

<div class="bg-white rounded-xl shadow p-5 text-center">

<div class="text-gray-500 mb-2">
عدد الفواتير
</div>

<div id="invCount"
class="text-2xl font-bold text-blue-700">
0
</div>

</div>

<div class="bg-white rounded-xl shadow p-5 text-center">

<div class="text-gray-500 mb-2">
العملاء
</div>

<div id="cusCount"
class="text-2xl font-bold text-orange-600">
0
</div>

</div>

<div class="bg-white rounded-xl shadow p-5 text-center">

<div class="text-gray-500 mb-2">
المنتجات
</div>

<div id="proCount"
class="text-2xl font-bold text-purple-700">
0
</div>

</div>

</div>

<div class="grid lg:grid-cols-2 gap-5">

<!-- قائمة الفواتير -->

<div class="bg-white rounded-xl shadow overflow-hidden">

<div class="bg-blue-700 text-white p-4 font-bold">

📋 قائمة الفواتير

</div>

<div class="overflow-auto">

<table class="min-w-full">

<thead>

<tr class="bg-slate-100">

<th class="p-3">رقم</th>

<th class="p-3">العميل</th>

<th class="p-3">الإجمالي</th>

</tr>

</thead>

<tbody id="invoices">

<tr>

<td colspan="3" class="p-6 text-gray-500">

جاري تحميل البيانات...

</td>

</tr>

</tbody>

</table>

</div>

</div>

<!-- تفاصيل -->

<div class="bg-white rounded-xl shadow">

<div class="bg-green-700 text-white p-4 font-bold">

🧾 تفاصيل الفاتورة

</div>

<div id="details" class="p-6 text-gray-500">

اختر فاتورة لعرض تفاصيلها

</div>

</div>

</div>

</div>

<!-- نافذة الفاتورة -->

<div id="invoiceModal"
class="fixed inset-0 hidden items-center justify-center bg-black/60 z-50">

<div class="bg-white rounded-2xl shadow-2xl w-[96%] max-w-4xl overflow-hidden">

<div class="bg-gradient-to-l from-blue-900 to-blue-700 text-white p-4 flex justify-between items-center">

<h2 class="font-bold text-xl">

فاتورة البيع

</h2>

<button
onclick="closeInvoice()"
class="bg-red-500 hover:bg-red-600 rounded px-3 py-1">

✕

</button>

</div>

<div id="invoiceContent"

class="bg-white max-h-[80vh] overflow-auto p-6">

</div>

<div class="bg-slate-100 p-4 flex justify-end gap-3">

<button
onclick="printInvoice()"
class="bg-blue-700 hover:bg-blue-800 text-white px-5 py-2 rounded">

🖨 طباعة

</button>

<button
onclick="closeInvoice()"
class="bg-gray-600 hover:bg-gray-700 text-white px-5 py-2 rounded">

إغلاق

</button>

</div>

</div>

</div>
<script>

// ================= FIX SUPABASE =================
const { createClient } = window.supabase;

const supabaseClient = createClient(
"https://vmxbedovoahuggfpcmyk.supabase.co",
"sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"
);
const sellerName = localStorage.getItem("user") || "غير معروف";
// ================= DATA =================
let customers = [];
let products = [];
let orders = [];
let details = [];

let customerMap = new Map();
let productMap = new Map();
let detailsMap = new Map();

const money = v => Number(v||0).toLocaleString();
let sellerName = "المستخدم الحالي";

async function loadCurrentUser(){

try{

const {data} = await supabaseClient.auth.getUser();

if(data.user){

sellerName =
data.user.user_metadata?.full_name ||
data.user.user_metadata?.name ||
data.user.email ||
"المستخدم الحالي";

}

}catch(e){

console.log(e);

}

}

function closeInvoice(){

document
.getElementById("invoiceModal")
.classList.add("hidden");

document
.getElementById("invoiceModal")
.classList.remove("flex");

}

function printInvoice(){

const content =
document.getElementById("invoiceContent").innerHTML;

const w = window.open("", "_blank");

w.document.write(`

<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>فاتورة</title>

<style>

body{

font-family:Cairo,Arial;

padding:25px;

direction:rtl;

}

table{

width:100%;

border-collapse:collapse;

margin-top:15px;

}

th{

background:#1e40af;

color:#fff;

padding:10px;

border:1px solid #ccc;

}

td{

padding:8px;

border:1px solid #ccc;

text-align:center;

}

@media print{

body{

margin:0;

}

}

</style>

</head>

<body>

${content}

<script>

window.onload=function(){

window.print();

window.close();

}

<\/script>

</body>

</html>

`);

w.document.close();

}
// ================= LOAD MASTER =================
async function loadMaster(){

try{

const [customersRes,productsRes] = await Promise.all([

supabaseClient
.from("customers")
.select("*"),

supabaseClient
.from("products")
.select("*")

]);

if(customersRes.error) throw customersRes.error;
if(productsRes.error) throw productsRes.error;

customers = customersRes.data || [];
products = productsRes.data || [];

customerMap.clear();
productMap.clear();

customers.forEach(c=>{
customerMap.set(c.id_customer,c);
});

products.forEach(p=>{
productMap.set(p.id_product,p);
});

console.log("Customers :",customers.length);
console.log("Products :",products.length);

}catch(err){

console.error("LOAD MASTER ERROR :",err);

alert("خطأ في تحميل العملاء أو المنتجات");

}

}
// ================= LOAD DETAILS =================
async function loadDetails(){

try{

const {data,error} = await supabaseClient

.from("orders_details")

.select("*");

if(error) throw error;

details = data || [];

detailsMap.clear();

details.forEach(item=>{

if(!detailsMap.has(item.id_order)){

detailsMap.set(item.id_order,[]);

}

detailsMap.get(item.id_order).push(item);

});

console.log("Details :",details.length);

}catch(err){

console.error("DETAIL ERROR :",err);

alert("تعذر تحميل تفاصيل الفواتير");

}

}
// ================= LOAD ORDERS =================
async function loadOrders(){

try{

const {data,error} = await supabaseClient

.from("orders_o")

.select("*")

.order("id_order",{ascending:false});

if(error) throw error;

orders = data || [];

console.log("Orders :",orders.length);

renderOrders();

}catch(err){

console.error("ORDER ERROR :",err);

alert("تعذر تحميل الفواتير");

}

}

// ================= RENDER =================
function renderOrders(){

const tbody = document.getElementById("invoices");

tbody.innerHTML="";

if(!orders.length){

tbody.innerHTML=`
<tr>

<td colspan="3">

لا توجد فواتير

</td>

</tr>
`;

return;

}

orders.forEach(order=>{

const customer=

customerMap.get(order.customer_id);

const items=

detailsMap.get(order.id_order)||[];

const total=

items.reduce((sum,item)=>{

return sum+Number(item.total_amount||0);

},0);

tbody.innerHTML+=`

<tr class="cursor-pointer hover:bg-blue-50 transition"

onclick="openOrder(${order.id_order})">

<td>

${order.id_order}

</td>

<td>

${customer?.first_name||"بدون اسم"}

</td>

<td class="font-bold text-green-600">

${money(total)}

</td>

</tr>

`;

});

}

// ================= OPEN ORDER =================
function openOrder(id){

    const order = orders.find(o => o.id_order == id);

    if(!order){
        alert("الفاتورة غير موجودة");
        return;
    }

    const cust = customerMap.get(order.customer_id);
    const items = detailsMap.get(id) || [];

    let total = 0;
    let rows = "";

    items.forEach((item,index)=>{

        const product = productMap.get(item.id_product);

        const qty =
            item.qte ??
            item.quantity ??
            item.qty ??
            0;

        const price =
            Number(item.price || 0);

        const lineTotal =
            Number(item.total_amount || 0);

        total += lineTotal;

       rows += `
<tr>

<td style="
padding:7px;
border-bottom:1px solid #eee;
text-align:right;
">
${product?.product_name || "-"}
</td>

<td style="
text-align:center;
border-bottom:1px solid #eee;
">
${qty}
</td>

<td style="
text-align:center;
border-bottom:1px solid #eee;
">
${money(price)}
</td>

<td style="
text-align:center;
font-weight:bold;
color:#2563eb;
border-bottom:1px solid #eee;
">
${money(lineTotal)}
</td>

</tr>
`;


    });

    const invoiceDate =
        order.created_at ||
        order.date_order ||
        order.order_date ||
        new Date().toISOString();

    const invoiceObj = new Date(invoiceDate);

    const date =
        invoiceObj.toLocaleDateString("ar-EG");

    const time =
        invoiceObj.toLocaleTimeString("ar-EG");

   document.getElementById("invoiceContent").innerHTML = `

<div style="
display:flex;
justify-content:center;
padding:15px;
background:#eef2f7;
">

<div style="
width:80mm;
background:#fff;
border:2px solid #2563eb;
border-radius:12px;
overflow:hidden;
box-shadow:0 8px 20px rgba(0,0,0,.18);
font-family:Cairo,Arial,sans-serif;
font-size:12px;
color:#222;
">

<!-- الرأس -->

<div style="
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
padding:12px;
text-align:center;
">

<div style="
font-size:22px;
font-weight:bold;
">

مؤسسة علاء الدين

</div>

<div style="
font-size:14px;
margin-top:3px;
">

فاتورة بيع

</div>

<div style="
font-size:11px;
opacity:.9;
">

POS SYSTEM

</div>

</div>

<!-- معلومات الفاتورة -->

<div style="
padding:10px;
background:#f8fafc;
border-bottom:1px solid #ddd;
line-height:1.9;
">

<div style="display:flex;justify-content:space-between;">
<span><b>رقم:</b> ${id}</span>
<span>${date}</span>
</div>

<div style="margin-top:4px;">
👤 <b>العميل :</b> ${cust?.first_name || "-"}
</div>

<div>
🛒 <b>البائع :</b> ${sellerName}
</div>

<div>
🕒 ${time}
</div>

</div>

<!-- جدول المنتجات -->

<table style="
width:100%;
border-collapse:collapse;
font-size:11px;
">

<thead>

<tr style="
background:#2563eb;
color:#fff;
">

<th style="padding:6px;">الصنف</th>
<th style="padding:6px;">الكمية</th>
<th style="padding:6px;">السعر</th>
<th style="padding:6px;">الجملة</th>

</tr>

</thead>

<tbody>

${rows}

</tbody>

</table>

<!-- الإجمالي -->

<div style="
padding:10px;
background:#f8fafc;
border-top:1px solid #ddd;
">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
background:#2563eb;
color:#fff;
padding:10px;
border-radius:8px;
font-size:16px;
font-weight:bold;
">

<span>الإجمالي</span>

<span>${money(total)}</span>

</div>

</div>

<!-- التذييل -->

<div style="
padding:12px;
text-align:center;
font-size:11px;
color:#666;
border-top:1px dashed #ccc;
">

شكراً لتعاملكم معنا 🌹

<br>

نتمنى لكم يوماً سعيداً

</div>

</div>

</div>

`;
const modal = document.getElementById("invoiceModal");

modal.classList.remove("hidden");
modal.classList.add("flex");

}
// ================= STATS =================
async function loadStats(){

try{

const [{data:ordersData,error:e1},

{data:detailsData,error:e2}] = await Promise.all([

supabaseClient

.from("orders_o")

.select("*"),

supabaseClient

.from("orders_details")

.select("total_amount")

]);

if(e1) throw e1;
if(e2) throw e2;

const total=(detailsData||[])

.reduce((s,x)=>

s+Number(x.total_amount||0)

,0);

document.getElementById("sales").innerText=

money(total);

document.getElementById("invCount").innerText=

ordersData.length;

document.getElementById("cusCount").innerText=

customers.length;

document.getElementById("proCount").innerText=

products.length;

}catch(err){

console.error(err);

}
}
// ================= INIT =================
async function init(){

console.log("loading...");

await loadCurrentUser();

await loadMaster();

await loadDetails();

await loadOrders();

await loadStats();

console.log("done");

}
  init();
</script>

</body>
</html>
