<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام الفواتير الاحترافي FIXED</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{background:#eef2f7;font-family:Cairo}
.card{background:#fff;padding:15px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,.1)}
table{width:100%}
th,td{padding:8px;text-align:center}
tr:hover{background:#f1f5f9}
  #invoiceContent table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

#invoiceContent th{
background:#1e40af;
color:white;
padding:10px;
border:1px solid #d1d5db;
}

#invoiceContent td{
padding:9px;
border:1px solid #d1d5db;
}

#invoiceContent tr:nth-child(even){
background:#f8fafc;
}

#invoiceContent h2{
letter-spacing:1px;
}

@media print{

button{
display:none!important;
}

body{
background:white;
}

}
  tbody tr{

cursor:pointer;
transition:.25s;

}

tbody tr:hover{

transform:scale(1.01);

background:#dbeafe;

}
</style>

</head>

<body>

<header class="bg-blue-900 text-white p-4 text-center text-xl font-bold">
📦 نظام الفواتير الاحترافي (FIXED VERSION)
</header>

<div class="max-w-6xl mx-auto p-4">

<div class="grid grid-cols-4 gap-3 mb-4 text-center">

<div class="card">
<div>المبيعات</div>
<div id="sales">0</div>
</div>

<div class="card">
<div>الفواتير</div>
<div id="invCount">0</div>
</div>

<div class="card">
<div>العملاء</div>
<div id="cusCount">0</div>
</div>

<div class="card">
<div>المنتجات</div>
<div id="proCount">0</div>
</div>

</div>

<div class="grid md:grid-cols-2 gap-4">

<!-- invoices -->
<div class="card">
<h3 class="font-bold mb-2">الفواتير</h3>

<table>
<thead>
<tr class="bg-gray-100">
<th>رقم</th>
<th>عميل</th>
<th>الإجمالي</th>
</tr>
</thead>

<tbody id="invoices"></tbody>

</table>
</div>

<!-- details -->
<div class="card">
<h3 class="font-bold mb-2">التفاصيل</h3>
<div id="details">اختر فاتورة</div>
</div>

</div>
</div>
<!-- نافذة الفاتورة -->
<div id="invoiceModal"
class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">

<div class="bg-white w-[95%] md:w-[700px] rounded-xl shadow-2xl overflow-hidden">

<div class="bg-blue-800 text-white p-4 flex justify-between items-center">
<h2 class="text-xl font-bold">فاتورة البيع</h2>

<button
onclick="closeInvoice()"
class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded">
✕
</button>

</div>

<div id="invoiceContent"
class="p-6 max-h-[75vh] overflow-y-auto">
</div>

<div class="bg-gray-100 p-4 flex justify-end gap-2">

<button
onclick="printInvoice()"
class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded">
🖨 طباعة
</button>

<button
onclick="closeInvoice()"
class="bg-gray-500 hover:bg-gray-600 text-white px-5 py-2 rounded">
إغلاق
</button>

</div>

</div>

</div>
<script>

// ================= FIX SUPABASE =================
const { createClient } = window.supabase;

const supabaseClient = createClient(
"https://vmxbedovoahuggfpcmyk.supabase.co",
"sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"
);

// ================= DATA =================
let customers = [];
let products = [];
let orders = [];
let details = [];

let customerMap = new Map();
let productMap = new Map();
let detailsMap = new Map();

const money = v => Number(v||0).toLocaleString();
let sellerName = "المستخدم الحالي";

async function loadCurrentUser(){

try{

const {data} = await supabaseClient.auth.getUser();

if(data.user){

sellerName =
data.user.user_metadata?.full_name ||
data.user.user_metadata?.name ||
data.user.email ||
"المستخدم الحالي";

}

}catch(e){

console.log(e);

}

}

function closeInvoice(){

document
.getElementById("invoiceModal")
.classList.add("hidden");

document
.getElementById("invoiceModal")
.classList.remove("flex");

}

function printInvoice(){

const content =
document.getElementById("invoiceContent").innerHTML;

const w = window.open("", "_blank");

w.document.write(`

<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>فاتورة</title>

<style>

body{

font-family:Cairo,Arial;

padding:25px;

direction:rtl;

}

table{

width:100%;

border-collapse:collapse;

margin-top:15px;

}

th{

background:#1e40af;

color:#fff;

padding:10px;

border:1px solid #ccc;

}

td{

padding:8px;

border:1px solid #ccc;

text-align:center;

}

@media print{

body{

margin:0;

}

}

</style>

</head>

<body>

${content}

<script>

window.onload=function(){

window.print();

window.close();

}

<\/script>

</body>

</html>

`);

w.document.close();

}
// ================= LOAD MASTER =================
async function loadMaster(){

const [{data:c},{data:p}] = await Promise.all([
supabaseClient.from("customers").select("*"),
supabaseClient.from("products").select("*")
]);

customers = c || [];
products = p || [];

customerMap = new Map(customers.map(c=>[c.id_customer,c]));
productMap = new Map(products.map(p=>[p.id_product,p]));

}

// ================= LOAD DETAILS (FAST) =================
async function loadDetails(){

const {data} = await supabaseClient
.from("orders_details")
.select("*");

details = data || [];

// group by order
detailsMap.clear();

details.forEach(d=>{
if(!detailsMap.has(d.id_order)) detailsMap.set(d.id_order,[]);
detailsMap.get(d.id_order).push(d);
});

}

// ================= LOAD ORDERS =================
async function loadOrders(){

const {data} = await supabaseClient
.from("orders_o")
.select("*")
.order("id_order",{ascending:false});

orders = data || [];

renderOrders();

}

// ================= RENDER =================
function renderOrders(){

let html = "";

orders.forEach(o=>{

const cust = customerMap.get(o.customer_id);
const d = detailsMap.get(o.id_order)||[];

const total = d.reduce((s,x)=>s+Number(x.total_amount||0),0);

html += `
<tr onclick="openOrder(${o.id_order})">
<td>${o.id_order}</td>
<td>${cust?.first_name||"-"}</td>
<td>${money(total)}</td>
</tr>
`;

});

document.getElementById("invoices").innerHTML =
html || "<tr><td colspan='3'>لا يوجد بيانات</td></tr>";

}

// ================= OPEN ORDER =================
function openOrder(id){

const order = orders.find(o=>o.id_order===id);

if(!order) return;

const cust = customerMap.get(order.customer_id);

const d = detailsMap.get(id) || [];

let total = 0;

let rows = "";

d.forEach((x,i)=>{

const p = productMap.get(x.id_product);

total += Number(x.total_amount||0);

rows += `
<tr>
<td>${i+1}</td>
<td>${p?.product_name||"-"}</td>
<td>${x.qte}</td>
<td>${money(x.price)}</td>
<td>${money(x.total_amount)}</td>
</tr>
`;

});

const invoiceDate = order.created_at || order.date_order || order.date;

const invoiceDateObj = new Date(invoiceDate);

const date = invoiceDateObj.toLocaleDateString("ar-EG");

const time = invoiceDateObj.toLocaleTimeString("ar-EG");

document.getElementById("invoiceContent").innerHTML = `

<div class="relative border-2 border-gray-300 rounded-lg overflow-hidden">

<div class="bg-blue-800 text-white text-center p-4">
<div class="text-center mb-4">

<img
src="logo.png"
class="w-20 h-20 mx-auto"
onerror="this.style.display='none'">

<h1 class="text-3xl font-bold text-blue-800">

اسم المؤسسة

</h1>

<div class="text-gray-500">

السودان

</div>

</div>
<div class="absolute left-8 top-6 rotate-[-20deg]">

<span class="border-4 border-green-600
text-green-600
text-2xl
font-bold
px-6
py-2
rounded-full">

مدفوعة

</span>

</div>
<h2 class="text-2xl font-bold">
فاتورة البيع
</h2>

<div class="text-sm mt-1">

رقم الفاتورة :
<b>${id}</b>

</div>

</div>

<div class="grid grid-cols-2 gap-3 p-4 text-sm">

<div>
<b>العميل :</b>
${cust?.first_name || "-"}
</div>

<div>
<b>البائع :</b>
${sellerName}
</div>

<div>
<b>التاريخ :</b>
${date}
</div>

<div>
<b>الوقت :</b>
${time}
</div>

</div>

<table class="w-full border-collapse">

<thead>

<tr class="bg-gray-100">

<th class="border p-2">#</th>

<th class="border p-2">المنتج</th>

<th class="border p-2">الكمية</th>

<th class="border p-2">السعر</th>

<th class="border p-2">الإجمالي</th>

</tr>

</thead>

<tbody>

${rows}

</tbody>

</table>

<div class="flex justify-end p-5">

<div class="bg-green-600 text-white px-8 py-4 rounded-xl shadow-lg">

الإجمالي

<div class="text-3xl font-bold">

${money(total)}

</div>

</div>

</div>
<div class="mt-6 border-t pt-4">

<div class="grid grid-cols-2 gap-8">

<div class="text-center">

<div class="border-t border-gray-500 mt-10"></div>

<div class="mt-2 text-sm text-gray-600">
توقيع البائع
</div>

</div>

<div class="text-center">

<div class="border-t border-gray-500 mt-10"></div>

<div class="mt-2 text-sm text-gray-600">
توقيع العميل
</div>

</div>

</div>

<div class="mt-8 bg-gray-100 rounded-lg p-4 text-center">

<div class="text-xl font-bold text-blue-800">

شكراً لتعاملكم معنا

</div>

<div class="text-sm text-gray-600 mt-2">

نتمنى لكم يوماً سعيداً

</div>

</div>

</div>
`;
<div class="text-center mt-6">

<img

src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=Invoice-${id}">

</div> ;
document.getElementById("invoiceModal")
.classList.remove("hidden");

document.getElementById("invoiceModal")
.classList.add("flex");

}

// ================= STATS =================
async function loadStats(){

const [{data:o},{data:d}] = await Promise.all([
supabaseClient.from("orders_o").select("*"),
supabaseClient.from("orders_details").select("total_amount")
]);

const total = (d||[]).reduce((s,x)=>s+Number(x.total_amount||0),0);

document.getElementById("sales").innerText = money(total);
document.getElementById("invCount").innerText = o.length;
document.getElementById("cusCount").innerText = customers.length;
document.getElementById("proCount").innerText = products.length;

}

// ================= INIT =================
async function init(){

console.log("loading...");

await loadCurrentUser();

await loadMaster();

await loadDetails();

await loadOrders();

await loadStats();

console.log("done");

}
  init();
</script>

</body>
</html>
