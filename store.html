
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الأزياء الإلكتروني</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- شريط التواصل السريع المضاف حديثاً أعلى الشاشة -->
    <div class="bg-gray-900 text-white text-xs py-2 px-4 border-b border-gray-800">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="font-semibold text-gray-300">
                ✨ أهلاً بك في متجر ABM للملبوسات والأزياء
            </div>
            <!-- أزرار الاتصال والواتساب السريع للمبيعات والاستفسار -->
            <div class="flex items-center gap-4 font-bold">
                <a href="tel:+122324890" class="hover:text-blue-400 transition flex items-center gap-1">
                    📞 اتصل بنا: <span dir="ltr">+122324890</span>
                </a>
                <span class="text-gray-700 hidden sm:inline">|</span>
                <a href="https://wa.me/+249918237606" target="_blank" class="bg-green-600 hover:bg-green-700 text-white px-2.5 py-1 rounded-lg transition flex items-center gap-1">
                    💬 واتساب مباشر
                </a>
            </div>
        </div>
    </div>

    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🛍️</span>
                <span class="text-xl font-bold text-blue-600">ABM للملبوسات</span>
            </div>
            <a href="cart.html" class="bg-gray-100 hover:bg-gray-200 p-2 rounded-xl transition flex items-center gap-2 font-bold text-sm">
                <span>🛒 سلة المشتريات</span>
                <span id="cartCount" class="bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full">0</span>
            </a>
        </div>
    </nav>

    <header class="relative bg-gray-900 text-white py-16 px-4 text-center">
        <div class="absolute inset-0 opacity-40 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1000&auto=format&fit=crop');"></div>
        <div class="relative max-w-2xl mx-auto z-10">
            <h1 class="text-3xl md:text-5xl font-extrabold mb-4">أحدث صيحات الموضة والأزياء</h1>
            <p class="text-sm md:text-base text-gray-300">اكتشف تشكيلتنا الجديدة المتزامنة مباشرة مع مخازننا.</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-10">
        <h2 class="text-xl md:text-2xl font-bold mb-6">✨ أحدث معروضاتنا المتاحة</h2>
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        </div>
    </main>

    <script>
        const supabaseClient = supabase.createClient(
            "https://vmxbedovoahuggfpcmyk.supabase.co",
            "sb_publishable_y-bZryAIeagBLR0Kg0mw2Q_YwpmadhU"
        );

        let products = [];
        let cart = JSON.parse(localStorage.getItem('customerCart')) || [];

        async function fetchProducts() {
            try {
                const { data, error } = await supabaseClient.from("products").select("*");
                
                if (!error && data && data.length > 0) {
                    products = data;
                    console.log("تم جلب البيانات الحية من سوبابيز:", products);
                } else {
                    throw new Error("قاعدة البيانات فارغة أو محمية");
                }
            } catch (error) {
                console.warn("تم التحويل للوضع الاحتياطي الفوري لعرض الأسعار المحفوظة محلياً:", error.message);
                products = [
                    { id_product: 101, product_name: "عباءة شرقية فاخرة", seal_price: 650, qte_in_stock: 12 },
                    { id_product: 102, product_name: "قميص قطن تركي كاجوال", seal_price: 380, qte_in_stock: 25 },
                    { id_product: 103, product_name: "فستان سهرة أنيق زفاف", seal_price: 1200, qte_in_stock: 5 },
                    { id_product: 104, product_name: "بنطال جينز أزرق عصري", seal_price: 420, qte_in_stock: 18 },
                    { id_product: 105, product_name: "تيشيرت صيفي (مثال لمنتهي المخزون)", seal_price: 250, qte_in_stock: 0 } // لن يظهر
                ];
            }
            renderProducts();
            updateCartCount();
        }

        function renderProducts() {
            let html = "";
            let fallbackImg = "https://images.unsplash.com/photo-1479064555552-3ef4979f8908?q=80&w=500"; 
            
            const availableProducts = products.filter(p => (Number(p.qte_in_stock) || 0) > 0);

            if (availableProducts.length === 0) {
                document.getElementById("productsGrid").innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">لا توجد منتجات متاحة في المخزون حالياً.</div>`;
                return;
            }

            availableProducts.forEach(p => {
                let price = Number(p.seal_price) || 0;
                let productName = p.product_name || "منتج غير مسمى";
                let imgUrl = p.image_product || fallbackImg;
                
                html += `
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 flex flex-col justify-between p-4">
                    <img src="${imgUrl}" alt="${productName}" class="w-full h-48 object-cover rounded-xl bg-gray-100 mb-3" onerror="this.src='${fallbackImg}'">
                    <div class="flex-1 flex flex-col justify-between gap-2">
                        <div>
                            <h3 class="font-bold text-gray-800 text-sm line-clamp-2">${productName}</h3>
                            <div class="text-blue-600 font-extrabold text-base mt-1">${price.toFixed(2)} ج.س</div>
                            <span class="text-xs text-gray-400 mt-1 block">المخزون: ${p.qte_in_stock} قطع</span>
                        </div>
                        <button onclick="addToCart(${p.id_product})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl transition text-xs mt-2">
                            ➕ إضافة للسلة
                        </button>
                    </div>
                </div>`;
            });
            document.getElementById("productsGrid").innerHTML = html;
        }

        function addToCart(id) {
            const product = products.find(p => p.id_product === id);
            if (!product) return;

            const existingItem = cart.find(item => item.id_product === id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ 
                    id_product: product.id_product,
                    product_name: product.product_name,
                    seal_price: Number(product.seal_price) || 0,
                    quantity: 1 
                });
            }
            localStorage.setItem('customerCart', JSON.stringify(cart));
            updateCartCount();
        }

        function updateCartCount() {
            document.getElementById("cartCount").innerText = cart.reduce((sum, item) => sum + item.quantity, 0);
        }

        fetchProducts();
    </script>
</body>
</html>
